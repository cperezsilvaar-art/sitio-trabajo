        copias: '',
        webhook: '',
        linkParteDiario: '',      // formulario que se comparte por WhatsApp
        endpointPartes: '',       // de dónde se traen los partes cargados
        parametros: Object.assign({}, PARAMETROS_DEFECTO)
      },
      sucursales,
      visitas: [],
      partes: []                          // parte diario de asistencia
    };
  }

  function visitaNueva(sucursalId) {
    const hoy = new Date();
    const periodo = hoy.toISOString().slice(0, 7);
    return {
      id: uid(),
      sucursalId,
      fecha: hoy.toISOString().slice(0, 10),
      periodo,
      coordinador: estado.config.coordinador || '',
      minutaGerente: { participante: '', puntos: '', acuerdos: '' },
      minutaColaborador: { nombre: '', posicion: '', feedback: '' },
      posiciones: POSICIONES.map(p => ({
        rol: p.nombre, heads: '', diasAltas: '', diasBajas: '', diasAusentes: '',
        horasExtras: '', sueldoBruto: '', costoHE: '', bonos: '', cargasManual: ''
      })),
      ausentismo: { detalle: {} },
      rotacion: { dotacionAnterior: '', altasExternas: '', altasInternas: '', bajasExternas: '', bajasInternas: '' },
      movimientos: [],
      sanciones: [],
      sucesion: [],
      comercial: { venta: '', ventaRed: '', tickets: '', horasTrabajadas: '' },
      diagnostico: { hallazgos: '', impacto: '', plan: [] },
      envio: { enviado: false, fecha: null, destinatario: null, via: null, historial: [] },
      creada: hoy.toISOString()
    };
  }

  /* Migración defensiva: completa claves que falten en respaldos viejos. */
  function normalizar(e) {
    const base = estadoInicial();
    if (!e || typeof e !== 'object') return base;
    e.version = 1;
    e.config = Object.assign({}, base.config, e.config || {});
    if (!String(e.config.coordinador || '').trim()) e.config.coordinador = base.config.coordinador;
    if (!String(e.config.area || '').trim()) e.config.area = base.config.area;
    e.config.gerenteOperaciones = Object.assign({}, base.config.gerenteOperaciones, e.config.gerenteOperaciones || {});
    e.config.parametros = Object.assign({}, PARAMETROS_DEFECTO, e.config.parametros || {});
    e.sucursales = Array.isArray(e.sucursales) ? e.sucursales : base.sucursales;
    if (!Array.isArray(e.config.gerentesOperaciones) || !e.config.gerentesOperaciones.length) {
      e.config.gerentesOperaciones = GERENTES_OPERACIONES_AREA3.map(g => Object.assign({}, g));
    }
    /* Corrección de campos que se cargaron mal la primera vez: el área tiene un
       solo Gerente de Operaciones —Eduardo José Páez Márquez—, todas las
       tiendas operan bajo la marca Farmatodo, y los dos nombres que traía la
       tercera columna del padrón no son referentes de ninguna sucursal. */
    if (e.config.gerentesOperaciones.every(g => NOMBRES_A_LIMPIAR.includes(g.nombre) && !String(g.email || '').trim())) {
      e.config.gerentesOperaciones = GERENTES_OPERACIONES_AREA3.map(g => Object.assign({}, g));
    }
    if (!String((e.config.gerenteOperaciones || {}).email || '').trim()) {
      e.config.gerenteOperaciones = Object.assign({}, GERENTES_OPERACIONES_AREA3[0]);
    }

    e.sucursales = e.sucursales.map(s => sucursalNueva(s));
    e.sucursales.forEach(s => {
      if (NOMBRES_A_LIMPIAR.includes(s.gerenteOperaciones)) {
        s.gerenteOperaciones = GERENTES_OPERACIONES_AREA3[0].nombre;
      }
      if (NOMBRES_A_LIMPIAR.includes(s.supervisor)) s.supervisor = '';
      if (s.marca && s.marca !== MARCA_AREA) {
        if (!s.operador) s.operador = s.marca;
        s.marca = MARCA_AREA;
      }
      // Los turnos se derivan del horario la primera vez y quedan editables
      if (!s.turnos) s.turnos = turnosPorDefecto(s);
    });
    e.sucursales.forEach(s => {
      if (!s.id) s.id = uid();
      if (!Array.isArray(s.colaboradores)) s.colaboradores = [];
      s.colaboradores.forEach(c => {
        if (!c.id) c.id = uid();
        if (!Array.isArray(c.historial)) c.historial = [];
        if (c.activo === undefined) c.activo = true;
      });
    });
    e.visitas = Array.isArray(e.visitas) ? e.visitas : [];
    e.partes = Array.isArray(e.partes) ? e.partes : [];
    e.partes.forEach(p => {
      if (!p.id) p.id = uid();
      if (!Array.isArray(p.ausencias)) p.ausencias = [];
      if (!Array.isArray(p.horasExtras)) p.horasExtras = [];
    });
    e.visitas.forEach(v => {
      v.minutaGerente = Object.assign({ participante: '', puntos: '', acuerdos: '' }, v.minutaGerente || {});
      v.minutaColaborador = Object.assign({ nombre: '', posicion: '', feedback: '' }, v.minutaColaborador || {});
      v.ausentismo = Object.assign({ detalle: {} }, v.ausentismo || {});
      v.rotacion = Object.assign({ dotacionAnterior: '', altasExternas: '', altasInternas: '', bajasExternas: '', bajasInternas: '' }, v.rotacion || {});
      v.comercial = Object.assign({ venta: '', ventaRed: '', tickets: '', horasTrabajadas: '' }, v.comercial || {});
      v.diagnostico = Object.assign({ hallazgos: '', impacto: '', plan: [] }, v.diagnostico || {});
      v.envio = Object.assign({ enviado: false, fecha: null, destinatario: null, via: null, historial: [] }, v.envio || {});
      ['posiciones', 'movimientos', 'sanciones', 'sucesion'].forEach(k => {
        if (!Array.isArray(v[k])) v[k] = [];
      });
      // Los planes anteriores no distinguían a cargo de quién estaba cada acción
      v.diagnostico.plan.forEach(x => {
        if (!x.aCargo) x.aCargo = 'tienda';
        if (!x.prioridad) x.prioridad = 'Media';
      });
    });
    return e;
  }

  /**
   * Carga el estado. Con cifrador, descifra lo guardado; sin él, lee en claro.
   * @throws si hay contenido cifrado que no se puede descifrar, para no pisar
   *         datos que todavía se pueden recuperar con la clave correcta.
   */
  async function cargar(cif) {
    cifrador = cif || null;
    let crudo = null;
    try {
      crudo = localStorage.getItem(CLAVE_ALMACEN);
    } catch (err) {
      console.warn('No se pudo leer el almacenamiento local.', err);
    }
    if (!crudo) { estado = estadoInicial(); return estado; }

    try {
      const plano = cifrador ? await cifrador.descifrar(crudo) : crudo;
      estado = normalizar(JSON.parse(plano));
      return estado;
    } catch (err) {
      if (!cifrador) {
        console.warn('El contenido guardado no se pudo leer, se inicia vacío.', err);
        estado = estadoInicial();
        return estado;
      }
    }

    /* Con cifrador y sin poder descifrar hay dos casos. Puede ser contenido en
       claro de antes de poner la clave, que corresponde migrar; o contenido
       cifrado ilegible, que no hay que pisar. Se distinguen por la forma: solo
       se acepta como claro lo que tiene la estructura del tablero. */
    try {
      const obj = JSON.parse(crudo);
      if (obj && Array.isArray(obj.sucursales)) {
        estado = normalizar(obj);
        guardar();                 // de acá en más queda cifrado
        return estado;
      }
    } catch (e) { /* ni cifrado legible ni claro válido */ }

    throw new Error('No se pudo descifrar el contenido guardado.');
  }

  /**
   * Persiste el estado. El cifrado es asíncrono, así que las escrituras se
   * encadenan: siempre gana la última y nunca se cruzan entre sí.
   */
  function guardar() {
    const instantanea = JSON.stringify(estado);
    colaDeGuardado = colaDeGuardado.then(async () => {
      try {
        const aGuardar = cifrador ? await cifrador.cifrar(instantanea) : instantanea;
        localStorage.setItem(CLAVE_ALMACEN, aGuardar);
      } catch (err) {
        console.warn('No se pudo guardar en el almacenamiento local.', err);
      }
    });
    suscriptores.forEach(fn => fn(estado));
  }

  return {
    uid,
    init: cargar,
    cifrado: () => !!cifrador,
    get: () => estado,
    save: guardar,
    onChange: fn => suscriptores.push(fn),

    /* ------------------------- sucursales ------------------------- */
    sucursal(id) { return this.get().sucursales.find(s => s.id === id) || null; },

    etiquetaSucursal(s) {
      if (!s) return '—';
      return s.nombre && s.nombre.trim() ? `${s.nombre.trim()} (${s.codigo})` : s.codigo;
    },

    agregarSucursal() {
      const e = this.get();
      const usados = e.sucursales
        .map(s => parseInt((s.codigo.match(/^sucursal(\d+)$/) || [])[1], 10))
        .filter(n => !isNaN(n));
      const n = usados.length ? Math.max(...usados) + 1 : 1;
      const s = sucursalNueva({ codigo: 'sucursal' + n });
      s.turnos = turnosPorDefecto(s);
      e.sucursales.push(s);
      guardar();
      return s;
    },

    eliminarSucursal(id) {
      const e = this.get();
      e.sucursales = e.sucursales.filter(s => s.id !== id);
      e.visitas = e.visitas.filter(v => v.sucursalId !== id);
      guardar();
    },

    /**
     * Incorpora el padrón del Área 3. No pisa lo ya cargado: en las sucursales
     * que ya existen solo completa los campos vacíos.
     */
    cargarPadronArea3() {
      const e = this.get();
      const clave = x => String(x || '').trim().toUpperCase();
      let nuevas = 0, completadas = 0;

      SUCURSALES_AREA3.forEach(fila => {
        const existente = e.sucursales.find(s =>
          clave(s.codigo) === clave(fila.codigo) ||
          (s.nombre && clave(s.nombre) === clave(fila.nombre)));

        if (!existente) {
          const nueva = sucursalNueva(fila);
          nueva.turnos = turnosPorDefecto(nueva);
          e.sucursales.push(nueva);
          nuevas++;
          return;
        }

        let toco = false;
        Object.keys(fila).forEach(k => {
          if (k === 'id') return;
          if (!String(existente[k] ?? '').trim() && String(fila[k] ?? '').trim()) {
            existente[k] = fila[k];
            toco = true;
          }
        });
        if (toco) completadas++;
      });

      guardar();
      return { nuevas, completadas };
    },

    /* ------------------------- parte diario ----------------------- */
    parteDe(sucursalId, fecha) {
      return this.get().partes.find(p => p.sucursalId === sucursalId && p.fecha === fecha) || null;
    },

    /** Devuelve el parte del día, creándolo si todavía no existe. */
    asegurarParte(sucursalId, fecha) {
      const e = this.get();
      let p = this.parteDe(sucursalId, fecha);
      if (!p) {
        p = { id: uid(), sucursalId, fecha, reportadoPor: '', sinNovedad: false,
              ausencias: [], horasExtras: [], creado: new Date().toISOString(),
              origen: 'panel' };
        e.partes.push(p);
        guardar();
      }
      return p;
    },

    eliminarParte(id) {
      const e = this.get();
      e.partes = e.partes.filter(p => p.id !== id);
      guardar();
    },

    /**
     * Incorpora partes que llegan del formulario externo. Cada fila trae la
     * sucursal por nombre o por código; las que no se reconocen se devuelven
     * para que el coordinador vea qué quedó afuera en lugar de perderse.
     */
    importarPartes(filas) {
      const e = this.get();
      const norm = x => String(x || '').trim().toUpperCase();
      let nuevos = 0, actualizados = 0;
      const sinReconocer = [];

      (filas || []).forEach(f => {
        const suc = e.sucursales.find(s =>
          norm(s.codigo) === norm(f.sucursal) || norm(s.nombre) === norm(f.sucursal));
        if (!suc || !f.fecha) { sinReconocer.push(f); return; }

        let p = e.partes.find(x => x.sucursalId === suc.id && x.fecha === f.fecha);
        if (!p) {
          p = { id: uid(), sucursalId: suc.id, fecha: f.fecha, reportadoPor: f.reportadoPor || '',
                sinNovedad: !!f.sinNovedad, ausencias: [], horasExtras: [],
                creado: new Date().toISOString(), origen: 'formulario' };
          e.partes.push(p);
          nuevos++;
        } else {
          actualizados++;
          if (f.reportadoPor) p.reportadoPor = f.reportadoPor;
        }
        if (!Array.isArray(p.horasExtras)) p.horasExtras = [];
        (f.horasExtras || []).forEach(h => {
          if (!h.colaborador && !h.horas) return;
          /* Las horas se piden al día siguiente: se guardan en el parte del
             día en que se trabajaron, no en el que se reportaron. */
          const dia = String(h.fecha || f.fechaHoras || f.fecha).slice(0, 10);
          let destino = p;
          if (dia !== p.fecha) {
            destino = e.partes.find(x => x.sucursalId === suc.id && x.fecha === dia);
            if (!destino) {
              destino = { id: uid(), sucursalId: suc.id, fecha: dia, reportadoPor: f.reportadoPor || '',
                          sinNovedad: false, ausencias: [], horasExtras: [],
                          creado: new Date().toISOString(), origen: 'formulario' };
              e.partes.push(destino);
              nuevos++;
            }
            if (!Array.isArray(destino.horasExtras)) destino.horasExtras = [];
          }
          const yaEsta = destino.horasExtras.some(x =>
            norm(x.colaborador) === norm(h.colaborador) && x.motivo === h.motivo);
          if (!yaEsta) {
            destino.horasExtras.push({
              colaborador: h.colaborador || '', posicion: h.posicion || '',
              horas: h.horas || '', motivo: h.motivo || 'afluencia',
              autorizadoPor: h.autorizadoPor || '', notas: h.notas || ''
            });
          }
        });

        if (f.sinNovedad) { p.sinNovedad = true; return; }

        (f.ausencias || []).forEach(a => {
          const yaEsta = p.ausencias.some(x =>
            norm(x.colaborador) === norm(a.colaborador) && x.turno === a.turno);
          if (!yaEsta) {
            p.ausencias.push({
              colaborador: a.colaborador || '', posicion: a.posicion || '',
              turno: a.turno || 'manana', motivo: a.motivo || 'otro',
              aviso: a.aviso || 'no', quienAviso: a.quienAviso || '',
              horaAviso: a.horaAviso || '', notas: a.notas || ''
            });
            p.sinNovedad = false;
          }
        });
      });

      guardar();
      return { nuevos, actualizados, sinReconocer };
    },

    /* ------------------------- colaboradores ---------------------- */
    agregarColaborador(sucursalId, datos) {
      const s = this.sucursal(sucursalId);
      if (!s) return null;
      const c = Object.assign({
        id: uid(), nombre: '', posicion: '', fechaIngreso: '', activo: true,
        desempeno: null, potencial: null, fechaEvaluacion: '', evaluadoCon: '',
        estudia: '', carrera: '', avanceEstudio: '', formacionPrevia: '',
        interesDesarrollo: '', aspiracion: '', movilidad: '',
        fortalezas: '', aDesarrollar: '', riesgoSalida: '', notas: '',
        historial: []
      }, datos || {});
      s.colaboradores.push(c);
      guardar();
      return c;
    },

    colaborador(sucursalId, colabId) {
      const s = this.sucursal(sucursalId);
      return s ? (s.colaboradores.find(c => c.id === colabId) || null) : null;
    },

    eliminarColaborador(sucursalId, colabId) {
      const s = this.sucursal(sucursalId);
      if (!s) return;
      s.colaboradores = s.colaboradores.filter(c => c.id !== colabId);
      guardar();
    },

    /* --------------------------- visitas -------------------------- */
    visita(id) { return this.get().visitas.find(v => v.id === id) || null; },

    visitasDe(sucursalId) {
      return this.get().visitas
        .filter(v => v.sucursalId === sucursalId)
        .sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    },

    ultimaVisita(sucursalId) { return this.visitasDe(sucursalId)[0] || null; },

    crearVisita(sucursalId) {
      const e = this.get();
      const v = visitaNueva(sucursalId);
      e.visitas.push(v);
      guardar();
      return v;
    },

    eliminarVisita(id) {
      const e = this.get();
      e.visitas = e.visitas.filter(v => v.id !== id);
      guardar();
    },

    /* ------------------------- respaldos -------------------------- */
    exportar() {
      return guardarArchivo(
        `rrhh-farmatodo-${new Date().toISOString().slice(0, 10)}.json`,
        JSON.stringify(this.get(), null, 2),
        'application/json'
      );
    },

    importar(texto) {
      const datos = JSON.parse(texto);
      estado = normalizar(datos);
      guardar();
      return estado;
    },

    reiniciar() {
      estado = estadoInicial();
      guardar();
    },

    /* Datos de ejemplo para recorrer el tablero antes de cargar información
       real. Reemplaza todo el contenido, así nunca se mezcla con datos de
       verdad; “Borrar todo” lo deja limpio de nuevo. */
    cargarEjemplo() {
      const e = estadoInicial();
      e.config.coordinador = estadoInicial().config.coordinador;
      e.config.gerenteOperaciones = { nombre: 'Gerencia de Operaciones', email: '' };

      const demo = [
        { nombre: 'Sucursal de ejemplo A', gerente: 'Gerente de Tienda 1',
          pos: [[1,0,0,0,0,2800000,0,0],[2,0,0,0,0,3600000,0,0],[6,18,0,22,86,8400000,310000,0],
                [1,0,0,0,0,3100000,0,0],[1,0,0,0,0,2600000,0,0],[1,0,0,9,0,1900000,0,0]],
          aus: { '085': 14, '071': 9, '081': 5, '086': 3 },
          rot: ['12','1','0','1','0'], venta: '395000000', tickets: '38000', horas: '5600' },

/*
 * reporte.js — Armado del reporte de visita y envío al Gerente de Operaciones.
 *
 * El reporte respeta el formato acordado:
 *   1. Minuta de reuniones
 *   2. Matriz de FTE Real y Costo Laboral
 *   3. Diagnóstico y acciones recomendadas
 *
 * Los campos sin cargar se marcan como [PENDIENTE] en lugar de omitirse, para
 * que el Gerente de Operaciones vea qué información falta relevar.
 */

const PENDIENTE = '[PENDIENTE]';

const ETIQUETA_NOTIFICADA = {
  si: 'notificada y firmada',
  sinFirma: 'notificada sin firma',
  no: 'sin notificar'
};

const ETIQUETA_A_CARGO = {
  tienda: 'Gerente de Tienda',
  rrhh: 'RRHH',
  operaciones: 'Operaciones',
  otro: 'Otro'
};

const fmtNum = (n, d = 2) => {
  if (n === null || n === undefined || n === '' || isNaN(n)) return PENDIENTE;
  // El "+ 0" convierte el -0 que deja el redondeo en 0, para no mostrar "-0,00".
  const v = Number(Number(n).toFixed(d)) + 0;
  return v.toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });
};

const fmtMoneda = (n, moneda = '$') =>
  (n === null || n === undefined || n === '' || isNaN(n))
    ? PENDIENTE
    : moneda + ' ' + Number(n).toLocaleString('es-AR', { minimumFractionDigits: 0, maximumFractionDigits: 0 });

const fmtPct = (n, d = 2) =>
  (n === null || n === undefined || isNaN(n))
    ? PENDIENTE
    : (n * 100).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';

const oPendiente = t => (t && String(t).trim()) ? String(t).trim() : PENDIENTE;

const fmtFecha = f => {
  if (!f) return PENDIENTE;
  const [a, m, d] = String(f).split('-');
  return d ? `${d}/${m}/${a}` : f;
};

const Reporte = (() => {

  /** Reúne todos los cálculos de una visita en un solo objeto. */
  function calcular(visita, sucursal, config) {
    const par = config.parametros;
    const matriz = calcularMatriz(visita.posiciones, par);
    const ausentismo = calcularAusentismo(visita.ausentismo.detalle, matriz.total.diasTrabajados, matriz.total.diasAusentes);
    const rotacion = calcularRotacion(visita.rotacion);
    const bajas = agruparBajas(visita.movimientos);
    const sucesion = evaluarSucesion(visita.sucesion);
    const dotacion = calcularDotacionOptima({
      tipo: sucursal.tipo,
      empleados: matriz.total.heads,
      costoLaboralReal: matriz.total.costoTotal,
      venta: visita.comercial.venta,
      ventaRed: visita.comercial.ventaRed
    }, par);
    const productividad = calcularProductividad({
      tickets: visita.comercial.tickets,
      horasTrabajadas: visita.comercial.horasTrabajadas
    }, par);
    const hallazgosAuto = generarHallazgos(visita, par);
    const talento = distribucion9Box(sucursal.colaboradores);

    return { matriz, ausentismo, rotacion, bajas, sucesion, dotacion, productividad, hallazgosAuto, talento, par };
  }

  /** Tabla de FTE en texto plano, alineada en columnas. */
  function tablaFteTexto(matriz, moneda) {
    const cols = [
      ['Posición', 20], ['Mes compl.', 11], ['Días Aus.', 10], ['Hs. Extras', 11],
      ['Días Vínc.', 11], ['FTE Real', 9], ['Costo Total', 16], ['Costo / FTE', 16]
    ];
    const linea = c => c.map(([t, w]) => String(t).padEnd(w)).join(' ');
    const sep = '-'.repeat(cols.reduce((s, c) => s + c[1] + 1, 0));

    const fila = f => linea([
      [f.rol, 20],
      [f.heads || 0, 11],
      [fmtNum(f.diasAusentes, 0), 10],
      [fmtNum(f.horasExtras, 0), 11],
      [fmtNum(f.diasTrabajados, 0), 11],
      [fmtNum(f.fteReal), 9],
      [fmtMoneda(f.costoTotal || null, moneda), 16],
      [f.costoPorFte === null ? PENDIENTE : fmtMoneda(f.costoPorFte, moneda), 16]
    ]);

    return [linea(cols), sep, ...matriz.filas.map(fila), sep, fila(matriz.total)].join('\n');
  }

  /** Reporte completo en texto plano (el que viaja en el cuerpo del email). */
  function texto(visita, sucursal, config) {
    const c = calcular(visita, sucursal, config);
    const moneda = c.par.moneda || '$';
    const L = [];
    const barra = '='.repeat(60);

    L.push(barra);
    L.push('REPORTE DE VISITA A SUCURSAL - FARMATODO');
    // Si el área ya se llama "Área 3", no repetir la palabra en la etiqueta
    if (config.area) L.push('Área: ' + String(config.area).replace(/^\s*[áa]rea\s+/i, ''));
    L.push('Sucursal: ' + Store.etiquetaSucursal(sucursal) +
           (sucursal.marca ? ` · ${sucursal.marca}` : '') +
           (sucursal.localidad ? ` · ${sucursal.localidad}` : ''));
    if (sucursal.gerenteOperaciones) L.push('Gerente de Operaciones: ' + sucursal.gerenteOperaciones);
    L.push('Fecha de Visita: ' + fmtFecha(visita.fecha));
    L.push('Período analizado: ' + oPendiente(visita.periodo));
    L.push('Coordinador de RRHH: ' + oPendiente(visita.coordinador || config.coordinador));
    L.push('Gerente de Tienda: ' + oPendiente(sucursal.gerente));
    L.push(barra);
    L.push('');

    /* 1. Minutas */
    L.push('1. MINUTA DE REUNIONES');
    L.push('- Reunión Gerente de Tienda:');
    L.push('  * Participante: ' + oPendiente(visita.minutaGerente.participante || sucursal.gerente));
    L.push('  * Puntos Tratados:');
    L.push(bloque(visita.minutaGerente.puntos, '      '));
    L.push('  * Acuerdos y Compromisos:');
    L.push(bloque(visita.minutaGerente.acuerdos, '      '));
    L.push('- Reunión Colaborador:');
    L.push('  * Colaborador (Nombre y Posición): ' +
      oPendiente([visita.minutaColaborador.nombre, visita.minutaColaborador.posicion].filter(Boolean).join(' — ')));
    L.push('  * Feedback y Temas de Clima Laboral:');
    L.push(bloque(visita.minutaColaborador.feedback, '      '));
    L.push('');

    /* 2. Matriz FTE */
    L.push('2. MATRIZ DE FTE REAL Y COSTO LABORAL');
    L.push('   "Mes compl." son las personas que cubrieron los ' + c.par.diasMes + ' días. Quien ingresó o egresó');
    L.push('   durante el mes no figura ahí: sus días efectivos están sumados en "Días Vínc.".');
    L.push(tablaFteTexto(c.matriz, moneda));
    L.push('');
    L.push(`   FTE Real total: ${fmtNum(c.matriz.total.fteReal)} sobre una dotación equivalente de ` +
           `${fmtNum(c.matriz.total.fteVinculo)} personas (${c.matriz.total.heads} de mes completo más los días de ingresos y egresos).`);
    L.push(`   Brecha de cobertura: ${fmtNum(c.matriz.total.brechaFte)} FTE por ausencias, neto de horas extras.`);
    L.push(`   Costo laboral total: ${fmtMoneda(c.matriz.total.costoTotal || null, moneda)} · ` +
           `Costo promedio por FTE: ${c.matriz.total.costoPorFte === null ? PENDIENTE : fmtMoneda(c.matriz.total.costoPorFte, moneda)}`);
    L.push(`   Cargas sociales aplicadas con factor ${fmtNum(c.par.factorCargas)} sobre los brutos.`);
    L.push('');

    /* 3. Indicadores */
    L.push('3. INDICADORES DE PERSONAL DEL PERÍODO');
    L.push(`- Ausentismo total: ${fmtPct(c.ausentismo.pctTotal)} (${c.ausentismo.totalDias} días sobre ${c.ausentismo.diasDisponibles} de vínculo).`);
    if (c.ausentismo.sinApertura) {
      L.push('  * Sin apertura por concepto: el dato surge de la columna “Días ausentes” de la matriz de FTE.');
    } else {
      c.ausentismo.grupos.forEach(g => {
        L.push(`  * ${g.nombre}: ${g.dias} días (${fmtPct(g.pct)})`);
      });
      L.push(`  * Días gestionables por la tienda: ${c.ausentismo.diasGestionables} (${fmtPct(c.ausentismo.pctGestionable)})`);
    }
    L.push(`- Horas extras: ${fmtNum(c.matriz.total.horasExtras, 0)} hs, equivalentes a ${fmtNum(c.matriz.total.horasExtras / c.par.horasMes)} FTE ` +
           `(${fmtPct(c.matriz.total.ratioExtras)} de las horas teóricas).`);
    if (typeof acumuladoMes === 'function' && typeof Store !== 'undefined') {
      const ac = acumuladoMes(Store.get().partes, visita.sucursalId, visita.periodo);
      if (ac.horas) {
        const det = MOTIVOS_HORAS
          .map(m => ({ m, h: ac.horasPorMotivo[m.id] || 0 })).filter(x => x.h)
          .sort((x, y) => y.h - x.h)
          .map(x => `${x.m.nombre.toLowerCase()} ${fmtNum(x.h, 1)} hs`).join(' · ');
        L.push(`  * Parte diario del período: ${fmtNum(ac.horas, 1)} hs cargadas día a día sobre ` +
               `${ac.diasConHoras} jornada${ac.diasConHoras === 1 ? '' : 's'} (${det}).`);
      }
    }
    L.push(`- Rotación del mes: ${fmtPct(c.rotacion.mensual)} · Proyección anual: ${fmtPct(c.rotacion.proyeccionAnual, 1)}`);
    L.push(`  * Dotación anterior ${c.rotacion.anterior} → nueva dotación ${c.rotacion.nueva} ` +
           `(altas ${c.rotacion.altasExt + c.rotacion.altasInt} / bajas ${c.rotacion.bajas})`);
    if (c.bajas.total) {
      L.push('  * Bajas por categoría: ' + c.bajas.grupos.map(g => `${g.nombre} ${g.casos}`).join(' · '));
    }
    L.push(`- Sanciones disciplinarias del período: ${visita.sanciones.length}`);
    visita.sanciones.forEach(sc => {
      const dias = num(sc.dias) ? `, ${num(sc.dias)} día${num(sc.dias) === 1 ? '' : 's'}` : '';
      L.push(`  * ${oPendiente(sc.nombre)} (${oPendiente(sc.puesto)}) — ${oPendiente(sc.tipo)}${dias}`);
      L.push(`    Motivo: ${oPendiente(sc.motivo)}${sc.fecha ? ` · Fecha: ${fmtFecha(sc.fecha)}` : ''}`);
      L.push(`    Aplicada por: ${oPendiente(sc.aplicadaPor)} · Notificación: ${ETIQUETA_NOTIFICADA[sc.notificada] || PENDIENTE}`);
      if (String(sc.observaciones || '').trim()) L.push(`    Detalle: ${String(sc.observaciones).trim()}`);
    });
    const sinNotificar = visita.sanciones.filter(sc => !sc.notificada || sc.notificada === 'no').length;
    if (sinNotificar) L.push(`  * ${sinNotificar} sanción/es sin constancia de notificación.`);
    L.push('');

    /* 4. Dotación óptima */
    L.push('4. DOTACIÓN vs. VENTA');
    if (c.dotacion.tipo === 'staff') {
      L.push(`- Sucursal de estructura/soporte. Costo laboral sobre venta de la red: ${fmtPct(c.dotacion.pctCostoVenta)} ` +
             `(benchmark ${fmtPct(c.dotacion.benchmark, 0)}).`);
      L.push(`- Lectura: ${c.dotacion.semaforo.icono} ${c.dotacion.semaforo.texto}`);
    } else {
      L.push(`- Venta neta del período: ${fmtMoneda(num(visita.comercial.venta) || null, moneda)}`);
      L.push(`- Costo laboral / venta: ${fmtPct(c.dotacion.pctCostoVenta)} ` +
             `(objetivo ${fmtPct(c.dotacion.benchmark, 0)} · techo de alerta ${fmtPct(c.dotacion.alerta, 0)})`);
      L.push(`  ${c.dotacion.banda.icono} ${c.dotacion.banda.texto}. ${c.dotacion.banda.lectura}`);
      L.push(`- Dotación actual: ${c.matriz.total.heads} · Dotación óptima según venta: ${c.dotacion.dotacionOptima === null ? PENDIENTE : c.dotacion.dotacionOptima}` +
             (c.dotacion.dotacionMaxima === null || c.dotacion.dotacionMaxima === undefined ? '' : ` · Máxima antes del techo: ${c.dotacion.dotacionMaxima}`) +
             (c.dotacion.diferencia === null ? '' : ` · Diferencia: ${c.dotacion.diferencia > 0 ? '+' : ''}${c.dotacion.diferencia}`));
      if (c.dotacion.ahorro !== null) {
        L.push(`- ${c.dotacion.ahorro >= 0 ? 'Inversión requerida' : 'Ahorro potencial'}: ${fmtMoneda(Math.abs(c.dotacion.ahorro), moneda)}`);
      }
      L.push(`- Lectura: ${c.dotacion.semaforo.icono} ${c.dotacion.semaforo.texto}`);
    }
    if (c.productividad) {
      L.push(`- Productividad: ${fmtNum(c.productividad.ticketsHora)} tickets/hora sobre un objetivo de ${c.productividad.objetivo} ` +
             `(cumplimiento ${fmtPct(c.productividad.cumplimiento)}).`);
    }
    L.push('');

    let seccion = 4;

    /* Talento: matriz de desempeño y potencial del plantel */
    if (c.talento.evaluados.length) {
      const t9 = c.talento;
      seccion++;
      L.push(seccion + '. DESEMPEÑO Y POTENCIAL DEL PLANTEL');
      L.push(`- Evaluados junto con el Gerente de Tienda: ${t9.evaluados.length} de ${t9.activos.length} colaboradores.`);
      if (t9.sinEvaluar.length) {
        L.push(`- Sin evaluar: ${t9.sinEvaluar.map(x => oPendiente(x.nombre)).join(', ')}.`);
      }
      L.push('- Ubicación en la matriz 9-box:');
      [['3', 'Potencial alto'], ['2', 'Puede crecer'], ['1', 'En su nivel']].forEach(([pot, etiqueta]) => {
        const fila = ['3', '2', '1'].map(des => {
          const gente = t9.celdas[pot + des] || [];
          if (!gente.length) return null;
          const q = NINE_BOX[pot + des];
          return `${q.nombre}: ${gente.map(x => oPendiente(x.nombre)).join(', ')}`;
        }).filter(Boolean);
        if (fila.length) {
          L.push(`  * ${etiqueta} — ${fila.join(' · ')}`);
        }
      });
      if (t9.listosParaCrecer.length) {
        L.push(`- Listos para asumir más: ${t9.listosParaCrecer.map(x => `${oPendiente(x.nombre)} (${oPendiente(x.posicion)})`).join(', ')}.`);
      }
      if (t9.enRiesgo.length) {
        L.push(`- Con plan de mejora pendiente: ${t9.enRiesgo.map(x => oPendiente(x.nombre)).join(', ')}.`);
      }
      if (t9.riesgoDeSalida.length) {
        L.push(`- Riesgo de salida alto: ${t9.riesgoDeSalida.map(x => `${oPendiente(x.nombre)} (${oPendiente(x.posicion)})`).join(', ')}.`);
      }
      if (t9.estudiando.length) {
        L.push(`- Con formación en curso: ${t9.estudiando.length} colaborador${t9.estudiando.length === 1 ? '' : 'es'}.`);
        t9.estudiando.forEach(x => {
          const nivel = (NIVELES_ESTUDIO.find(n => n.id === x.estudia) || {}).nombre || '';
          L.push(`  * ${oPendiente(x.nombre)}: ${nivel}${x.carrera ? ' — ' + x.carrera : ''}` +
                 `${x.interesDesarrollo ? ` · quiere desarrollarse en: ${x.interesDesarrollo}` : ''}`);
        });
      }
      L.push('');
    }

    /* Sucesión de posiciones críticas */
    if (visita.sucesion.length) {
      seccion++;
      L.push(seccion + '. SUCESIÓN Y TALENTO CRÍTICO');
      L.push(`- Posiciones críticas identificadas: ${c.sucesion.posicionesCriticas} · con plan de sucesión: ${c.sucesion.criticasConPlan}`);
      L.push(`- Candidatos listos en menos de 1 año: ${c.sucesion.candidatosListos}`);
      c.sucesion.lista.forEach(i => {
        const cands = i.candidatos.length
          ? i.candidatos.map(x => `${x.nombre} (${(READINESS.find(r => r.id === x.readiness) || {}).nombre || '—'})`).join('; ')
          : 'sin candidatos identificados';
        L.push(`  * ${i.posicion} — titular ${oPendiente(i.incumbent)} — criticidad ${i.criticidad}/3, escasez ${i.escasez}/3 → ${cands}`);
      });
      L.push('');
    }

    /* 6. Diagnóstico */
    seccion++;
    L.push(seccion + '. DIAGNÓSTICO Y ACCIONES RECOMENDADAS');
    L.push('- Hallazgos sobre ausentismo y desviación de horas extras:');
    const hallazgos = String(visita.diagnostico.hallazgos || '').trim();
    if (hallazgos) {
      L.push(bloque(hallazgos, '      '));
    } else if (c.hallazgosAuto.length) {
      c.hallazgosAuto.forEach(h => L.push('      · ' + h));
    } else {
      L.push('      ' + PENDIENTE);
    }
    L.push('- Evaluación del impacto en el costo laboral de la tienda:');
    L.push(bloque(visita.diagnostico.impacto, '      '));
    L.push('');

    /* Plan de acción, separado según a cargo de quién queda cada punto */
    seccion++;
    L.push(seccion + '. PLAN DE ACCIÓN');
    const plan = visita.diagnostico.plan || [];
    if (!plan.length) {
      L.push('   ' + PENDIENTE);
    } else {
      const bloques = [
        ['tienda',      'A cargo del Gerente de Tienda'],
        ['rrhh',        'A cargo de RRHH'],
        ['operaciones', 'A cargo de Operaciones'],
        ['otro',        'Otras acciones']
      ];
      bloques.forEach(([clave, titulo]) => {
        const items = plan.filter(x => (x.aCargo || 'tienda') === clave);
        if (!items.length) return;
        L.push('');
        L.push(`   ${titulo}:`);
        items.forEach((x, i) => {
          L.push(`   ${i + 1}. ${oPendiente(x.compromiso)}`);
          L.push(`      Responsable: ${oPendiente(x.responsable)} · Plazo: ${fmtFecha(x.plazo)} · ` +
                 `Prioridad: ${oPendiente(x.prioridad)} · Estado: ${oPendiente(x.estado)}`);
        });
      });
      const hoy = new Date().toISOString().slice(0, 10);
      const vencidas = plan.filter(x => x.estado !== 'Cumplido' && x.plazo && x.plazo < hoy);
      if (vencidas.length) {
        L.push('');
        L.push(`   ${vencidas.length} acción/es con el plazo vencido: ` +
               vencidas.map(x => oPendiente(x.compromiso)).join(' · '));
      }
    }
    L.push('');

    /* Datos faltantes */
    const faltantes = detectarFaltantes(visita, sucursal, c);
    if (faltantes.length) {
      L.push('DATOS PENDIENTES DE CARGA');
      faltantes.forEach(f => L.push('  - ' + f));
      L.push('');
    }

    L.push(barra);
    L.push('Reporte generado desde el Tablero de Gestión Operativa de RRHH.');
    L.push(barra);

    return L.join('\n');
  }

  function bloque(txt, sangria) {
    const t = String(txt || '').trim();
    if (!t) return sangria + PENDIENTE;
    return t.split('\n').map(l => sangria + l.trim()).join('\n');
  }

  /** Lista los campos que quedaron sin cargar, para pedirlos explícitamente. */
  function detectarFaltantes(visita, sucursal, c) {
    const f = [];
    if (!sucursal.nombre) f.push('Nombre real de la sucursal (hoy figura como ' + sucursal.codigo + ').');
    if (!sucursal.gerente) f.push('Nombre del Gerente de Tienda.');
    if (!String(visita.minutaGerente.puntos || '').trim()) f.push('Puntos tratados en la reunión con el Gerente de Tienda.');
    if (!String(visita.minutaColaborador.nombre || '').trim()) f.push('Colaborador entrevistado.');
    if (!c.matriz.total.heads) f.push('Headcount base por posición.');
    if (!c.matriz.total.costoTotal) f.push('Costos laborales (sueldos brutos, horas extras, bonos).');
    if (!c.ausentismo.totalDias) f.push('Días de ausentismo del período.');
    if (c.ausentismo.sinApertura) f.push('Apertura del ausentismo por concepto (hoy solo está el total de la matriz de FTE).');
    if (c.ausentismo.diasDetallados && Math.abs(c.ausentismo.diasDetallados - c.matriz.total.diasAusentes) > 0.5) {
      f.push(`Revisar ausentismo: el detalle por concepto suma ${c.ausentismo.diasDetallados} días, ` +
             `pero la matriz de FTE tiene cargados ${c.matriz.total.diasAusentes}. ` +
             `El FTE Real se calcula con el dato de la matriz.`);
    }
    if (!num(visita.comercial.venta) && sucursal.tipo === 'venta') f.push('Venta neta del período (necesaria para el análisis de dotación óptima).');
    if (!num(visita.rotacion.dotacionAnterior)) f.push('Dotación del mes anterior (para el cálculo de rotación).');
    if (!(visita.diagnostico.plan || []).length) f.push('Plan de acción con responsables y plazos.');
    if (!(sucursal.colaboradores || []).length) f.push('Plantel de la sucursal, para poder evaluar desempeño y potencial.');
    else if (c.talento.sinEvaluar.length) {
      f.push(`Evaluación de desempeño y potencial de ${c.talento.sinEvaluar.length} colaborador/es: ` +
             c.talento.sinEvaluar.map(x => x.nombre || 'sin nombre').join(', ') + '.');
    }
    if (!sucursal.emailGerente) f.push('Email del Gerente de Tienda, para que reciba copia del reporte.');
    return f;
  }

  /* ---------------------- Envío al Gerente de Operaciones ---------------------- */

  /**
   * Destinatario del reporte: el Gerente de Operaciones asignado a la sucursal.
   * Si la sucursal no tiene uno, o no tiene email cargado, cae en el de
   * Configuración, que sigue siendo el destinatario por defecto del área.
   */
  function destinatario(sucursal, config) {
    const lista = config.gerentesOperaciones || [];
    const propio = lista.find(g => g.nombre === sucursal.gerenteOperaciones);
    if (propio && String(propio.email || '').trim()) {
      return { nombre: propio.nombre, email: propio.email.trim() };
    }
    const gral = config.gerenteOperaciones || {};
    return {
      nombre: (propio && propio.nombre) || gral.nombre || '',
      email: String(gral.email || '').trim()
    };
  }

  /** Copias del reporte: las fijas de Configuración más el Gerente de Tienda. */
  function copias(sucursal, config) {
    const fijas = String(config.copias || '').split(',').map(x => x.trim()).filter(Boolean);
    const gerente = String(sucursal.emailGerente || '').trim();
    if (gerente && !fijas.some(x => x.toLowerCase() === gerente.toLowerCase())) fijas.push(gerente);
    return fijas;
  }

  function asunto(visita, sucursal, config) {
    const area = config && config.area ? config.area + ' · ' : '';
    return `Visita RRHH · ${area}${Store.etiquetaSucursal(sucursal)} · ${fmtFecha(visita.fecha)}`;
  }

  /**
   * Envía el reporte. Dos vías:
   *  - webhook: si hay un endpoint configurado (Zapier, Make, Google Apps
   *    Script, etc.) se hace un POST y el envío es automático.
   *  - mailto:  abre el cliente de correo con todo pre-cargado; el coordinador
   *    solo confirma el envío.
   * En ambos casos se deja registro en el historial de la visita.
   */
  async function enviar(visita, sucursal, config, opciones) {
    opciones = opciones || {};
    const cuerpo = texto(visita, sucursal, config);
    const asu = asunto(visita, sucursal, config);
    const dest = destinatario(sucursal, config);
    const destino = dest.email;

    if (!destino) {
      throw new Error(sucursal.gerenteOperaciones
        ? `Falta el email de ${sucursal.gerenteOperaciones} en Configuración.`
        : 'Falta cargar el email del Gerente de Operaciones en Configuración.');
    }

    let via = 'mailto';
    if (config.webhook && String(config.webhook).trim() && !opciones.forzarMailto) {
      const c = calcular(visita, sucursal, config);
      const payload = {
        para: destino,
        cc: copias(sucursal, config),
        asunto: asu,
        cuerpo,
        area: config.area || '',
        sucursal: { codigo: sucursal.codigo, nombre: sucursal.nombre, tipo: sucursal.tipo },
        visita: { id: visita.id, fecha: visita.fecha, periodo: visita.periodo, coordinador: visita.coordinador },
        metricas: {
          headcount: c.matriz.total.heads,
          fteReal: redondear(c.matriz.total.fteReal, 2),
          costoLaboralTotal: redondear(c.matriz.total.costoTotal, 2),
          costoPorFte: c.matriz.total.costoPorFte === null ? null : redondear(c.matriz.total.costoPorFte, 2),
          ausentismoPct: c.ausentismo.pctTotal,
          horasExtras: c.matriz.total.horasExtras,
          rotacionMensual: c.rotacion.mensual,
          dotacionOptima: c.dotacion.dotacionOptima,
          diferenciaDotacion: c.dotacion.diferencia
        }
      };
      // El cuerpo es JSON, pero se declara text/plain a propósito: así el
      // navegador lo trata como "simple request" y no dispara el preflight
      // OPTIONS, que Google Apps Script no sabe responder.
      const resp = await fetch(String(config.webhook).trim(), {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      if (!resp.ok) throw new Error('El endpoint de envío respondió ' + resp.status + '.');
      via = 'webhook';
    } else {
      const cc = copias(sucursal, config).join(',');
      const url = 'mailto:' + encodeURIComponent(destino) +
        '?subject=' + encodeURIComponent(asu) +
        (cc ? '&cc=' + encodeURIComponent(cc) : '') +
        '&body=' + encodeURIComponent(cuerpo);
      // Algunos clientes de correo truncan URLs muy largas; si pasa, el
      // coordinador tiene el botón "Copiar reporte" como respaldo.
      window.location.href = url;
    }

    const sello = new Date().toISOString();
    visita.envio.enviado = true;
    visita.envio.fecha = sello;
    visita.envio.destinatario = destino;
    visita.envio.via = via;
    visita.envio.copias = copias(sucursal, config);
    visita.envio.historial.push({ fecha: sello, destinatario: destino, copias: visita.envio.copias, via });
    Store.save();
    return { via, destino, largo: cuerpo.length };
  }

  return { calcular, texto, asunto, enviar, detectarFaltantes, tablaFteTexto, copias, destinatario };
})();

/*
 * app.js — Interfaz y ruteo del tablero.
 *
 * Ruteo por hash:
 *   #/red                      panel consolidado de la red
 *   #/sucursales               alta, renombrado y baja de sucursales
 *   #/config                   parámetros de cálculo y destinatarios
 *   #/visita/<id>/<pestaña>    ficha de una visita
 */

const App = (() => {
  let contexto = null;          // objeto que editan los campos con data-path
  let visitaEnCurso = null;     // visita abierta, para fechar las evaluaciones
  let vistaActual = null;       // función de re-render de la vista en curso
  let temporizador = null;

  /* --------------------------- utilidades --------------------------- */
  const $ = sel => document.querySelector(sel);
  const esc = s => String(s ?? '').replace(/[&<>"']/g, c =>
    ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));

  function setPath(obj, path, valor) {
    const partes = path.split('.');
    let ref = obj;
    for (let i = 0; i < partes.length - 1; i++) {
      if (ref[partes[i]] === undefined || ref[partes[i]] === null) ref[partes[i]] = {};
      ref = ref[partes[i]];
    }
    ref[partes[partes.length - 1]] = valor;
  }

  function getPath(obj, path) {
    return path.split('.').reduce((r, k) => (r === undefined || r === null ? r : r[k]), obj);
  }

  function guardarDiferido() {
    clearTimeout(temporizador);
    temporizador = setTimeout(() => Store.save(), 400);
  }

  const moneda = () => Store.get().config.parametros.moneda || '$';
  const dinero = n => fmtMoneda(n, moneda());

  function chipSemaforo(s) {
    const clase = { ampliar: 'verde', optima: 'verde', revisar: 'ambar', reducir: 'rojo', sd: '' }[s.clave] || '';
    return `<span class="chip ${clase}">${s.icono} ${esc(s.texto)}</span>`;
  }

  /* --------------------- confirmación y avisos ---------------------- *
     El visor de la página publicada bloquea confirm() y alert(): devuelven
     false o no muestran nada. El tablero dibuja los suyos para que las
     acciones destructivas se puedan completar en cualquier entorno. */
  function avisar(mensaje, tipo) {
    let cont = document.querySelector('.avisos');
    if (!cont) {
      cont = document.createElement('div');
      cont.className = 'avisos';
      document.body.appendChild(cont);
    }
    const el = document.createElement('div');
    el.className = 'aviso-flotante' + (tipo === 'error' ? ' error' : '');
    el.textContent = mensaje;
    cont.appendChild(el);
    setTimeout(() => el.remove(), tipo === 'error' ? 7000 : 4000);
  }

  function confirmar(titulo, mensaje, textoConfirmar) {
    return new Promise(resolve => {
      const velo = document.createElement('div');
      velo.className = 'velo';
      velo.innerHTML = `<div class="dialogo" role="dialog" aria-modal="true">
        <h3>${esc(titulo)}</h3>
        <p>${esc(mensaje)}</p>
        <div class="acciones">
          <button class="b sec" data-r="0">Cancelar</button>
          <button class="b peligro" data-r="1">${esc(textoConfirmar || 'Borrar')}</button>
        </div>
      </div>`;
      const cerrar = valor => { velo.remove(); document.removeEventListener('keydown', tecla); resolve(valor); };
      const tecla = ev => { if (ev.key === 'Escape') cerrar(false); };
      velo.addEventListener('click', ev => {
        const btn = ev.target.closest('[data-r]');
        if (btn) return cerrar(btn.dataset.r === '1');
        if (ev.target === velo) cerrar(false);
      });
      document.addEventListener('keydown', tecla);
      document.body.appendChild(velo);
      velo.querySelector('[data-r="1"]').focus();
    });
  }

  /* ------------------------ componentes de campo -------------------- */
  function campo(etiqueta, path, opciones) {
    const o = opciones || {};
    const v = esc(getPath(contexto, path) ?? '');
    const attrs = `data-path="${path}"${o.calc ? ' data-calc="1"' : ''}${o.placeholder ? ` placeholder="${esc(o.placeholder)}"` : ''}`;
    let control;
    if (o.tipo === 'textarea') {
      control = `<textarea ${attrs}${o.alto ? ` style="min-height:${o.alto}px"` : ''}>${v}</textarea>`;
    } else if (o.tipo === 'select') {
      control = `<select ${attrs}>` + (o.opciones || []).map(op =>
        `<option value="${esc(op.valor)}"${String(op.valor) === String(getPath(contexto, path) ?? '') ? ' selected' : ''}>${esc(op.texto)}</option>`).join('') + `</select>`;
    } else if (o.tipo === 'number') {
      control = `<input class="num" type="number" step="${o.step || 'any'}" ${attrs} value="${v}">`;
    } else {
      control = `<input type="${o.tipo || 'text'}" ${attrs} value="${v}">`;
    }
    return `<label class="campo"><span>${esc(etiqueta)}</span>${control}</label>`;
  }

  const hoyISO = () => new Date().toISOString().slice(0, 10);

  /* Acciones sin cumplir de la visita anterior a la misma sucursal. */
  function pendientesAnteriores(v) {
    const previas = Store.visitasDe(v.sucursalId).filter(x => x.id !== v.id && (x.fecha || '') <= (v.fecha || ''));
    const anterior = previas[0];
    if (!anterior) return [];
    const yaEstan = new Set((v.diagnostico.plan || []).map(x => (x.compromiso || '').trim()));
    return (anterior.diagnostico.plan || [])
      .filter(x => x.estado !== 'Cumplido' && (x.compromiso || '').trim() && !yaEstan.has(x.compromiso.trim()));
  }

  function kpi(etiqueta, valor, nota, clase) {
    return `<div class="kpi ${clase || ''}">
      <div class="etiqueta">${esc(etiqueta)}</div>
      <div class="valor">${valor}</div>
      ${nota ? `<div class="nota">${nota}</div>` : ''}
    </div>`;
  }

  /* ============================ VISTA: RED ========================== */
  function vistaRed() {
    const e = Store.get();
    contexto = e.config;

    const filas = e.sucursales.map(s => {
      const v = Store.ultimaVisita(s.id);
      if (!v) return { s, v: null };
      return { s, v, c: Reporte.calcular(v, s, e.config) };
    });

    const conDatos = filas.filter(f => f.c);
    const sum = k => conDatos.reduce((a, f) => a + num(getPath(f.c, k)), 0);
    const headcount = sum('matriz.total.heads');
    const fteVinculo = sum('matriz.total.fteVinculo');
    const fte = sum('matriz.total.fteReal');
    const costo = sum('matriz.total.costoTotal');
    const diasAus = sum('ausentismo.totalDias');
    const diasBase = sum('matriz.total.diasTrabajados');
    const he = sum('matriz.total.horasExtras');
    const ventaRed = conDatos.reduce((a, f) => a + num(f.v.comercial.venta), 0);
    const pctAus = diasBase > 0 ? diasAus / diasBase : null;
    const visitadas = filas.filter(f => f.v).length;
    const enviadas = filas.filter(f => f.v && f.v.envio.enviado).length;

    const html = `
      <h1 class="titulo">${esc(e.config.area || 'Panel de la red')}</h1>
      <p class="subtitulo">Consolidado de la última visita registrada en cada sucursal${e.config.coordinador ? ` · ${esc(e.config.coordinador)}` : ''}.</p>

      <div class="kpis">
        ${kpi('Sucursales a cargo', e.sucursales.length, `${visitadas} con visita registrada`)}
        ${kpi('Headcount', headcount || '—', 'personas en nómina')}
        ${kpi('FTE Real', fte ? fmtNum(fte) : '—', fteVinculo ? `brecha ${fmtNum(fte - fteVinculo)} FTE` : '', fte && fte < fteVinculo - 0.5 ? 'aviso' : '')}
        ${kpi('Costo laboral', costo ? dinero(costo) : '—', fte ? `${dinero(costo / fte)} por FTE` : '')}
        ${kpi('Ausentismo', pctAus === null ? '—' : fmtPct(pctAus), `${diasAus} días`, pctAus !== null && pctAus > e.config.parametros.umbralAusentismo ? 'alerta' : 'ok')}
        ${kpi('Horas extras', he ? fmtNum(he, 0) + ' hs' : '—', he ? `${fmtNum(he / e.config.parametros.horasMes)} FTE equivalentes` : '')}
        ${(() => {
          const pct = costo && ventaRed ? costo / ventaRed : null;
          const banda = evaluarCostoVenta(pct, e.config.parametros);
          return kpi('Costo / venta de la red', pct === null ? '—' : fmtPct(pct),
                     pct === null ? 'sin ventas cargadas' : `${banda.icono} ${banda.texto}`,
                     { eficiente: 'ok', atencion: 'aviso', alerta: 'alerta', sd: '' }[banda.zona]);
        })()}
        ${kpi('Venta neta', ventaRed ? dinero(ventaRed) : '—', costo ? `costo laboral ${dinero(costo)}` : '')}
        ${(() => {
          const d = consolidarDia(e.partes, e.sucursales, hoyISO());
          return kpi('Presentismo de hoy', d.presentismo === null ? '—' : fmtPct(d.presentismo, 1),
                     d.reportaron ? `${d.reportaron} de ${e.sucursales.length} sucursales reportaron` : 'todavía no reportó ninguna',
                     d.presentismo === null ? '' : (d.presentismo >= 0.95 ? 'ok' : d.presentismo >= 0.9 ? 'aviso' : 'alerta'));
        })()}
        ${kpi('Reportes enviados', `${enviadas} / ${visitadas}`, 'al Gerente de Operaciones', enviadas < visitadas ? 'aviso' : 'ok')}
      </div>

      <section class="tarjeta">
        <h2>Sucursales</h2>
        <p class="ayuda">Los códigos <em>sucursal1</em>, <em>sucursal2</em>… son provisorios: reemplazalos por el nombre real desde “Sucursales”.</p>
        <div class="tabla-scroll">
        <table>
          <thead><tr>
            <th>Sucursal</th><th>Tipo</th><th>Última visita</th>
            <th class="num">HC</th><th class="num">FTE Real</th><th class="num">Ausent.</th>
            <th class="num">Hs. Ext.</th><th class="num">Costo / FTE</th>
            <th>Dotación</th><th>Reporte</th><th></th>
          </tr></thead>
          <tbody>
          ${e.sucursales.map(({ id }) => {
            const f = filas.find(x => x.s.id === id);
            const s = f.s, v = f.v, c = f.c;
            return `<tr>
              <td><strong>${esc(Store.etiquetaSucursal(s))}</strong>${s.gerente ? `<br><span class="nota" style="font-size:12px;color:var(--texto-suave)">${esc(s.gerente)}</span>` : ''}</td>
              <td class="tipo">${s.tipo === 'staff' ? '🏢 Staff' : '🏪 Venta'}</td>
              <td>${v ? fmtFecha(v.fecha) : '<span class="chip">sin visita</span>'}</td>
              <td class="num">${c ? (c.matriz.total.heads || '—') : '—'}</td>
              <td class="num">${c && c.matriz.total.fteReal ? fmtNum(c.matriz.total.fteReal) : '—'}</td>
              <td class="num">${c && c.ausentismo.pctTotal !== null ? fmtPct(c.ausentismo.pctTotal) : '—'}</td>
              <td class="num">${c && c.matriz.total.horasExtras ? fmtNum(c.matriz.total.horasExtras, 0) : '—'}</td>
              <td class="num">${c && c.matriz.total.costoPorFte ? dinero(c.matriz.total.costoPorFte) : '—'}</td>
              <td>${c ? chipSemaforo(c.dotacion.semaforo) : '—'}</td>
              <td>${v ? (v.envio.enviado ? '<span class="chip verde">enviado</span>' : '<span class="chip ambar">pendiente</span>') : '—'}</td>
              <td class="num">${v
                  ? `<a class="chip azul" href="#/visita/${v.id}/minutas" style="text-decoration:none">Abrir</a>`
                  : `<button class="mini" data-accion="nueva-visita" data-id="${s.id}" style="color:var(--azul);border-color:var(--azul)">Registrar visita</button>`}</td>
            </tr>`;
          }).join('')}
          </tbody>
        </table>
        </div>
      </section>

      ${historialVisitas(e)}
    `;
    return html;
  }

  function historialVisitas(e) {
    const visitas = e.visitas.slice().sort((a, b) => (b.fecha || '').localeCompare(a.fecha || ''));
    if (!visitas.length) return '';
    return `<section class="tarjeta">
      <h2>Historial de visitas</h2>
      <div class="tabla-scroll"><table>
        <thead><tr><th>Fecha</th><th>Sucursal</th><th>Período</th><th>Coordinador</th><th>Envío</th><th></th></tr></thead>
        <tbody>${visitas.map(v => {
          const s = Store.sucursal(v.sucursalId);
          return `<tr>
            <td>${fmtFecha(v.fecha)}</td>
            <td>${esc(Store.etiquetaSucursal(s))}</td>
            <td>${esc(v.periodo || '—')}</td>
            <td>${esc(v.coordinador || '—')}</td>
            <td>${v.envio.enviado ? `<span class="chip verde">${esc(v.envio.via)}</span>` : '<span class="chip ambar">pendiente</span>'}</td>
            <td class="num">
              <a class="chip azul" href="#/visita/${v.id}/minutas" style="text-decoration:none">Abrir</a>
              <button class="mini" data-accion="borrar-visita" data-id="${v.id}">Borrar</button>
            </td>
          </tr>`;
        }).join('')}</tbody>
      </table></div>
    </section>`;
  }

  /**
   * Interpreta lo que llega del formulario externo: JSON con la forma que
   * exporta el script, o un CSV con encabezados. Devuelve filas listas para
   * Store.importarPartes.
   */
  function interpretarPartes(crudo) {
    const txt = String(crudo).trim();

    if (txt.startsWith('{') || txt.startsWith('[')) {
      const datos = JSON.parse(txt);
      const lista = Array.isArray(datos) ? datos : (datos.partes || datos.filas || []);
      return lista.map(x => ({
        sucursal: x.sucursal || x.tienda || '',
        fecha: (x.fecha || '').slice(0, 10),
        fechaHoras: (x.fechaHoras || x.fecha_horas || '').slice(0, 10),
        reportadoPor: x.reportadoPor || x.reporta || '',
        sinNovedad: !!(x.sinNovedad || x.sin_novedad),
        ausencias: x.ausencias || (x.colaborador && !x.horas ? [{
          colaborador: x.colaborador, posicion: x.posicion, turno: x.turno,
          motivo: x.motivo, aviso: x.aviso, quienAviso: x.quienAviso, horaAviso: x.horaAviso
        }] : []),
        horasExtras: x.horasExtras || x.horas_extras || (x.horas && x.colaborador ? [{
          colaborador: x.colaborador, posicion: x.posicion, horas: x.horas,
          motivo: x.motivo, autorizadoPor: x.autorizadoPor
        }] : [])
      })).filter(x => x.sucursal && x.fecha);
    }

    // CSV: una fila por ausencia, o una fila sin colaborador para "sin novedad"
    const lineas = txt.split(/\r?\n/).filter(l => l.trim());
    if (lineas.length < 2) return [];
    const sep = lineas[0].includes(';') ? ';' : (lineas[0].includes('\t') ? '\t' : ',');
    const col = lineas[0].split(sep).map(h => normalizarClave(h));
    const idx = n => col.indexOf(n);

    const porClave = {};
    lineas.slice(1).forEach(l => {
      const c = l.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));
      const sucursal = c[idx('sucursal')] || c[idx('tienda')] || '';
      const fecha = (c[idx('fecha')] || '').slice(0, 10);
      if (!sucursal || !fecha) return;
      const k = sucursal + '|' + fecha;
      if (!porClave[k]) porClave[k] = {
        sucursal, fecha,
        reportadoPor: c[idx('reporta')] || c[idx('reportadopor')] || '',
        ausencias: [], horasExtras: []
      };
      const colaborador = c[idx('colaborador')] || '';

      /* Una fila con horas cargadas es una hora extra, no una ausencia: se
         imputa al día trabajado, que puede ser el anterior al del reporte. */
      const horas = (c[idx('horas')] || c[idx('horasextras')] || '').replace(',', '.');
      if (colaborador && parseFloat(horas) > 0) {
        porClave[k].horasExtras.push({
          colaborador,
          posicion: c[idx('posicion')] || '',
          horas: parseFloat(horas),
          motivo: clavePorNombre(c[idx('motivohoras')] || c[idx('motivo')], MOTIVOS_HORAS, 'afluencia'),
          autorizadoPor: c[idx('autorizadopor')] || c[idx('autoriza')] || '',
          fecha: (c[idx('fechahoras')] || c[idx('diatrabajado')] || '').slice(0, 10)
        });
        return;
      }

      if (!colaborador) { porClave[k].sinNovedad = true; return; }
      porClave[k].ausencias.push({
        colaborador,
        posicion: c[idx('posicion')] || '',
        turno: clavePorNombre(c[idx('turno')], TURNOS, 'manana'),
        motivo: clavePorNombre(c[idx('motivo')], MOTIVOS_AUSENCIA, 'otro'),
        aviso: clavePorNombre(c[idx('aviso')], AVISOS, 'no'),
        quienAviso: c[idx('quienaviso')] || '',
        horaAviso: c[idx('hora')] || c[idx('horaaviso')] || ''
      });
    });
    return Object.values(porClave);
  }

  const normalizarClave = t => String(t || '').toLowerCase()
    .normalize('NFD').replace(/[\u0300-\u036f]/g, '').replace(/[^a-z]/g, '');

  /* Acepta tanto el id como el nombre visible del turno, motivo o aviso. */
  function clavePorNombre(valor, lista, porDefecto) {
    const v = normalizarClave(valor);
    if (!v) return porDefecto;
    const hallado = lista.find(x => normalizarClave(x.id) === v || normalizarClave(x.nombre).startsWith(v));
    return hallado ? hallado.id : porDefecto;
  }

  /* ========================= VISTA: PARTE DIARIO ==================== */
  let fechaParte = null;      // día que se está mirando
  let parteAbierto = null;    // sucursal con el parte desplegado

  function vistaParte() {
    const e = Store.get();
    contexto = e;
    if (!fechaParte) fechaParte = hoyISO();
    const d = consolidarDia(e.partes, e.sucursales, fechaParte);
    const ayer = diaAnterior(fechaParte);
    const dAyer = consolidarDia(e.partes, e.sucursales, ayer);
    d.filas.forEach(f => {
      const fa = dAyer.filas.find(x => x.sucursal.id === f.sucursal.id);
      f.horasAyer = fa ? fa.calc.horas : 0;
    });
    const periodo = fechaParte.slice(0, 7);
    const hs = acumuladoHorasArea(e.partes, e.sucursales, periodo);

    const fila = f => {
      const s = f.sucursal, c = f.calc;
      const abierto = parteAbierto === s.id;
      const estado = !f.reportado
        ? '<span class="chip ambar">sin reportar</span>'
        : (f.parte.sinNovedad && !c.ausentes
            ? '<span class="chip verde">sin novedad</span>'
            : `<span class="chip ${c.ausentes ? 'rojo' : 'verde'}">${c.ausentes} ausente${c.ausentes === 1 ? '' : 's'}</span>`);

      return `<tr>
        <td><strong>${esc(s.nombre || s.codigo)}</strong>
          ${s.localidad ? `<div style="font-size:11px;color:var(--texto-suave)">${esc(s.localidad)}</div>` : ''}</td>
        <td>${estado}</td>
        ${TURNOS.map(t => {
          const ct = c.porTurno.find(x => x.id === t.id);
          if (!ct.activo) return '<td class="num" style="color:var(--texto-suave)">—</td>';
          return `<td class="num">${ct.dotacion ? `${ct.presentes}/${ct.dotacion}` : '<span style="color:var(--texto-suave)">sin dotación</span>'}</td>`;
        }).join('')}
        <td class="num">${c.presentismo === null ? '—' : fmtPct(c.presentismo, 1)}</td>
        <td class="num">${c.sinAviso || '—'}</td>
        <td class="num">${f.horasAyer ? fmtNum(f.horasAyer, 1) : '—'}</td>
        <td>${f.reportado ? esc(f.parte.reportadoPor || '—') : '—'}</td>
        <td class="num" style="white-space:nowrap">
          <button class="mini" data-accion="abrir-parte" data-id="${s.id}" style="color:var(--azul);border-color:var(--azul)">${abierto ? 'Cerrar' : 'Cargar'}</button>
          ${f.reportado ? `<button class="mini" data-accion="borrar-parte" data-id="${f.parte.id}">✕</button>` : ''}
        </td>
      </tr>
      ${abierto ? detalleParte(s, f.parte) : ''}`;
    };

    return `
      <h1 class="titulo">Parte diario de asistencia</h1>
      <p class="subtitulo">
        Lo que reportan las sucursales cada mañana: las ausencias de hoy y las horas extras de ayer.
        Alimenta el presentismo del día, el ausentismo del mes y el acumulado de horas extras del área.
      </p>

      <section class="tarjeta">
        <div class="grid c4">
          <label class="campo"><span>Día</span>
            <input type="date" id="fecha-parte" value="${esc(fechaParte)}"></label>
          <div style="display:flex;align-items:flex-end;gap:8px">
            <button class="b sec" data-accion="dia-anterior">← Día anterior</button>
            <button class="b sec" data-accion="dia-hoy">Hoy</button>
          </div>
        </div>

        <div class="kpis" style="margin-top:18px">
          ${kpi('Presentismo del día', d.presentismo === null ? '—' : fmtPct(d.presentismo, 1),
                d.dotacion ? `${d.presentes} de ${d.dotacion} puestos cubiertos` : 'falta cargar la dotación por turno',
                d.presentismo === null ? '' : (d.presentismo >= 0.95 ? 'ok' : d.presentismo >= 0.9 ? 'aviso' : 'alerta'))}
          ${kpi('Ausentes', d.ausentes, d.ausentes ? `${d.gestionables} gestionables` : 'ninguno reportado', d.ausentes ? 'aviso' : 'ok')}
          ${kpi('Sin aviso', d.sinAviso, d.sinAviso ? 'requieren seguimiento' : 'todos avisaron', d.sinAviso ? 'alerta' : 'ok')}
          ${kpi('Horas extras del ' + fmtFecha(ayer), dAyer.horas ? fmtNum(dAyer.horas, 1) + ' h' : '—',
                dAyer.horas ? `${fmtNum(hs.total, 1)} h acumuladas en el mes` : 'ninguna reportada',
                dAyer.horas ? 'aviso' : 'ok')}
          ${kpi('Sucursales que reportaron', `${d.reportaron} / ${e.sucursales.length}`,
                d.faltanReportar.length ? d.faltanReportar.map(x => x.nombre || x.codigo).join(', ').slice(0, 58) : 'todas al día',
                d.faltanReportar.length ? 'aviso' : 'ok')}
        </div>

        <div class="tabla-scroll" style="margin-top:6px"><table>
          <thead><tr>
            <th>Sucursal</th><th>Estado</th>
            ${TURNOS.map(t => `<th class="num">${esc(t.nombre)}</th>`).join('')}
            <th class="num">Presentismo</th><th class="num">Sin aviso</th>
            <th class="num">Hs. extras<br><span style="font-weight:400;font-size:10px">del día anterior</span></th>
            <th>Reportó</th><th></th>
          </tr></thead>
          <tbody>${d.filas.map(fila).join('')}</tbody>
        </table></div>
      </section>

      <section class="tarjeta">
        <h2>Horas extras acumuladas — ${esc(periodo)}</h2>
        <p class="ayuda">
          Lo que va del mes, sucursal por sucursal. Es el sentido de pedirlas todos
          los días: llegar a fin de mes sabiendo el número, no enterarse con la liquidación.
        </p>

        <div class="kpis">
          ${kpi('Horas del mes', fmtNum(hs.total, 1) + ' h',
                hs.personas ? `${hs.personas} colaborador${hs.personas === 1 ? '' : 'es'} con horas` : 'sin horas cargadas', 'ok')}
          ${kpi('Proyección de cierre', hs.proyectable ? fmtNum(hs.proyeccion, 1) + ' h' : '—',
                hs.proyectable
                  ? `al ritmo de los ${hs.diasCubiertos} días cargados, sobre ${hs.diasDelMes}`
                  : `con ${hs.diasCubiertos} día${hs.diasCubiertos === 1 ? '' : 's'} cargado${hs.diasCubiertos === 1 ? '' : 's'} todavía no se proyecta`,
                'aviso')}
          ${kpi('Equivalente en FTE', hs.total ? fmtNum(hs.total / (e.config.parametros.horasMes || 200), 2) : '—',
                `sobre ${e.config.parametros.horasMes || 200} horas mensuales`, 'ok')}
          ${kpi('Principal motivo', (() => {
              const top = MOTIVOS_HORAS.map(m => ({ m, h: hs.porMotivo[m.id] || 0 })).sort((a, b) => b.h - a.h)[0];
              return top && top.h ? top.m.nombre : '—';
            })(),
            (() => {
              const top = MOTIVOS_HORAS.map(m => ({ m, h: hs.porMotivo[m.id] || 0 })).sort((a, b) => b.h - a.h)[0];
              return top && top.h ? `${fmtNum(top.h, 1)} h · ${fmtPct(top.h / hs.total, 0)} del total` : 'sin horas cargadas';
            })(), 'ok')}
        </div>

        <div class="tabla-scroll"><table>
          <thead><tr>
            <th>Sucursal</th>
            ${MOTIVOS_HORAS.map(m => `<th class="num">${esc(m.nombre)}</th>`).join('')}
            <th class="num">Total</th><th class="num">Personas</th><th class="num">Días con horas</th>
          </tr></thead>
          <tbody>
            ${hs.filas.filter(f => f.horas).length
              ? hs.filas.filter(f => f.horas).sort((a, b) => b.horas - a.horas).map(f => `<tr>
                  <td><strong>${esc(f.sucursal.nombre || f.sucursal.codigo)}</strong></td>
                  ${MOTIVOS_HORAS.map(m => `<td class="num">${f.porMotivo[m.id] ? fmtNum(f.porMotivo[m.id], 1) : '—'}</td>`).join('')}
                  <td class="num"><strong>${fmtNum(f.horas, 1)}</strong></td>
                  <td class="num">${f.personas}</td>
                  <td class="num">${f.diasConHoras}</td>
                </tr>`).join('')
              : `<tr><td colspan="${MOTIVOS_HORAS.length + 4}" class="vacio">Todavía no se cargaron horas extras en ${esc(periodo)}.</td></tr>`}
          </tbody>
          ${hs.total ? `<tfoot><tr>
            <td><strong>Área ${esc(String(e.config.area || '').replace(/^área /i, ''))}</strong></td>
            ${MOTIVOS_HORAS.map(m => `<td class="num">${hs.porMotivo[m.id] ? fmtNum(hs.porMotivo[m.id], 1) : '—'}</td>`).join('')}
            <td class="num"><strong>${fmtNum(hs.total, 1)}</strong></td>
            <td class="num">${hs.personas}</td><td class="num"></td>
          </tr></tfoot>` : ''}
        </table></div>
      </section>

      <section class="tarjeta">
        <h2>Pedido diario por WhatsApp</h2>
        <p class="ayuda">
          El mensaje que mandás al grupo, con el link del formulario que completan las sucursales.
          El link se carga una sola vez en Configuración.
        </p>
        <pre class="reporte" id="mensaje-wsp">${esc(mensajeWhatsApp(e.config, fechaParte))}</pre>
        <div class="acciones">
          <button class="b" data-accion="copiar-wsp">Copiar el mensaje</button>
          ${e.config.linkParteDiario
            ? `<a class="b sec" href="https://wa.me/?text=${encodeURIComponent(mensajeWhatsApp(e.config, fechaParte))}" target="_blank" rel="noopener" style="text-decoration:none">Abrir WhatsApp</a>`
            : '<span class="chip ambar">falta el link del formulario</span>'}
        </div>
      </section>

      <section class="tarjeta">
        <h2>Traer los partes del formulario</h2>
        <p class="ayuda">
          Pegá lo que devuelve el formulario, o traelo del endpoint si lo configuraste.
          Las sucursales que no se reconozcan se listan en lugar de descartarse.
        </p>
        <textarea id="pegar-partes" style="min-height:90px" placeholder='Pegá acá el JSON o el CSV que exporta la planilla del formulario'></textarea>
        <div class="acciones">
          <button class="b" data-accion="importar-partes">Importar lo pegado</button>
          ${e.config.endpointPartes ? '<button class="b sec" data-accion="traer-partes">Traer del endpoint</button>' : ''}
        </div>
        <div id="resultado-import"></div>
      </section>`;
  }

  function detalleParte(s, parte) {
    const p = parte || { ausencias: [], sinNovedad: false, reportadoPor: '' };
    const idx = Store.get().partes.indexOf(p);
    const ruta = c => `partes.${idx}.${c}`;

    return `<tr class="ficha-fila"><td colspan="${TURNOS.length + 6}"><div class="talent-card">
      <div class="tc-cab">
        <div><strong>${esc(s.nombre || s.codigo)}</strong>
          <span>${TURNOS.map(t => {
            const cfg = (s.turnos || {})[t.id] || {};
            return cfg.activo === false ? '' :
              `${t.nombre} ${cfg.desde || t.desde}–${cfg.hasta || t.hasta}${cfg.dotacion ? ` (${cfg.dotacion})` : ''}`;
          }).filter(Boolean).join(' · ')}</span></div>
      </div>

      ${idx < 0 ? '' : `
      <div class="grid c3">
        <label class="campo"><span>Quién reporta</span>
          <input data-path="${ruta('reportadoPor')}" value="${esc(p.reportadoPor)}" placeholder="Gerente o encargado"></label>
        <label class="campo"><span>Novedades</span>
          <select data-path="${ruta('sinNovedad')}" data-calc="1">
            <option value=""${!p.sinNovedad ? ' selected' : ''}>Hay ausencias</option>
            <option value="si"${p.sinNovedad ? ' selected' : ''}>Sin novedad, equipo completo</option>
          </select></label>
      </div>

      ${p.sinNovedad ? '' : `
      <h4>Ausencias del día</h4>
      <div class="tabla-scroll"><table>
        <thead><tr><th>Colaborador</th><th>Posición</th><th>Turno</th><th>Motivo</th><th>¿Avisó?</th><th>Quién avisó</th><th>Hora</th><th></th></tr></thead>
        <tbody>
        ${p.ausencias.length ? p.ausencias.map((a, j) => `<tr>
          <td><input data-path="${ruta('ausencias.' + j + '.colaborador')}" data-calc="1" value="${esc(a.colaborador)}"
                     list="plantel-${s.id}" placeholder="Apellido y nombre"></td>
          <td><select data-path="${ruta('ausencias.' + j + '.posicion')}">
            <option value="">—</option>
            ${POSICIONES.map(pp => `<option value="${esc(pp.nombre)}"${a.posicion === pp.nombre ? ' selected' : ''}>${esc(pp.nombre)}</option>`).join('')}
          </select></td>
          <td><select data-path="${ruta('ausencias.' + j + '.turno')}" data-calc="1">
            ${TURNOS.map(t => `<option value="${t.id}"${a.turno === t.id ? ' selected' : ''}>${esc(t.nombre)}</option>`).join('')}
          </select></td>
          <td><select data-path="${ruta('ausencias.' + j + '.motivo')}" data-calc="1">
            ${MOTIVOS_AUSENCIA.map(m => `<option value="${m.id}"${a.motivo === m.id ? ' selected' : ''}>${esc(m.nombre)}</option>`).join('')}
          </select></td>
          <td><select data-path="${ruta('ausencias.' + j + '.aviso')}" data-calc="1">
            ${AVISOS.map(x => `<option value="${x.id}"${a.aviso === x.id ? ' selected' : ''}>${esc(x.nombre)}</option>`).join('')}
          </select></td>
          <td><input data-path="${ruta('ausencias.' + j + '.quienAviso')}" value="${esc(a.quienAviso)}" placeholder="El colaborador, un familiar"></td>
          <td><input type="time" data-path="${ruta('ausencias.' + j + '.horaAviso')}" value="${esc(a.horaAviso)}"></td>
          <td class="num"><button class="mini" data-accion="borrar-item" data-arr="${ruta('ausencias')}" data-idx="${j}">✕</button></td>
        </tr>`).join('') : '<tr><td colspan="8" class="vacio">Sin ausencias cargadas.</td></tr>'}
        </tbody>
      </table></div>
      <div class="acciones"><button class="b sec" data-accion="agregar-ausencia" data-id="${s.id}">+ Agregar ausencia</button></div>`}

      ${bloqueHoras(s)}

      <datalist id="plantel-${s.id}">
        ${(s.colaboradores || []).map(c => `<option value="${esc(c.nombre)}"></option>`).join('')}
      </datalist>
      `}
    </div></td></tr>`;
  }

  /**
   * Horas extras del día anterior. Se piden al día siguiente —el martes las
   * del lunes— pero se guardan en el parte del día en que se trabajaron, que
   * es lo que hace que el acumulado del mes cierre.
   */
  function bloqueHoras(s) {
    const dia = diaAnterior(fechaParte || hoyISO());
    const parte = Store.parteDe(s.id, dia);
    const idx = parte ? Store.get().partes.indexOf(parte) : -1;
    const lista = (parte && parte.horasExtras) || [];
    const total = lista.reduce((a, h) => a + (parseFloat(String(h.horas).replace(',', '.')) || 0), 0);
    const ruta = c => `partes.${idx}.${c}`;

    return `
      <h4 style="margin-top:22px">Horas extras del ${fmtFecha(dia)}
        ${total ? `<span class="chip azul">${fmtNum(total, 1)} h</span>` : ''}</h4>
      <p class="ayuda" style="margin-top:-4px">
        Se cargan al día siguiente, con el turno ya cerrado. Quedan imputadas al
        ${fmtFecha(dia)} y alimentan el acumulado del mes de la sucursal.
      </p>

      ${idx < 0 || !lista.length
        ? '<p class="vacio" style="padding:10px 0">Sin horas extras cargadas para ese día.</p>'
        : `<div class="tabla-scroll"><table>
        <thead><tr><th>Colaborador</th><th>Posición</th><th class="num">Horas</th><th>Motivo</th><th>Autorizó</th><th></th></tr></thead>
        <tbody>
        ${lista.map((h, j) => `<tr>
          <td><input data-path="${ruta('horasExtras.' + j + '.colaborador')}" data-calc="1" value="${esc(h.colaborador)}"
                     list="plantel-${s.id}" placeholder="Apellido y nombre"></td>
          <td><select data-path="${ruta('horasExtras.' + j + '.posicion')}">
            <option value="">—</option>
            ${POSICIONES.map(pp => `<option value="${esc(pp.nombre)}"${h.posicion === pp.nombre ? ' selected' : ''}>${esc(pp.nombre)}</option>`).join('')}
          </select></td>
          <td class="num" style="width:90px"><input type="number" step="0.5" min="0" class="num"
                     data-path="${ruta('horasExtras.' + j + '.horas')}" data-calc="1" value="${esc(h.horas)}"></td>
          <td><select data-path="${ruta('horasExtras.' + j + '.motivo')}" data-calc="1">
            ${MOTIVOS_HORAS.map(m => `<option value="${m.id}"${h.motivo === m.id ? ' selected' : ''}>${esc(m.nombre)}</option>`).join('')}
          </select></td>
          <td><input data-path="${ruta('horasExtras.' + j + '.autorizadoPor')}" value="${esc(h.autorizadoPor)}" placeholder="Quién la autorizó"></td>
          <td class="num"><button class="mini" data-accion="borrar-item" data-arr="${ruta('horasExtras')}" data-idx="${j}">✕</button></td>
        </tr>`).join('')}
        </tbody></table></div>`}

      <div class="acciones">
        <button class="b sec" data-accion="agregar-hora" data-id="${s.id}" data-fecha="${esc(dia)}">+ Agregar hora extra del ${fmtFecha(dia)}</button>
      </div>`;
  }

  /* ======================== VISTA: SUCURSALES ======================= */
  let fichaSucursal = null;   // id de la sucursal con la ficha desplegada

  function vistaSucursales() {
    const e = Store.get();
    contexto = e;
    const gops = e.config.gerentesOperaciones || [];

    const ficha = (s, i) => `<tr class="ficha-fila"><td colspan="7"><div class="talent-card">
      <div class="tc-cab">
        <div><strong>${esc(s.nombre || s.codigo)}</strong>
          <span>${esc(s.marca || MARCA_AREA)}${s.operador && s.operador !== s.marca ? ` · operada por ${esc(s.operador)}` : ''}
            · ${esc(s.razonSocial || 'sin razón social')}${s.cuit ? ` · CUIT ${esc(s.cuit)}` : ''}</span></div>
        ${s.rvd ? `<span class="chip azul">RVD ${esc(s.rvd)}</span>` : ''}
      </div>

      <h4>Identificación</h4>
      <div class="grid c3">

  const PESTANAS = [
    ['minutas',    'Minutas'],
    ['fte',        'FTE y Costo'],

    ['rotacion',   'Rotación y Bajas'],

  function vistaVisita(id, pestana) {
    const e = Store.get();
    const v = Store.visita(id);
    if (!v) return `<p class="vacio">La visita no existe o fue eliminada.</p>`;
    const s = Store.sucursal(v.sucursalId);
    contexto = v;
    visitaEnCurso = v;
    const c = Reporte.calcular(v, s, e.config);

    const cuerpo = {
      minutas:    () => panelMinutas(v, s),
      fte:        () => panelFte(v, c),
      ausentismo: () => panelAusentismo(v, c),
      rotacion:   () => panelRotacion(v, c),
      sanciones:  () => panelSanciones(v),
      talento:    () => panelTalento(v, s),
      sucesion:   () => panelSucesion(v, c),
      dotacion:   () => panelDotacion(v, s, c),
      reporte:    () => panelReporte(v, s, e.config, c)
    }[pestana] || (() => panelMinutas(v, s));

    return `
      <h1 class="titulo">${esc(Store.etiquetaSucursal(s))}</h1>
      <p class="subtitulo">${e.config.area ? esc(e.config.area) + ' · ' : ''}Visita del ${fmtFecha(v.fecha)} · período ${esc(v.periodo || '—')} ·
        ${v.envio.enviado ? '<span class="chip verde">reporte enviado</span>' : '<span class="chip ambar">reporte pendiente de envío</span>'}</p>

      <div class="kpis">
        ${kpi('FTE Real', c.matriz.total.fteReal ? fmtNum(c.matriz.total.fteReal) : '—',
              c.matriz.total.diasTrabajados ? `dotación equiv. ${fmtNum(c.matriz.total.fteVinculo)}` : 'sin dotación cargada')}
        ${kpi('Costo / FTE', c.matriz.total.costoPorFte ? dinero(c.matriz.total.costoPorFte) : '—', c.matriz.total.costoTotal ? `total ${dinero(c.matriz.total.costoTotal)}` : '')}
        ${kpi('Ausentismo', c.ausentismo.pctTotal === null ? '—' : fmtPct(c.ausentismo.pctTotal), `${c.ausentismo.totalDias} días`,
              c.ausentismo.pctTotal !== null && c.ausentismo.pctTotal > e.config.parametros.umbralAusentismo ? 'alerta' : 'ok')}
        ${kpi('Horas extras', c.matriz.total.horasExtras ? fmtNum(c.matriz.total.horasExtras, 0) + ' hs' : '—',
              c.matriz.total.ratioExtras === null ? 'sin horas teóricas para comparar' : fmtPct(c.matriz.total.ratioExtras) + ' de las teóricas',
              c.matriz.total.ratioExtras !== null && c.matriz.total.ratioExtras > e.config.parametros.umbralHorasExtras ? 'alerta' : 'ok')}
        ${kpi('Rotación anualizada', c.rotacion.proyeccionAnual === null ? '—' : fmtPct(c.rotacion.proyeccionAnual, 1), `${c.rotacion.bajas} bajas en el mes`)}
      </div>

      <nav class="tabs" style="border-radius:10px;border:1px solid var(--borde);margin-bottom:18px">
        ${PESTANAS.map(([k, t]) => `<a href="#/visita/${v.id}/${k}" class="${k === pestana ? 'activo' : ''}">${t}</a>`).join('')}
      </nav>

      ${cuerpo()}`;
  }

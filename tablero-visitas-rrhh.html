<title>Panel de Control de RRHH</title>
<style>
/* Panel de Control de RRHH — Farmatodo
   Paleta construida sobre el azul marino de la marca. Los neutros llevan sesgo
   azul: un gris puro al lado de este marino se ve sucio.
   Sin fuentes web a propósito: el panel tiene que abrir desde el disco y sin
   internet, y una tipografía remota fallaría en silencio. */

:root {
  color-scheme: light;
  --azul:        #0b3b72;   /* marino de marca */
  --azul-claro:  #1e6fc4;   /* acento interactivo */
  --marino-hondo:#072c57;
  --rojo:        #c8102e;
  --barra:       #0b3b72;
  --fondo:       #f5f7fa;
  --panel:       #ffffff;
  --panel-alt:   #f7f9fc;
  --borde:       #dce3ec;
  --borde-fuerte:#bfcbda;
  --texto:       #10233b;
  --texto-suave: #55657c;
  --verde:       #1a7f4b;
  --ambar:       #b7791f;
  --rojo-alerta: #c0392b;
  --sombra:      0 1px 2px rgba(16, 32, 54, .06), 0 4px 14px rgba(16, 32, 54, .06);
  --radio:       10px;
}

/* Tema oscuro. Se aplica por preferencia del sistema, salvo que el entorno
   marque una elección explícita de tema claro, y también cuando esa elección
   explícita es oscura. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --azul:        #7fb2e6;
  --azul-claro:  #9cc7f2;
  --marino-hondo:#050f1d;
  --rojo:        #ff6b7a;
  --barra:       #0a1424;
  --fondo:       #0d1626;
  --panel:       #152034;
  --panel-alt:   #1b283f;
  --borde:       #27354e;
  --borde-fuerte:#3a4a68;
  --texto:       #e7edf6;
  --texto-suave: #9aabc2;
  --verde:       #4cc38a;
  --ambar:       #e0a94a;
  --rojo-alerta: #ff7a6b;
  --sombra:      0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --azul:        #7fb2e6;
  --azul-claro:  #9cc7f2;
  --marino-hondo:#050f1d;
  --rojo:        #ff6b7a;
  --barra:       #0a1424;
  --fondo:       #0d1626;
  --panel:       #152034;
  --panel-alt:   #1b283f;
  --borde:       #27354e;
  --borde-fuerte:#3a4a68;
  --texto:       #e7edf6;
  --texto-suave: #9aabc2;
  --verde:       #4cc38a;
  --ambar:       #e0a94a;
  --rojo-alerta: #ff7a6b;
  --sombra:      0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

/* ------------------------------- Header ------------------------------- */
header.app {
  background: var(--barra);
  color: #fff;
  padding: 14px 22px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  box-shadow: var(--sombra);
  position: sticky; top: 0; z-index: 20;
}
header.app .marca { display: flex; align-items: baseline; gap: 10px; }
header.app .marca strong { font-size: 18px; letter-spacing: .2px; }
header.app .marca span { font-size: 12px; opacity: .8; text-transform: uppercase; letter-spacing: 1px; }
header.app .crece { flex: 1; }
header.app button, header.app select {
  background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
  padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
}
header.app button:hover { background: rgba(255,255,255,.22); }
header.app select { width: auto; max-width: 260px; }
header.app select option { color: #16202e; }

/* -------------------------------- Nav --------------------------------- */
nav.tabs {
  display: flex; gap: 2px; overflow-x: auto; background: var(--panel);
  border-bottom: 1px solid var(--borde); padding: 0 14px;
}
nav.tabs a {
  padding: 12px 15px; font-size: 14px; color: var(--texto-suave); text-decoration: none;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
nav.tabs a:hover { color: var(--texto); }
nav.tabs a.activo { color: var(--azul); border-bottom-color: var(--rojo); font-weight: 600; }

main { padding: 22px; max-width: 1280px; margin: 0 auto; }

/* ------------------------------ Bloques -------------------------------- */
section.tarjeta {
  background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--sombra);
}
section.tarjeta > h2 {
  margin: 0 0 4px; font-size: 16px; color: var(--azul); letter-spacing: .2px;
}
section.tarjeta > p.ayuda { margin: 0 0 16px; color: var(--texto-suave); font-size: 13px; }

h1.titulo { font-size: 22px; margin: 0 0 4px; }
p.subtitulo { color: var(--texto-suave); margin: 0 0 18px; font-size: 14px; }

/* ------------------------------- KPIs ---------------------------------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi {
  background: var(--panel); border: 1px solid var(--borde); border-left: 4px solid var(--azul-claro);
  border-radius: var(--radio); padding: 14px 16px; box-shadow: var(--sombra);
}
.kpi .etiqueta { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--texto-suave); }
.kpi .valor { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .nota { font-size: 12px; color: var(--texto-suave); margin-top: 2px; }
.kpi.alerta { border-left-color: var(--rojo-alerta); }
.kpi.ok { border-left-color: var(--verde); }
.kpi.aviso { border-left-color: var(--ambar); }

/* ------------------------------ Tablas --------------------------------- */
.tabla-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--borde); }
th {
  background: var(--panel-alt); font-size: 11px; text-transform: uppercase;
  letter-spacing: .6px; color: var(--texto-suave); font-weight: 600; white-space: nowrap;
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.tipo { white-space: nowrap; }
tr.total td { font-weight: 700; background: var(--panel-alt); border-top: 2px solid var(--borde-fuerte); }
tbody tr:hover { background: var(--panel-alt); }
tfoot td { font-weight: 700; background: var(--panel-alt); border-top: 2px solid var(--borde-fuerte); }

/* ----------------------------- Formularios ----------------------------- */
.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid.c4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

label.campo { display: block; font-size: 12px; color: var(--texto-suave); font-weight: 600; }
label.campo > span { display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }

input, select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--borde-fuerte); border-radius: 8px;
  background: var(--panel); color: var(--texto); font: inherit; font-size: 14px; font-weight: 400;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--azul-claro); outline-offset: -1px; }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
table input, table select { padding: 6px 8px; font-size: 13px; }
input.num { text-align: right; font-variant-numeric: tabular-nums; }

button.b {
  background: var(--azul); color: #fff; border: 0; padding: 9px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button.b:hover { background: var(--azul-claro); }
button.b.sec { background: transparent; color: var(--azul); border: 1px solid var(--borde-fuerte); }
button.b.sec:hover { background: var(--panel-alt); }
button.b.peligro { background: transparent; color: var(--rojo-alerta); border: 1px solid var(--rojo-alerta); }
button.b.peligro:hover { background: rgba(192,57,43,.08); }
button.mini {
  background: transparent; border: 1px solid var(--borde-fuerte); color: var(--texto-suave);
  border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer;
}
button.mini:hover { color: var(--rojo-alerta); border-color: var(--rojo-alerta); }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }

/* ------------------------------ Etiquetas ------------------------------ */
.chip {
  display: inline-block; white-space: nowrap; padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
  font-weight: 600; border: 1px solid var(--borde-fuerte); color: var(--texto-suave);
}
.chip.verde { color: var(--verde); border-color: var(--verde); }
.chip.ambar { color: var(--ambar); border-color: var(--ambar); }
.chip.rojo  { color: var(--rojo-alerta); border-color: var(--rojo-alerta); }
.chip.azul  { color: var(--azul); border-color: var(--azul); }

.aviso-caja {
  border-left: 3px solid var(--ambar); background: var(--panel-alt);
  padding: 10px 14px; border-radius: 6px; font-size: 13px; margin: 12px 0;
}
.aviso-caja.info { border-left-color: var(--azul-claro); }
.aviso-caja ul { margin: 6px 0 0; padding-left: 18px; }

pre.reporte {
  background: var(--panel-alt); border: 1px solid var(--borde); border-radius: 8px;
  padding: 16px; overflow-x: auto; font-size: 12.5px; line-height: 1.45;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; white-space: pre;
}

/* ------------------------ Heat map de sucesión ------------------------- */
.heat { display: grid; grid-template-columns: 150px repeat(3, 1fr); gap: 4px; margin-top: 12px; font-size: 12.5px; }
.heat .eje { display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; color: var(--texto-suave); font-weight: 600; text-align: right; }
.heat .cab { text-align: center; color: var(--texto-suave); font-weight: 600; padding: 6px 4px; }
.heat .celda { min-height: 74px; border-radius: 8px; padding: 8px; border: 1px solid var(--borde); }
.heat .celda.n1 { background: rgba(26,127,75,.10); }
.heat .celda.n2 { background: rgba(183,121,31,.12); }
.heat .celda.n3 { background: rgba(192,57,43,.12); }
.heat .celda div { font-size: 12px; margin-bottom: 3px; }

.vacio { color: var(--texto-suave); font-style: italic; padding: 14px 0; font-size: 13.5px; }

/* --------------- Medidor de costo laboral sobre la venta ---------------- *
   Un valor contra dos umbrales: no es un gráfico, es un indicador de estado.
   El color nunca va solo; siempre lo acompañan el ícono y el texto. */
.medidor { margin: 18px 0 6px; }
.medidor .pista {
  position: relative; height: 26px; border-radius: 6px; overflow: hidden;
  display: flex; border: 1px solid var(--borde);
}
.medidor .zona { height: 100%; }
.medidor .zona.z1 { background: rgba(26,127,75,.20); }
.medidor .zona.z2 { background: rgba(183,121,31,.22); }
.medidor .zona.z3 { background: rgba(192,57,43,.20); }
.medidor .marca {
  position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px;
  background: var(--texto); box-shadow: 0 0 0 2px var(--panel);
}
.medidor .umbral {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--texto-suave); opacity: .55;
}
.medidor .escala { position: relative; height: 34px; margin-top: 5px; font-variant-numeric: tabular-nums; }
.medidor .escala span {
  position: absolute; transform: translateX(-50%); text-align: center;
  font-size: 11px; color: var(--texto-suave); line-height: 1.35; white-space: nowrap;
}
.medidor .escala span b { display: block; color: var(--texto); font-size: 12px; }
.medidor .valor {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
}
.medidor .valor strong { font-size: 26px; font-variant-numeric: tabular-nums; }
.medidor .valor em { font-style: normal; font-size: 13px; color: var(--texto-suave); }

/* ----------------------------- Matriz 9-box ---------------------------- */
/* Cinco columnas: eje vertical, etiquetas de fila y los tres cuadrantes.
   Cada elemento fuera de la grilla de cuadrantes lleva su columna explícita,
   porque el autoposicionamiento corría todo una columna. */
.ninebox {
  display: grid; grid-template-columns: 26px 132px repeat(3, 1fr); gap: 6px;
  margin-top: 14px; align-items: stretch;
}
.ninebox .esquina { grid-column: 1 / span 2; grid-row: 1; }
.ninebox .eje-y {
  grid-column: 1; grid-row: 2 / span 3;
  writing-mode: vertical-rl; transform: rotate(180deg);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--texto-suave); font-weight: 600;
}
.ninebox .rot-cab, .ninebox .eje-x {
  text-align: center; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--texto-suave); font-weight: 600; padding: 4px 0;
}
.ninebox .eje-x { grid-column: 3 / span 3; }
.ninebox .eje-lbl {
  grid-column: 2;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 10px;
  font-size: 12.5px; color: var(--texto-suave); font-weight: 600; text-align: right;
}
.ninebox .caja {
  min-height: 112px; border: 1px solid var(--borde); border-radius: 8px; padding: 8px;
  display: flex; flex-direction: column; gap: 6px; transition: outline-color .12s;
  outline: 2px solid transparent; outline-offset: -2px;
}
.ninebox .caja.encima { outline-color: var(--azul-claro); background: var(--panel-alt); }
.ninebox .caja-cab {
  font-size: 11.5px; font-weight: 700; color: var(--texto); display: flex;
  justify-content: space-between; gap: 6px; letter-spacing: .2px;
}
.ninebox .caja-cab span { color: var(--texto-suave); font-weight: 600; }
.ninebox .caja-gente { display: flex; flex-direction: column; gap: 4px; }

.caja.tono-verde    { background: rgba(26,127,75,.10);  border-color: rgba(26,127,75,.30); }
.caja.tono-azul     { background: rgba(28,95,158,.09);  border-color: rgba(28,95,158,.26); }
.caja.tono-amarillo { background: rgba(183,121,31,.12); border-color: rgba(183,121,31,.30); }
.caja.tono-rojo     { background: rgba(192,57,43,.11);  border-color: rgba(192,57,43,.30); }

.persona {
  background: var(--panel); border: 1px solid var(--borde-fuerte); border-radius: 6px;
  padding: 5px 8px; font-size: 12.5px; font-weight: 600; cursor: grab; line-height: 1.3;
  box-shadow: 0 1px 2px rgba(16,32,54,.07);
}
.persona span { display: block; font-size: 11px; font-weight: 400; color: var(--texto-suave); }
.persona:active { cursor: grabbing; }
.persona.arrastrando { opacity: .4; }

.alerta.tono-borde-verde    { border-left-color: var(--verde); }
.alerta.tono-borde-azul     { border-left-color: var(--azul-claro); }
.alerta.tono-borde-amarillo { border-left-color: var(--ambar); }
.alerta.tono-borde-rojo     { border-left-color: var(--rojo-alerta); }

/* ------------------------------ Talent card ---------------------------- */
tr.ficha-fila > td { background: var(--panel-alt); padding: 0; }
tr.inactivo { opacity: .55; }
.talent-card { padding: 18px 20px; }
.talent-card .tc-cab {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  flex-wrap: wrap; padding-bottom: 12px; margin-bottom: 6px; border-bottom: 1px solid var(--borde);
}
.talent-card .tc-cab strong { font-size: 15px; }
.talent-card .tc-cab span { display: block; font-size: 12.5px; color: var(--texto-suave); }
.talent-card h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--texto-suave); margin: 18px 0 8px;
}

@media (max-width: 720px) {
  .ninebox { grid-template-columns: 20px 84px repeat(3, 1fr); }
  .ninebox .eje-lbl { font-size: 11px; }
}

/* ------------------- Confirmación y avisos propios --------------------- *
   El visor de la página publicada bloquea confirm() y alert() del navegador,
   así que el tablero dibuja los suyos. */
.velo {
  position: fixed; inset: 0; background: rgba(16, 32, 54, .45);
  display: flex; align-items: center; justify-content: center; z-index: 300; padding: 20px;
}
.dialogo {
  background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio);
  box-shadow: 0 12px 40px rgba(16, 32, 54, .25); padding: 22px 24px;
  max-width: 440px; width: 100%;
}
.dialogo h3 { margin: 0 0 8px; font-size: 16px; color: var(--azul); }
.dialogo p { margin: 0 0 18px; font-size: 14px; line-height: 1.5; }
.dialogo .acciones { margin: 0; justify-content: flex-end; }

.avisos { position: fixed; right: 18px; bottom: 18px; z-index: 400; display: flex; flex-direction: column; gap: 8px; }
.aviso-flotante {
  background: var(--panel); border: 1px solid var(--borde); border-left: 4px solid var(--verde);
  border-radius: 8px; padding: 11px 16px; box-shadow: var(--sombra); font-size: 13.5px;
  max-width: 380px; animation: entra .18s ease-out;
}
.aviso-flotante.error { border-left-color: var(--rojo-alerta); }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .aviso-flotante { animation: none; } }

/* =========================== Portada de acceso ========================== *
   Banda de marca a la izquierda, acceso a la derecha. En pantallas angostas
   la banda pasa a ser un encabezado y el formulario queda debajo. */
body.bloqueado { overflow: hidden; }
body.bloqueado > header.app,
body.bloqueado > nav.tabs,
body.bloqueado > main,
body.bloqueado > footer.app { display: none; }

#acceso { position: fixed; inset: 0; z-index: 200; background: var(--fondo); }

.portada {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  height: 100%; overflow: auto;
}

.portada-marca {
  background: var(--azul);
  background-image: linear-gradient(158deg, var(--azul) 0%, var(--marino-hondo) 100%);
  color: #fff; padding: 56px 52px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
}
.portada-marca .marca { width: 56px; height: 56px; color: #fff; display: block; margin-bottom: 30px; }
.pm-eyebrow {
  margin: 0 0 12px; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: 2.2px; color: rgba(255,255,255,.72); font-weight: 600;
}
.portada-marca h1 {
  margin: 0 0 16px; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.08;
  font-weight: 700; letter-spacing: -.6px; text-wrap: balance; max-width: 12ch;
}
.pm-bajada { margin: 0; font-size: 15.5px; line-height: 1.6; color: rgba(255,255,255,.86); max-width: 42ch; }
.pm-pie { margin: 0; font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,.6); max-width: 44ch; }

.portada-acceso { display: flex; align-items: center; justify-content: center; padding: 48px 40px; }
.pa-caja { width: 100%; max-width: 380px; }
.pa-hola {
  margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: 2.2px; color: var(--azul-claro); font-weight: 700;
}
.pa-caja h2 { margin: 0 0 10px; font-size: 23px; letter-spacing: -.3px; color: var(--texto); }
.pa-texto { margin: 0 0 24px; font-size: 14px; line-height: 1.6; color: var(--texto-suave); }
.pa-caja form { display: flex; flex-direction: column; gap: 14px; }
.pa-boton { width: 100%; padding: 12px; font-size: 15px; margin-top: 4px; }
.pa-error {
  margin: 0; font-size: 13px; color: var(--rojo-alerta); font-weight: 600;
  background: rgba(192,57,43,.08); border-radius: 6px; padding: 9px 12px;
}
.pa-nota {
  margin: 22px 0 0; font-size: 12.5px; line-height: 1.6; color: var(--texto-suave);
  border-left: 3px solid var(--ambar); padding-left: 12px;
}
.pa-nota strong { color: var(--texto); }
.pa-link {
  margin-top: 18px; background: none; border: 0; padding: 0; cursor: pointer;
  font: inherit; font-size: 13px; color: var(--azul-claro); text-decoration: underline;
  text-underline-offset: 3px;
}
.pa-link:hover { color: var(--azul); }

@media (max-width: 860px) {
  .portada { grid-template-columns: 1fr; height: auto; min-height: 100%; }
  .portada-marca { padding: 40px 28px; gap: 26px; }
  .portada-marca .marca { width: 44px; height: 44px; margin-bottom: 20px; }
  .portada-acceso { padding: 36px 28px 56px; }
  .pa-caja { max-width: none; }
}

footer.app { text-align: center; color: var(--texto-suave); font-size: 12px; padding: 26px 20px 40px; }

@media (max-width: 640px) {
  main { padding: 14px; }
  header.app { padding: 12px 14px; gap: 10px; }
  .heat { grid-template-columns: 96px repeat(3, 1fr); }
}

</style>

<header class="app">
    <div class="marca">
      <strong>Panel de Control de RRHH</strong>
      <span>Farmatodo</span>
    </div>
    <div class="crece"></div>

}

/*
 * modelo.js — Motor de cálculo.
 *
 * Convención de FTE (la que usa la hoja DOT de TD01 y la que acordamos):
 *   "Días trabajados" = días de VÍNCULO laboral en el mes, no días presentes.
 *   Una posición cubierta todo el mes aporta 30 días; un alta o una baja
 *   aportan los días efectivos de ese mes. El ausentismo se descuenta aparte,
 *   de modo que no se computa dos veces.
 *
 *   FTE Real = (días de vínculo / 30) - (días ausentes / 30) + (horas extras / 200)
 */

/* ---------------------------- utilidades ---------------------------- */
const num = v => {
  const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(',', '.'));
  return isFinite(n) ? n : 0;
};

const redondear = (n, d = 2) => {
  const f = Math.pow(10, d);
  return Math.round((num(n) + Number.EPSILON) * f) / f;
};

/* --------------------------- FTE y costos --------------------------- */

/**
 * Calcula FTE y costo laboral de una fila de posición.
 * @param {object} fila  { rol, heads, diasAltas, diasBajas, diasAusentes,
 *                         horasExtras, sueldoBruto, costoHE, bonos, cargasManual }
 * @param {object} par   parámetros (diasMes, horasMes, factorCargas)
 */
function calcularPosicion(fila, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const heads = num(fila.heads);

  // Días de vínculo: dotación estable + prorrateo de altas y bajas del mes.
  const diasEstables = heads * p.diasMes;
  const diasAltas = num(fila.diasAltas);
  const diasBajas = num(fila.diasBajas);
  const diasTrabajados = diasEstables + diasAltas + diasBajas;

  const diasAusentes = num(fila.diasAusentes);
  const horasExtras = num(fila.horasExtras);

  const fteVinculo   = diasTrabajados / p.diasMes;
  const fteAusencias = -(diasAusentes / p.diasMes);
  const fteExtras    = horasExtras / p.horasMes;
  const fteReal      = fteVinculo + fteAusencias + fteExtras;

  // Costo laboral
  const sueldoBruto = num(fila.sueldoBruto);
  const costoHE     = num(fila.costoHE);
  const bonos       = num(fila.bonos);
  const baseCargas  = sueldoBruto + costoHE + bonos;
  const cargas = fila.cargasManual !== '' && fila.cargasManual !== null && fila.cargasManual !== undefined
    ? num(fila.cargasManual)
    : baseCargas * (p.factorCargas - 1);
  const costoTotal = sueldoBruto + costoHE + bonos + cargas;
  const costoPorFte = fteReal > 0 ? costoTotal / fteReal : null;

  // Horas extras como % de las horas teóricas de la posición
  const horasTeoricas = heads * p.horasMes;
  const ratioExtras = horasTeoricas > 0 ? horasExtras / horasTeoricas : null;

  // Ausentismo de la posición sobre días de vínculo
  const ratioAusentismo = diasTrabajados > 0 ? diasAusentes / diasTrabajados : null;

  return {
    rol: fila.rol,
    heads,
    diasAltas, diasBajas, diasTrabajados,
    diasAusentes, horasExtras,
    fteVinculo, fteAusencias, fteExtras, fteReal,
    sueldoBruto, costoHE, bonos, cargas, costoTotal, costoPorFte,
    ratioExtras, ratioAusentismo,
    // Brecha de cobertura: FTE Real contra la dotación equivalente que surge de
    // los días de vínculo. Negativa = se perdió cobertura por ausencias más de
    // lo que se recuperó con horas extras.
    brechaFte: fteReal - fteVinculo
  };
}

/** Suma la matriz completa de posiciones de una visita. */
function calcularMatriz(posiciones, par) {
  const filas = (posiciones || []).map(f => calcularPosicion(f, par));
  const acc = (k) => filas.reduce((s, f) => s + num(f[k]), 0);

  const total = {
    rol: 'TOTAL',
    heads: acc('heads'),
    diasAltas: acc('diasAltas'),
    diasBajas: acc('diasBajas'),
    diasTrabajados: acc('diasTrabajados'),
    diasAusentes: acc('diasAusentes'),
    horasExtras: acc('horasExtras'),
    fteReal: acc('fteReal'),
    sueldoBruto: acc('sueldoBruto'),
    costoHE: acc('costoHE'),
    bonos: acc('bonos'),
    cargas: acc('cargas'),
    costoTotal: acc('costoTotal')
  };
  total.costoPorFte = total.fteReal > 0 ? total.costoTotal / total.fteReal : null;
  total.fteVinculo = total.diasTrabajados / (par && par.diasMes ? par.diasMes : PARAMETROS_DEFECTO.diasMes);
  total.brechaFte = total.fteReal - total.fteVinculo;

  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const horasTeoricas = total.heads * p.horasMes;
  total.ratioExtras = horasTeoricas > 0 ? total.horasExtras / horasTeoricas : null;
  total.ratioAusentismo = total.diasTrabajados > 0 ? total.diasAusentes / total.diasTrabajados : null;

  return { filas, total };
}

/* --------------------------- Ausentismo ----------------------------- */

/**
 * Consolida el detalle de ausentismo por concepto.
 *
 * Si todavía no se cargó la apertura por concepto, se toman los días ausentes
 * de la matriz de FTE: así el porcentaje del panel refleja lo que realmente se
 * relevó, en lugar de mostrar cero. El flag `sinApertura` avisa que falta el
 * detalle.
 *
 * @param {object} detalle  { '085': 12, '071': 30, ... } días por código
 * @param {number} diasDisponibles  total de días de vínculo del mes
 * @param {number} diasMatriz  días ausentes cargados en la matriz de FTE
 */
function calcularAusentismo(detalle, diasDisponibles, diasMatriz) {
  detalle = detalle || {};
  const base = num(diasDisponibles);
  const grupos = AUSENTISMO_GRUPOS.map(g => {
    const conceptos = g.conceptos.map(c => {
      const dias = num(detalle[c.cod]);
      return { cod: c.cod, nombre: c.nombre, dias, pct: base > 0 ? dias / base : null };
    });
    const dias = conceptos.reduce((s, c) => s + c.dias, 0);
    return { id: g.id, nombre: g.nombre, ayuda: g.ayuda, conceptos, dias, pct: base > 0 ? dias / base : null };
  });

  const detallados = grupos.reduce((s, g) => s + g.dias, 0);
  const gestionable = grupos
    .filter(g => g.id === 'inactivo' || g.id === 'controlable')
    .reduce((s, g) => s + g.dias, 0);

  const sinApertura = detallados === 0 && num(diasMatriz) > 0;
  const totalDias = sinApertura ? num(diasMatriz) : detallados;

  return {
    grupos,
    diasDisponibles: base,
    diasDetallados: detallados,
    diasMatriz: num(diasMatriz),
    sinApertura,
    totalDias,
    pctTotal: base > 0 ? totalDias / base : null,
    diasGestionables: gestionable,
    pctGestionable: base > 0 ? gestionable / base : null
  };
}

/* ------------------------- Rotación y bajas ------------------------- */

/**
 * Rotación del mes según la planilla ESTADISTICA (5) de TD01.
 *   dotación promedio = (dotación anterior + nueva dotación) / 2
 *   rotación mensual  = bajas / dotación promedio
 *   proyección anual  = rotación mensual x 12
 */
function calcularRotacion(rot) {
  rot = rot || {};
  const anterior  = num(rot.dotacionAnterior);
  const altasExt  = num(rot.altasExternas);
  const altasInt  = num(rot.altasInternas);
  const bajasExt  = num(rot.bajasExternas);
  const bajasInt  = num(rot.bajasInternas);

  const nueva = anterior + altasExt + altasInt - bajasExt - bajasInt;
  const promedio = (anterior + nueva) / 2;
  const bajas = bajasExt + bajasInt;

  const mensual = promedio > 0 ? bajas / promedio : null;

  return {
    anterior, altasExt, altasInt, bajasExt, bajasInt, bajas,
    nueva,
    promedio,
    variacion: anterior > 0 ? (nueva - anterior) / anterior : null,
    mensual,
    proyeccionAnual: mensual === null ? null : mensual * 12
  };
}

/** Agrupa las bajas registradas por categoría (renuncia / despido / otros). */
function agruparBajas(movimientos) {
  const bajas = (movimientos || []).filter(m => m.tipo === 'baja');
  const grupos = MOTIVOS_BAJA.map(g => ({
    id: g.id,
    nombre: g.nombre,
    casos: bajas.filter(b => b.categoria === g.id).length
  }));
  const total = bajas.length;
  grupos.forEach(g => { g.pct = total > 0 ? g.casos / total : null; });
  return { grupos, total };
}

/* ----------------- Dotación óptima vs. venta (Selma) ---------------- */

/**
 * Reproduce el modelo de la planilla de dotación:
 *   costo laboral real   = brutos x factor de cargas
 *   % costo / venta      = costo laboral real / venta neta
 *   costo por empleado   = costo laboral real / empleados
 *   dotación óptima      = (venta x benchmark) / costo por empleado
 *   ahorro / inversión   = costo óptimo - costo real
 */
function calcularDotacionOptima({ tipo, empleados, costoLaboralReal, venta, ventaRed }, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const emp = num(empleados);
  const costo = num(costoLaboralReal);
  const v = num(venta);

  if (tipo === 'staff') {
    const base = num(ventaRed);
    const pct = base > 0 ? costo / base : null;
    return {
      tipo: 'staff',
      costoReal: costo,
      pctCostoVenta: pct,
      benchmark: p.benchmarkStaff,
      dotacionOptima: null,
      diferencia: null,
      semaforo: pct === null
        ? { clave: 'sd', icono: '⚪', texto: 'Sin venta de red cargada' }
        : (pct > p.benchmarkStaff
            ? { clave: 'reducir', icono: '🔴', texto: 'Staff sobredimensionado' }
            : { clave: 'optima', icono: '✅', texto: 'Staff dentro del benchmark' })
    };
  }

  if (!v || !emp || !costo) {
    return {
      tipo: 'venta', costoReal: costo, pctCostoVenta: null,
      benchmark: p.benchmarkCostoVenta, alerta: p.alertaCostoVenta,
      dotacionOptima: null, dotacionMaxima: null, diferencia: null, costoOptimo: null, ahorro: null,
      semaforo: semaforoDotacion(null), banda: evaluarCostoVenta(null, p)
    };
  }

  const costoPorEmpleado = costo / emp;
  const dotacionOptima = Math.round((v * p.benchmarkCostoVenta) / costoPorEmpleado);
  const dotacionMaxima = Math.floor((v * p.alertaCostoVenta) / costoPorEmpleado);
  const diferencia = dotacionOptima - emp;
  const costoOptimo = dotacionOptima * costoPorEmpleado;
  const pct = costo / v;

  return {
    tipo: 'venta',
    costoReal: costo,
    pctCostoVenta: pct,
    benchmark: p.benchmarkCostoVenta,
    alerta: p.alertaCostoVenta,
    costoPorEmpleado,
    dotacionOptima,
    dotacionMaxima,          // dotación que la venta sostiene antes del techo de alerta
    diferencia,
    costoOptimo,
    ahorro: costoOptimo - costo,
    semaforo: semaforoDotacion(diferencia),
    banda: evaluarCostoVenta(pct, p)
  };
}

/**
 * Productividad: 6 tickets por hora por cada 6 horas trabajadas.
 * Un cumplimiento por encima del 100% sugiere que la tienda vende más de lo
 * que su dotación puede sostener; por debajo, sobra cobertura.
 */
function calcularProductividad({ tickets, horasTrabajadas }, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const t = num(tickets), h = num(horasTrabajadas);
  if (!t || !h) return null;
  const real = t / h;
  return {
    ticketsHora: real,
    objetivo: p.ticketsHoraObjetivo,
    cumplimiento: real / p.ticketsHoraObjetivo
  };
}

/* ---------------------------- Sucesión ------------------------------ */

/**
 * Heat map 9-box del toolkit de sucesión: criticidad (1-3) x escasez (1-3).
 * Se considera crítica toda posición con criticidad >= 2,5 o
 * criticidad >= 2 combinada con escasez alta.
 */
function evaluarSucesion(items) {
  const lista = (items || []).map(it => {
    const criticidad = num(it.criticidad);
    const escasez = num(it.escasez);
    const candidatos = it.candidatos || [];
    const listos = candidatos.filter(c => c.readiness === 'lt1').length;
    const critica = criticidad >= 2.5 || (criticidad >= 2 && escasez >= 3);
    return {
      ...it,
      criticidad, escasez, candidatos,
      candidatosTotal: candidatos.length,
      candidatosListos: listos,
      critica,
      conPlan: candidatos.length > 0,
      riesgo: critica && candidatos.length === 0
        ? 'alto'
        : (critica && listos === 0 ? 'medio' : 'bajo')
    };
  });

  const criticas = lista.filter(i => i.critica);
  return {
    lista,
    posicionesCriticas: criticas.length,
    criticasConPlan: criticas.filter(i => i.conPlan).length,
    promedioCandidatos: criticas.length
      ? criticas.reduce((s, i) => s + i.candidatosTotal, 0) / criticas.length
      : 0,
    candidatosListos: lista.reduce((s, i) => s + i.candidatosListos, 0),
    enRiesgo: lista.filter(i => i.riesgo === 'alto')
  };
}

/* ------------------------ Diagnóstico automático -------------------- */

/* Formateo local en es-AR, para que el diagnóstico automático use la misma
   coma decimal que el resto del reporte. */
const _pct = (n, d = 2) =>
  (num(n) * 100).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const _n = (v, d = 2) =>
  num(v).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });

/**
 * Genera hallazgos automáticos a partir de las métricas de la visita.
 * No reemplaza el criterio del coordinador: es el piso del análisis.
 */
function generarHallazgos(v, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const out = [];
  const m = calcularMatriz(v.posiciones, p);
  const aus = calcularAusentismo(v.ausentismo && v.ausentismo.detalle, m.total.diasTrabajados, m.total.diasAusentes);
  const rot = calcularRotacion(v.rotacion);

  if (aus.pctTotal !== null && aus.pctTotal > p.umbralAusentismo) {
    out.push(`Ausentismo total del ${_pct(aus.pctTotal)}, por encima del umbral de referencia del ${_pct(p.umbralAusentismo, 0)}.` +
      (aus.sinApertura
        ? ' Falta la apertura por concepto para separar los días gestionables de los que no lo son.'
        : ` De esos días, ${aus.diasGestionables} son gestionables (${_pct(aus.pctGestionable)} de la base).`));
  }
  if (m.total.ratioExtras !== null && m.total.ratioExtras > p.umbralHorasExtras) {
    out.push(`Las horas extras equivalen al ${_pct(m.total.ratioExtras)} de las horas teóricas de la dotación (${m.total.horasExtras} hs), ` +
      `es decir ${_n(m.total.horasExtras / p.horasMes)} FTE comprados por sobretiempo.`);
  }
  if (m.total.brechaFte < -0.5) {
    out.push(`La tienda opera con ${_n(Math.abs(m.total.brechaFte))} FTE por debajo de su dotación equivalente ` +
      `(${_n(m.total.fteVinculo)} personas contratadas / ${_n(m.total.fteReal)} FTE efectivos).`);
  }

  m.filas.forEach(f => {
    if (f.heads > 0 && f.ratioAusentismo !== null && f.ratioAusentismo > p.umbralAusentismo * 2) {
      out.push(`${f.rol}: ausentismo del ${_pct(f.ratioAusentismo)}, más del doble del umbral. Requiere revisión individual de casos.`);
    }
    if (f.heads > 0 && f.ratioExtras !== null && f.ratioExtras > p.umbralHorasExtras * 2) {
      out.push(`${f.rol}: ${f.horasExtras} hs extras (${_pct(f.ratioExtras)} de sus horas teóricas). Verificar si es un déficit estructural de dotación.`);
    }
  });

  const dot = calcularDotacionOptima({
    tipo: 'venta', empleados: m.total.heads, costoLaboralReal: m.total.costoTotal,
    venta: v.comercial && v.comercial.venta
  }, p);
  if (dot.pctCostoVenta !== null) {
    if (dot.banda.zona === 'alerta') {
      const causas = [];
      if (m.total.ratioExtras !== null && m.total.ratioExtras > p.umbralHorasExtras) {
        causas.push(`las horas extras representan el ${_pct(m.total.ratioExtras)} de las horas teóricas`);
      }
      if (m.total.heads > dot.dotacionMaxima) {
        causas.push(`la venta sostiene hasta ${dot.dotacionMaxima} personas antes del techo y la tienda tiene ${m.total.heads}`);
      }
      out.push(`Costo laboral en ${_pct(dot.pctCostoVenta)} de la venta, por encima del techo de alerta del ${_pct(p.alertaCostoVenta, 0)}. ` +
        (causas.length ? `En esta tienda: ${causas.join('; ')}. ` : '') +
        'Revisar si es sobreestructura, caída de ventas o un modelo operativo costoso.');
    } else if (dot.banda.zona === 'atencion') {
      out.push(`Costo laboral en ${_pct(dot.pctCostoVenta)} de la venta: por encima del objetivo del ${_pct(p.benchmarkCostoVenta, 0)} ` +
        `pero por debajo del techo de alerta del ${_pct(p.alertaCostoVenta, 0)}.`);
    }
  }

  if (rot.proyeccionAnual !== null && rot.proyeccionAnual > 0.30) {
    out.push(`Rotación mensual del ${_pct(rot.mensual)}, que proyectada al año da ${_pct(rot.proyeccionAnual, 1)}. Revisar causas de egreso.`);
  }
  if ((v.sanciones || []).length >= 3) {
    out.push(`${v.sanciones.length} sanciones registradas en el período. Analizar concentración por sector y por motivo.`);
  }

  const suc = evaluarSucesion(v.sucesion);
  if (suc.enRiesgo.length) {
    out.push(`${suc.enRiesgo.length} posición/es crítica/s sin candidato de sucesión identificado: ${suc.enRiesgo.map(i => i.posicion).join(', ')}.`);
  }

  return out;
}

/* ---------------------------- Utilidades ----------------------------- */

/** Antigüedad en años a partir de la fecha de ingreso. */
function antiguedadAnios(fechaIngreso) {
  if (!fechaIngreso) return null;
  const d = new Date(fechaIngreso + 'T00:00:00');
  if (isNaN(d)) return null;
  return (Date.now() - d.getTime()) / (365.25 * 24 * 3600 * 1000);
}

/**
 * Registra una evaluación. Solo agrega al historial si algo cambió, para que
 * el historial cuente movimientos y no reediciones.
 */
function registrarEvaluacion(colaborador, desempeno, potencial, contexto) {
  const d = Number(desempeno) || null;
  const pot = Number(potencial) || null;
  const previo = { desempeno: colaborador.desempeno || null, potencial: colaborador.potencial || null };
  const cambio = previo.desempeno !== d || previo.potencial !== pot;

  colaborador.desempeno = d;
  colaborador.potencial = pot;
  if (!Array.isArray(colaborador.historial)) colaborador.historial = [];

  if (cambio && (d || pot)) {
    colaborador.historial.push({
      fecha: (contexto && contexto.fecha) || new Date().toISOString().slice(0, 10),
      desempeno: d, potencial: pot,
      desde: previo.desempeno || previo.potencial ? previo : null,
      evaluadoCon: (contexto && contexto.evaluadoCon) || '',
      motivo: (contexto && contexto.motivo) || ''
    });
    colaborador.fechaEvaluacion = (contexto && contexto.fecha) || new Date().toISOString().slice(0, 10);
    colaborador.evaluadoCon = (contexto && contexto.evaluadoCon) || colaborador.evaluadoCon || '';
  }
  return cambio;
}

/** Distribución del plantel en la matriz, para el panel y el reporte. */
function distribucion9Box(colaboradores) {
  const activos = (colaboradores || []).filter(c => c.activo !== false);
  const evaluados = activos.filter(c => c.desempeno && c.potencial);

  const celdas = {};
  Object.keys(NINE_BOX).forEach(k => { celdas[k] = []; });
  evaluados.forEach(c => { celdas[String(c.potencial) + String(c.desempeno)].push(c); });

  // Todas las agrupaciones devuelven listas, para poder contarlas y nombrarlas
  const porTono = tono => evaluados.filter(c => (cuadranteDe(c.potencial, c.desempeno) || {}).tono === tono);

  return {
    activos, evaluados,
    sinEvaluar: activos.filter(c => !c.desempeno || !c.potencial),
    celdas,
    fortalezas: porTono('verde'),
    aTrabajar: porTono('amarillo'),
    enRiesgo: porTono('rojo'),
    listosParaCrecer: evaluados.filter(c => c.potencial >= 2 && c.desempeno >= 2),
    riesgoDeSalida: activos.filter(c => c.riesgoSalida === 'alto'),
    estudiando: activos.filter(c => c.estudia && c.estudia !== 'noEstudia')
  };
}

/*
 * presentismo.js — Parte diario de ausencias y presentismo por turno.
 *
 * El parte es por sucursal y por día. Cada ausencia dice a qué turno pertenece,
 * el motivo, y si el colaborador avisó: esa última distinción es la que separa
 * el ausentismo gestionable del que no lo es.
 *
 * El presentismo del día sale de comparar los ausentes contra la dotación
 * esperada de cada turno, que se carga una vez por sucursal.
 */

const TURNOS = [
  { id: 'manana',     nombre: 'Mañana',     desde: '08:00', hasta: '16:00' },
  { id: 'intermedio', nombre: 'Intermedio', desde: '10:00', hasta: '19:00' },
  { id: 'noche',      nombre: 'Noche',      desde: '16:00', hasta: '23:00' }
];

const TURNOS_POR_ID = TURNOS.reduce((m, t) => { m[t.id] = t; return m; }, {});

/* Motivos del parte diario. `gestionable` marca los que la tienda y RRHH
   pueden incidir; el resto son licencias y hechos de fuerza mayor. */
const MOTIVOS_AUSENCIA = [
  { id: 'enfermedad',    nombre: 'Enfermedad',                gestionable: true },
  { id: 'accidente',     nombre: 'Accidente o ART',           gestionable: false },
  { id: 'famEnfermo',    nombre: 'Enfermedad de familiar',    gestionable: true },
  { id: 'tramite',       nombre: 'Trámite personal',          gestionable: true },
  { id: 'estudio',       nombre: 'Estudio o examen',          gestionable: false },
  { id: 'personal',      nombre: 'Tema personal',             gestionable: true },
  { id: 'transporte',    nombre: 'Problema de transporte',    gestionable: true },
  { id: 'sinAviso',      nombre: 'No se presentó ni avisó',   gestionable: true },
  { id: 'licencia',      nombre: 'Licencia (vacaciones, matrimonio, etc.)', gestionable: false },
  { id: 'suspension',    nombre: 'Suspensión',                gestionable: true },
  { id: 'otro',          nombre: 'Otro',                      gestionable: true }
];

const MOTIVOS_POR_ID = MOTIVOS_AUSENCIA.reduce((m, x) => { m[x.id] = x; return m; }, {});

const AVISOS = [
  { id: 'previo',    nombre: 'Avisó con anticipación' },
  { id: 'mismoDia',  nombre: 'Avisó el mismo día' },
  { id: 'tarde',     nombre: 'Avisó después de su horario' },
  { id: 'no',        nombre: 'No avisó' }
];

const AVISOS_POR_ID = AVISOS.reduce((m, x) => { m[x.id] = x; return m; }, {});

/* Motivos por los que se genera una hora extra. La lista es cerrada a
   propósito: si todo entra en "otro", el acumulado no explica nada. */
const MOTIVOS_HORAS = [
  { id: 'afluencia',    nombre: 'Afluencia de público' },
  { id: 'ausencia',     nombre: 'Cubrir una ausencia' },
  { id: 'promoBancaria',nombre: 'Promoción bancaria' },
  { id: 'inventario',   nombre: 'Inventario' }
];

const MOTIVOS_HORAS_POR_ID = MOTIVOS_HORAS.reduce((m, x) => { m[x.id] = x; return m; }, {});

/** El día anterior a una fecha ISO: las horas extras se piden al día siguiente. */
function diaAnterior(fecha) {
  const d = new Date(String(fecha || '') + 'T12:00:00');
  if (isNaN(d)) return fecha;
  d.setDate(d.getDate() - 1);
  return d.toISOString().slice(0, 10);
}

/* -------------------------- turnos por sucursal ----------------------- */

/**
 * Turnos por defecto de una sucursal, derivados de su horario de atención.
 * El cierre del turno noche sigue al cierre del local; las tiendas que solo
 * abren de 10 a 18 no tienen turnos de mañana ni de noche.
 * Es un punto de partida editable, no una definición.
 */
function turnosPorDefecto(sucursal) {
  const horario = String((sucursal && sucursal.horario) || '');
  const cierres = (horario.match(/(\d{1,2}):(\d{2})/g) || []);
  const ultimo = cierres.length ? cierres[cierres.length - 1] : '';
  const soloTarde = /10:00 a 18:00/.test(horario) && !/08:00/.test(horario);

  const cierreNoche = /24:00/.test(horario) ? '24:00'
    : /23:00/.test(horario) ? '23:00'
    : /22:00/.test(horario) ? '22:00'
    : /21:00/.test(horario) ? '21:00'
    : (ultimo || '23:00');

  if (soloTarde) {
    return {
      manana:     { activo: false, desde: '08:00', hasta: '16:00', dotacion: '' },
      intermedio: { activo: true,  desde: '10:00', hasta: '18:00', dotacion: '' },
      noche:      { activo: false, desde: '16:00', hasta: cierreNoche, dotacion: '' }
    };
  }
  return {
    manana:     { activo: true, desde: '08:00', hasta: '16:00', dotacion: '' },
    intermedio: { activo: true, desde: '10:00', hasta: '19:00', dotacion: '' },
    noche:      { activo: true, desde: '16:00', hasta: cierreNoche, dotacion: '' }
  };
}

/** Primer turno activo de la sucursal: el que se propone al cargar una ausencia. */
function turnoSugerido(sucursal) {
  const t = (sucursal && sucursal.turnos) || {};
  const hallado = TURNOS.find(x => !t[x.id] || t[x.id].activo !== false);
  return (hallado || TURNOS[0]).id;
}

/** Dotación esperada del día: la suma de los turnos activos. */
function dotacionDelDia(sucursal) {
  const t = (sucursal && sucursal.turnos) || {};
  return TURNOS.reduce((s, x) => {
    const cfg = t[x.id];
    return s + (cfg && cfg.activo !== false ? num(cfg.dotacion) : 0);
  }, 0);
}

/* ---------------------------- cálculo del parte ------------------------ */

/**
 * Presentismo de un parte diario.
 * @param {object} parte     { ausencias: [...] }
 * @param {object} sucursal  con sus turnos y dotaciones
 */
function calcularParte(parte, sucursal) {
  const ausencias = (parte && parte.ausencias) || [];
  const turnos = (sucursal && sucursal.turnos) || {};

  const porTurno = TURNOS.map(t => {
    const cfg = turnos[t.id] || {};
    const activo = cfg.activo !== false;
    const dotacion = activo ? num(cfg.dotacion) : 0;
    const ausentes = ausencias.filter(a => a.turno === t.id).length;
    return {
      id: t.id, nombre: t.nombre, activo, dotacion, ausentes,
      presentes: Math.max(0, dotacion - ausentes),
      presentismo: dotacion > 0 ? Math.max(0, dotacion - ausentes) / dotacion : null,
      horario: `${cfg.desde || t.desde} a ${cfg.hasta || t.hasta}`
    };
  });

  const extras = (parte && parte.horasExtras) || [];
  const horas = extras.reduce((s, h) => s + num(h.horas), 0);
  const horasPorMotivo = {};
  extras.forEach(h => { horasPorMotivo[h.motivo] = (horasPorMotivo[h.motivo] || 0) + num(h.horas); });

  const dotacion = porTurno.reduce((s, t) => s + t.dotacion, 0);
  const ausentes = ausencias.length;
  const sinAviso = ausencias.filter(a => a.aviso === 'no').length;
  const gestionables = ausencias.filter(a => (MOTIVOS_POR_ID[a.motivo] || {}).gestionable).length;

  return {
    porTurno, dotacion, ausentes,
    presentes: Math.max(0, dotacion - ausentes),
    presentismo: dotacion > 0 ? Math.max(0, dotacion - ausentes) / dotacion : null,
    sinAviso, gestionables,
    ausencias,
    horas, horasPorMotivo, personasConHoras: extras.length
  };
}

/** Consolidado de un día para toda el área. */
function consolidarDia(partes, sucursales, fecha) {
  const delDia = (partes || []).filter(p => p.fecha === fecha);
  const filas = (sucursales || []).map(s => {
    const parte = delDia.find(p => p.sucursalId === s.id) || null;
    const c = calcularParte(parte, s);
    return { sucursal: s, parte, calc: c, reportado: !!parte };
  });

  const suma = k => filas.reduce((a, f) => a + num(f.calc[k]), 0);
  const dotacion = suma('dotacion');
  const ausentes = suma('ausentes');

  return {
    fecha, filas,
    dotacion, ausentes,
    presentes: Math.max(0, dotacion - ausentes),
    presentismo: dotacion > 0 ? Math.max(0, dotacion - ausentes) / dotacion : null,
    sinAviso: suma('sinAviso'),
    gestionables: suma('gestionables'),
    horas: suma('horas'),
    reportaron: filas.filter(f => f.reportado).length,
    faltanReportar: filas.filter(f => !f.reportado).map(f => f.sucursal)
  };
}

/**
 * Acumulado de un mes por sucursal: es lo que alimenta el ausentismo mensual
 * de la visita, contando días-persona de ausencia.
 */
function acumuladoMes(partes, sucursalId, periodo) {
  const propios = (partes || []).filter(p =>
    p.sucursalId === sucursalId && String(p.fecha || '').slice(0, 7) === periodo);

  const dias = {};
  let total = 0, sinAviso = 0, gestionables = 0;
  const porMotivo = {};

  let horas = 0;
  const horasPorMotivo = {};
  const horasPorPersona = {};
  const diasConHoras = {};

  propios.forEach(p => {
    dias[p.fecha] = true;
    (p.ausencias || []).forEach(a => {
      total++;
      if (a.aviso === 'no') sinAviso++;
      if ((MOTIVOS_POR_ID[a.motivo] || {}).gestionable) gestionables++;
      porMotivo[a.motivo] = (porMotivo[a.motivo] || 0) + 1;
    });
    (p.horasExtras || []).forEach(h => {
      const q = num(h.horas);
      if (!q) return;
      horas += q;
      diasConHoras[p.fecha] = true;
      horasPorMotivo[h.motivo] = (horasPorMotivo[h.motivo] || 0) + q;
      const k = String(h.colaborador || 'Sin identificar').trim() || 'Sin identificar';
      horasPorPersona[k] = (horasPorPersona[k] || 0) + q;
    });
  });

  return {
    periodo, partes: propios.length, diasConParte: Object.keys(dias).length,
    diasAusencia: total, sinAviso, gestionables, porMotivo,
    horas, horasPorMotivo, horasPorPersona,
    diasConHoras: Object.keys(diasConHoras).length
  };
}

/**
 * Horas extras del mes para toda el área: por sucursal y consolidado.
 * Sirve para anticipar el mes en curso en lugar de enterarse con la
 * liquidación, que es de lo que se trata pedirlas todos los días.
 */
function acumuladoHorasArea(partes, sucursales, periodo) {
  const filas = (sucursales || []).map(s => {
    const a = acumuladoMes(partes, s.id, periodo);
    return {
      sucursal: s,
      horas: a.horas,
      porMotivo: a.horasPorMotivo,
      porPersona: a.horasPorPersona,
      personas: Object.keys(a.horasPorPersona).length,
      diasConHoras: a.diasConHoras,
      diasConParte: a.diasConParte
    };
  });

  const total = filas.reduce((s, f) => s + f.horas, 0);
  const porMotivo = {};
  filas.forEach(f => {
    MOTIVOS_HORAS.forEach(m => {
      if (f.porMotivo[m.id]) porMotivo[m.id] = (porMotivo[m.id] || 0) + f.porMotivo[m.id];
    });
  });

  /* Proyección simple del cierre de mes: el ritmo diario observado llevado
     a los días del mes. Es una anticipación, no un pronóstico. */
  const diasDelMes = (() => {
    const [a, m] = String(periodo || '').split('-').map(Number);
    return (a && m) ? new Date(a, m, 0).getDate() : 30;
  })();
  const diasCubiertos = Math.max.apply(null, [0].concat(filas.map(f => f.diasConParte)));
  /* Con menos de una semana cargada la extrapolación dice más de la muestra
     que del mes, así que directamente no se muestra. */
  const proyectable = diasCubiertos >= 5;
  const proyeccion = proyectable ? (total / diasCubiertos) * diasDelMes : null;

  return {
    periodo, filas, total, porMotivo,
    personas: filas.reduce((s, f) => s + f.personas, 0),
    diasCubiertos, diasDelMes, proyectable, proyeccion
  };
}

/** Mensaje para el grupo de WhatsApp, con el link del formulario. */
function mensajeWhatsApp(config, fecha) {
  const f = (() => {
    if (!fecha) return '';
    const [a, m, d] = fecha.split('-');
    return `${d}/${m}/${a}`;
  })();
  const ayer = (() => {
    const x = diaAnterior(fecha);
    if (!x) return '';
    const [a2, m2, d2] = x.split('-');
    return `(${d2}/${m2})`;
  })();
  const link = String((config && config.linkParteDiario) || '').trim();
  return [
    `Buen día. Parte diario de asistencia — ${f}`,
    '',
    'Por favor completen el formulario antes de las 10:00, aunque no tengan novedades:',
    link || '[falta cargar el link del formulario en Configuración]',
    '',
    'Si hubo una ausencia, poner el nombre del colaborador, el turno, el motivo y si avisó o no.',
    'Si el equipo está completo, marcar "sin novedad".',
    '',
    `Y las horas extras de ayer ${ayer}: quién las hizo, cuántas y por qué`,
    '(afluencia de público, cubrir una ausencia, promoción bancaria o inventario).',
    '',
    (config && config.coordinador) || ''
  ].filter(x => x !== null).join('\n');
}

/*
 * acceso.js — Portada y clave de acceso.
 *
 * La clave no es una cortina: deriva una llave con PBKDF2 y cifra el contenido
 * del tablero con AES-GCM antes de guardarlo. Sin la clave, lo que queda en el
 * navegador es ilegible.
 *
 * La contracara es que no hay recuperación posible. Si se pierde la clave, se
 * pierden los datos: por eso el tablero insiste con los respaldos.
 */

const CLAVE_SEGURIDAD = 'farmatodo.rrhh.seguridad.v1';
const ITERACIONES = 250000;
const TESTIGO = 'panel-rrhh-ok';

const Acceso = (() => {
  const b64 = buf => btoa(String.fromCharCode(...new Uint8Array(buf)));
  const debuf = s => Uint8Array.from(atob(s), c => c.charCodeAt(0));
  const texto = new TextEncoder();
  const desTexto = new TextDecoder();

  function disponible() {
    return typeof crypto !== 'undefined' && crypto.subtle && typeof crypto.subtle.deriveKey === 'function';
  }

  async function derivar(clave, salt) {
    const base = await crypto.subtle.importKey('raw', texto.encode(clave), 'PBKDF2', false, ['deriveKey']);
    return crypto.subtle.deriveKey(
      { name: 'PBKDF2', salt, iterations: ITERACIONES, hash: 'SHA-256' },
      base, { name: 'AES-GCM', length: 256 }, false, ['encrypt', 'decrypt']);
  }

  /** Envuelve la llave en las dos operaciones que necesita el almacén. */
  function cifradorCon(llave) {
    return {
      async cifrar(txt) {
        const iv = crypto.getRandomValues(new Uint8Array(12));
        const ct = await crypto.subtle.encrypt({ name: 'AES-GCM', iv }, llave, texto.encode(txt));
        return JSON.stringify({ v: 1, iv: b64(iv), d: b64(ct) });
      },
      async descifrar(txt) {
        const p = JSON.parse(txt);
        if (!p || p.v !== 1) throw new Error('formato desconocido');
        const pt = await crypto.subtle.decrypt(
          { name: 'AES-GCM', iv: debuf(p.iv) }, llave, debuf(p.d));
        return desTexto.decode(pt);
      }
    };
  }

  const leerSeguridad = () => {
    try { return JSON.parse(localStorage.getItem(CLAVE_SEGURIDAD) || 'null'); }
    catch (e) { return null; }
  };

  async function crearClave(clave) {
    const salt = crypto.getRandomValues(new Uint8Array(16));
    const llave = await derivar(clave, salt);
    const cif = cifradorCon(llave);
    localStorage.setItem(CLAVE_SEGURIDAD, JSON.stringify({
      v: 1, salt: b64(salt), iteraciones: ITERACIONES, testigo: await cif.cifrar(TESTIGO)
    }));
    return cif;
  }

  async function abrirCon(clave) {
    const seg = leerSeguridad();
    if (!seg) return null;
    const llave = await derivar(clave, debuf(seg.salt));
    const cif = cifradorCon(llave);
    try {
      if (await cif.descifrar(seg.testigo) !== TESTIGO) return null;
    } catch (e) { return null; }   // clave incorrecta: el descifrado falla
    return cif;
  }

  /* ------------------------------ pantalla ------------------------------ */

  const marca = `<svg class="marca" viewBox="0 0 64 64" aria-hidden="true">
      <rect x="4" y="4" width="56" height="56" rx="14" fill="none" stroke="currentColor" stroke-width="3.5"/>
      <path d="M32 19v26M19 32h26" stroke="currentColor" stroke-width="7" stroke-linecap="round"/>
    </svg>`;

  function pantalla(modo, cfg) {
    const primeraVez = modo === 'crear';
    const bienvenida = modo === 'bienvenida';
    return `<div class="portada">
      <section class="portada-marca">
        <div class="pm-cima">
          ${marca}
          <p class="pm-eyebrow">Farmatodo · Recursos Humanos</p>
          <h1>Panel de Control de RRHH</h1>
          <p class="pm-bajada">Visitas a sucursales, FTE real, costo laboral y desarrollo del equipo${cfg && cfg.area ? ` · ${cfg.area}` : ''}.</p>
        </div>
        <p class="pm-pie">Herramienta interna de trabajo. Los datos se guardan solo en esta computadora.</p>
      </section>

      <section class="portada-acceso">
        <div class="pa-caja">
          <p class="pa-hola">Bienvenido</p>
          <h2>${bienvenida ? 'Panel listo para trabajar' : (primeraVez ? 'Creá tu clave de acceso' : 'Ingresá tu clave')}</h2>
          <p class="pa-texto">${bienvenida
            ? 'Estás trabajando sin clave: el contenido se guarda sin cifrar en esta computadora.'
            : (primeraVez
              ? 'La clave cifra el contenido del panel en esta computadora. Elegí una que puedas recordar: no hay forma de recuperarla.'
              : 'Escribí la clave con la que protegiste el panel.')}</p>

          ${bienvenida ? `
            <button class="b pa-boton" data-entrar type="button">Entrar al panel</button>
            <button class="pa-link" data-poner-clave>Proteger con una clave</button>
          ` : ''}

          <form id="form-acceso" autocomplete="off" novalidate${bienvenida ? ' hidden' : ''}>
            <label class="campo"><span>Clave</span>
              <input type="password" id="clave1" autocomplete="current-password"
                     placeholder="${primeraVez ? 'Al menos 6 caracteres' : ''}"></label>
            ${primeraVez ? `<label class="campo"><span>Repetí la clave</span>
              <input type="password" id="clave2" autocomplete="new-password"></label>` : ''}
            <p class="pa-error" id="acceso-error" hidden></p>
            <button class="b pa-boton" type="submit">${primeraVez ? 'Crear clave y entrar' : 'Entrar'}</button>
          </form>

          ${bienvenida ? '' : primeraVez
            ? `<p class="pa-nota"><strong>Guardá la clave donde puedas recuperarla.</strong> El panel no puede restablecerla:
                 si se pierde, se pierden los datos. Exportá un respaldo cada tanto desde Configuración.</p>
               <button class="pa-link" data-sin-clave>Prefiero entrar sin clave</button>`
            : `<button class="pa-link" data-olvide>Olvidé la clave</button>`}
        </div>
      </section>
    </div>`;
  }

  function montar(html) {
    let cont = document.getElementById('acceso');
    if (!cont) {
      cont = document.createElement('div');
      cont.id = 'acceso';
      document.body.appendChild(cont);
    }
    cont.innerHTML = html;
    return cont;
  }

  function mostrarError(msg) {
    const e = document.getElementById('acceso-error');
    if (!e) return;
    e.textContent = msg;
    e.hidden = false;
  }

  function limpiarError() {
    const e = document.getElementById('acceso-error');
    if (e) { e.textContent = ''; e.hidden = true; }
  }

  /**
   * Muestra la portada y resuelve con el cifrador cuando el usuario entra.
   * Resuelve con null cuando decide trabajar sin clave.
   */
  function pedirAcceso(cfg) {
    return new Promise(resolve => {
      const seg = leerSeguridad();

      if (!disponible()) {
        // Sin WebCrypto no se puede cifrar; se avisa en lugar de fingir que sí.
        montar(pantalla('crear', cfg));
        mostrarError('Este navegador no permite cifrar los datos. El panel va a funcionar sin clave.');
        document.getElementById('form-acceso').addEventListener('submit', ev => ev.preventDefault());
      } else {
        montar(pantalla(seg ? (seg.sinClave ? 'bienvenida' : 'abrir') : 'crear', cfg));
      }

      const cont = document.getElementById('acceso');
      const terminar = cif => { cont.remove(); document.body.classList.remove('bloqueado'); resolve(cif); };
      document.body.classList.add('bloqueado');

      cont.addEventListener('click', async ev => {
        if (ev.target.closest('[data-entrar]')) terminar(null);

        if (ev.target.closest('[data-poner-clave]')) {
          // Pasa a crear clave; el contenido en claro se cifra al abrir
          localStorage.removeItem(CLAVE_SEGURIDAD);
          montar(pantalla('crear', cfg));
          conectarFormulario(null, cont, terminar, cfg);
          return;
        }

        if (ev.target.closest('[data-sin-clave]')) {
          localStorage.setItem(CLAVE_SEGURIDAD, JSON.stringify({ v: 1, sinClave: true }));
          terminar(null);
        }
        if (ev.target.closest('[data-olvide]')) {
          const ok = confirmarEnPortada();
          ok.then(borrar => {
            if (!borrar) return;
            localStorage.removeItem(CLAVE_SEGURIDAD);
            localStorage.removeItem(CLAVE_ALMACEN);
            location.reload();
          });
        }
      });

      conectarFormulario(seg, cont, terminar, cfg);
    });
  }

  function conectarFormulario(seg, cont, terminar, cfg) {
      const form = document.getElementById('form-acceso');
      if (!form) return;
      form.addEventListener('submit', async ev => {
        ev.preventDefault();
        const c1 = document.getElementById('clave1').value;
        const c2 = document.getElementById('clave2');
        const boton = form.querySelector('button[type="submit"]');
        boton.disabled = true;

        try {
          if (!seg || !seg.salt) {
            if (!c1) { mostrarError('Escribí una clave para proteger el panel.'); return; }
            if (c1.length < 6) { mostrarError('Usá al menos 6 caracteres.'); return; }
            if (c2 && c1 !== c2.value) { mostrarError('Las dos claves no coinciden.'); return; }
            terminar(await crearClave(c1));
          } else {
            if (!c1) { mostrarError('Escribí tu clave.'); return; }
            const cif = await abrirCon(c1);
            if (!cif) { mostrarError('Clave incorrecta.'); return; }
            terminar(cif);
          }
        } finally {
          boton.disabled = false;
        }
      });

      form.addEventListener('input', limpiarError);

      const primero = document.getElementById('clave1');
      if (primero) primero.focus();
  }

  /* Confirmación propia, porque el visor bloquea confirm() del navegador. */
  function confirmarEnPortada() {
    return new Promise(resolve => {
      const velo = document.createElement('div');
      velo.className = 'velo';
      velo.innerHTML = `<div class="dialogo">
        <h3>Empezar de cero</h3>
        <p>Sin la clave no hay forma de leer lo guardado. La única salida es borrar el contenido
           y volver a empezar, con una clave nueva. Si tenés un respaldo exportado, vas a poder importarlo después.</p>
        <div class="acciones">
          <button class="b sec" data-r="0">Cancelar</button>
          <button class="b peligro" data-r="1">Borrar y empezar de nuevo</button>
        </div>
      </div>`;
      velo.addEventListener('click', ev => {
        const btn = ev.target.closest('[data-r]');
        if (btn) { velo.remove(); resolve(btn.dataset.r === '1'); }
        else if (ev.target === velo) { velo.remove(); resolve(false); }
      });
      document.body.appendChild(velo);
    });
  }

  /** ¿Ya eligió trabajar sin clave? */
  const sinClave = () => { const s = leerSeguridad(); return !!(s && s.sinClave); };

  return { pedirAcceso, sinClave, disponible };
})();

/*
 * store.js — Estado de la aplicación y persistencia.
 *
 * Todo vive en el navegador (localStorage). No hay servidor: los datos de
 * personal no salen del equipo salvo que se exporten o se envíe un reporte.
 * Para trabajar en varios equipos, usar Exportar / Importar respaldo.
 */

const CLAVE_ALMACEN = 'farmatodo.rrhh.operativo.v1';

/**
 * Entrega un archivo al usuario.
 *
 * Abierto como archivo local o publicado en un servidor propio, alcanza con un
 * enlace de descarga. Dentro de una página publicada en claude.ai el visor no
 * permite descargas directas, así que hay que pedirlas por la capacidad
 * `downloads`, que muestra una confirmación antes de guardar.
 *
 * @returns {Promise<boolean>} true si el archivo se entregó.
 */
async function guardarArchivo(nombre, contenido, mime) {
  if (typeof window !== 'undefined' && window.claude && typeof window.claude.use === 'function') {
    let descargas = null;
    try { descargas = await window.claude.use('downloads'); } catch (err) { descargas = null; }
    if (descargas) {
      try {
        await descargas.save({ filename: nombre, data: contenido });
        return true;
      } catch (err) {
        if (err && err.code === 'declined') return false;          // el usuario canceló
        if (err && (err.code === 'unavailable' || err.code === 'not_granted' ||
                    err.code === 'capability_disabled' || err.code === 'capability_removed')) {
          // sin capacidad de descarga: se intenta el enlace común más abajo
        } else {
          alert('No se pudo guardar el archivo: ' + ((err && err.message) || 'error desconocido'));
          return false;
        }
      }
    }
  }

  const blob = new Blob([contenido], { type: (mime || 'text/plain') + ';charset=utf-8' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = nombre;
  document.body.appendChild(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(url), 1000);
  return true;
}

const Store = (() => {
  let estado = null;
  let cifrador = null;          // null = guardar en claro
  let colaDeGuardado = Promise.resolve();
  const suscriptores = [];

  const uid = () => Math.random().toString(36).slice(2, 10) + Date.now().toString(36).slice(-4);

  /* Ficha de sucursal con todos sus campos, para que el padrón y las altas
     manuales produzcan el mismo objeto. */
  function sucursalNueva(datos) {
    return Object.assign({
      id: uid(),
      codigo: '', rvd: '', nombre: '', tipo: 'venta',
      marca: MARCA_AREA, operador: '', supervisor: '',
      razonSocial: '', cuit: '', direccion: '', localidad: '', horario: '', art: '',
      gerenteOperaciones: '',
      gerente: '', emailGerente: '',      // el gerente recibe copia del reporte

      contactoAdmin: '', emailContactoAdmin: '', referenteRRHH: '',
      colaboradores: [],                  // plantel con su evaluación e historial
      turnos: null,                       // dotación esperada por turno
      dotacionNominal: null, notas: ''
    }, datos || {});
  }

  function estadoInicial() {
    const sucursales = SUCURSALES_AREA3.map(x => {
      const s = sucursalNueva(x);
      s.turnos = turnosPorDefecto(s);
      return s;
    });
    return {
      version: 1,

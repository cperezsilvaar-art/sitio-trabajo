<title>Panel de Control de RRHH</title>
<style>
/* Panel de Control de RRHH — Farmatodo
   Paleta construida sobre el azul marino de la marca. Los neutros llevan sesgo
   azul: un gris puro al lado de este marino se ve sucio.
   Sin fuentes web a propósito: el panel tiene que abrir desde el disco y sin
   internet, y una tipografía remota fallaría en silencio. */

:root {
  color-scheme: light;
  --azul:        #0b3b72;   /* marino de marca */
  --azul-claro:  #1e6fc4;   /* acento interactivo */
  --marino-hondo:#072c57;
  --rojo:        #c8102e;
  --barra:       #0b3b72;
  --fondo:       #f5f7fa;
  --panel:       #ffffff;
  --panel-alt:   #f7f9fc;
  --borde:       #dce3ec;
  --borde-fuerte:#bfcbda;
  --texto:       #10233b;
  --texto-suave: #55657c;
  --verde:       #1a7f4b;
  --ambar:       #b7791f;
  --rojo-alerta: #c0392b;
  --sombra:      0 1px 2px rgba(16, 32, 54, .06), 0 4px 14px rgba(16, 32, 54, .06);
  --radio:       10px;
}

/* Tema oscuro. Se aplica por preferencia del sistema, salvo que el entorno
   marque una elección explícita de tema claro, y también cuando esa elección
   explícita es oscura. */
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
  color-scheme: dark;
  --azul:        #7fb2e6;
  --azul-claro:  #9cc7f2;
  --marino-hondo:#050f1d;
  --rojo:        #ff6b7a;
  --barra:       #0a1424;
  --fondo:       #0d1626;
  --panel:       #152034;
  --panel-alt:   #1b283f;
  --borde:       #27354e;
  --borde-fuerte:#3a4a68;
  --texto:       #e7edf6;
  --texto-suave: #9aabc2;
  --verde:       #4cc38a;
  --ambar:       #e0a94a;
  --rojo-alerta: #ff7a6b;
  --sombra:      0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
  }
}

:root[data-theme="dark"] {
  color-scheme: dark;
  --azul:        #7fb2e6;
  --azul-claro:  #9cc7f2;
  --marino-hondo:#050f1d;
  --rojo:        #ff6b7a;
  --barra:       #0a1424;
  --fondo:       #0d1626;
  --panel:       #152034;
  --panel-alt:   #1b283f;
  --borde:       #27354e;
  --borde-fuerte:#3a4a68;
  --texto:       #e7edf6;
  --texto-suave: #9aabc2;
  --verde:       #4cc38a;
  --ambar:       #e0a94a;
  --rojo-alerta: #ff7a6b;
  --sombra:      0 1px 2px rgba(0,0,0,.3), 0 4px 14px rgba(0,0,0,.25);
}

* { box-sizing: border-box; }

body {
  margin: 0;
  background: var(--fondo);
  color: var(--texto);
  font: 15px/1.5 "Segoe UI", system-ui, -apple-system, "Helvetica Neue", Arial, sans-serif;
}

/* ------------------------------- Header ------------------------------- */
header.app {
  background: var(--barra);
  color: #fff;
  padding: 14px 22px;
  display: flex; align-items: center; gap: 18px; flex-wrap: wrap;
  box-shadow: var(--sombra);
  position: sticky; top: 0; z-index: 20;
}
header.app .marca { display: flex; align-items: baseline; gap: 10px; }
header.app .marca strong { font-size: 18px; letter-spacing: .2px; }
header.app .marca span { font-size: 12px; opacity: .8; text-transform: uppercase; letter-spacing: 1px; }
header.app .crece { flex: 1; }
header.app button, header.app select {
  background: rgba(255,255,255,.12); color: #fff; border: 1px solid rgba(255,255,255,.25);
  padding: 7px 12px; border-radius: 8px; font-size: 13px; cursor: pointer;
}
header.app button:hover { background: rgba(255,255,255,.22); }
header.app select { width: auto; max-width: 260px; }
header.app select option { color: #16202e; }

/* -------------------------------- Nav --------------------------------- */
nav.tabs {
  display: flex; gap: 2px; overflow-x: auto; background: var(--panel);
  border-bottom: 1px solid var(--borde); padding: 0 14px;
}
nav.tabs a {
  padding: 12px 15px; font-size: 14px; color: var(--texto-suave); text-decoration: none;
  border-bottom: 3px solid transparent; white-space: nowrap;
}
nav.tabs a:hover { color: var(--texto); }
nav.tabs a.activo { color: var(--azul); border-bottom-color: var(--rojo); font-weight: 600; }

main { padding: 22px; max-width: 1280px; margin: 0 auto; }

/* ------------------------------ Bloques -------------------------------- */
section.tarjeta {
  background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio);
  padding: 18px 20px; margin-bottom: 18px; box-shadow: var(--sombra);
}
section.tarjeta > h2 {
  margin: 0 0 4px; font-size: 16px; color: var(--azul); letter-spacing: .2px;
}
section.tarjeta > p.ayuda { margin: 0 0 16px; color: var(--texto-suave); font-size: 13px; }

h1.titulo { font-size: 22px; margin: 0 0 4px; }
p.subtitulo { color: var(--texto-suave); margin: 0 0 18px; font-size: 14px; }

/* ------------------------------- KPIs ---------------------------------- */
.kpis { display: grid; grid-template-columns: repeat(auto-fit, minmax(190px, 1fr)); gap: 12px; margin-bottom: 18px; }
.kpi {
  background: var(--panel); border: 1px solid var(--borde); border-left: 4px solid var(--azul-claro);
  border-radius: var(--radio); padding: 14px 16px; box-shadow: var(--sombra);
}
.kpi .etiqueta { font-size: 11px; text-transform: uppercase; letter-spacing: .8px; color: var(--texto-suave); }
.kpi .valor { font-size: 24px; font-weight: 600; margin-top: 4px; font-variant-numeric: tabular-nums; }
.kpi .nota { font-size: 12px; color: var(--texto-suave); margin-top: 2px; }
.kpi.alerta { border-left-color: var(--rojo-alerta); }
.kpi.ok { border-left-color: var(--verde); }
.kpi.aviso { border-left-color: var(--ambar); }

/* ------------------------------ Tablas --------------------------------- */
.tabla-scroll { overflow-x: auto; }
table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
th, td { padding: 8px 10px; text-align: left; border-bottom: 1px solid var(--borde); }
th {
  background: var(--panel-alt); font-size: 11px; text-transform: uppercase;
  letter-spacing: .6px; color: var(--texto-suave); font-weight: 600; white-space: nowrap;
}
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; white-space: nowrap; }
td.tipo { white-space: nowrap; }
tr.total td { font-weight: 700; background: var(--panel-alt); border-top: 2px solid var(--borde-fuerte); }
tbody tr:hover { background: var(--panel-alt); }
tfoot td { font-weight: 700; background: var(--panel-alt); border-top: 2px solid var(--borde-fuerte); }

/* ----------------------------- Formularios ----------------------------- */
.grid { display: grid; gap: 14px; }
.grid.c2 { grid-template-columns: repeat(auto-fit, minmax(260px, 1fr)); }
.grid.c3 { grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); }
.grid.c4 { grid-template-columns: repeat(auto-fit, minmax(160px, 1fr)); }

label.campo { display: block; font-size: 12px; color: var(--texto-suave); font-weight: 600; }
label.campo > span { display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px; }

input, select, textarea {
  width: 100%; padding: 8px 10px; border: 1px solid var(--borde-fuerte); border-radius: 8px;
  background: var(--panel); color: var(--texto); font: inherit; font-size: 14px; font-weight: 400;
}
input:focus, select:focus, textarea:focus { outline: 2px solid var(--azul-claro); outline-offset: -1px; }
textarea { min-height: 96px; resize: vertical; line-height: 1.5; }
table input, table select { padding: 6px 8px; font-size: 13px; }
input.num { text-align: right; font-variant-numeric: tabular-nums; }

button.b {
  background: var(--azul); color: #fff; border: 0; padding: 9px 16px; border-radius: 8px;
  font-size: 14px; font-weight: 600; cursor: pointer;
}
button.b:hover { background: var(--azul-claro); }
button.b.grande { padding: 13px 26px; font-size: 15.5px; }
button.b.sec { background: transparent; color: var(--azul); border: 1px solid var(--borde-fuerte); }
button.b.sec:hover { background: var(--panel-alt); }
button.b.peligro { background: transparent; color: var(--rojo-alerta); border: 1px solid var(--rojo-alerta); }
button.b.peligro:hover { background: rgba(192,57,43,.08); }
button.mini {
  background: transparent; border: 1px solid var(--borde-fuerte); color: var(--texto-suave);
  border-radius: 6px; padding: 3px 8px; font-size: 12px; cursor: pointer;
}
button.mini:hover { color: var(--rojo-alerta); border-color: var(--rojo-alerta); }
.acciones { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; margin-top: 16px; }

/* ------------------------------ Etiquetas ------------------------------ */
.chip {
  display: inline-block; white-space: nowrap; padding: 2px 9px; border-radius: 999px; font-size: 11.5px;
  font-weight: 600; border: 1px solid var(--borde-fuerte); color: var(--texto-suave);
}
.chip.verde { color: var(--verde); border-color: var(--verde); }
.chip.ambar { color: var(--ambar); border-color: var(--ambar); }
.chip.rojo  { color: var(--rojo-alerta); border-color: var(--rojo-alerta); }
.chip.azul  { color: var(--azul); border-color: var(--azul); }

.aviso-caja {
  border-left: 3px solid var(--ambar); background: var(--panel-alt);
  padding: 10px 14px; border-radius: 6px; font-size: 13px; margin: 12px 0;
}
.aviso-caja.info { border-left-color: var(--azul-claro); }
.aviso-caja ul { margin: 6px 0 0; padding-left: 18px; }

pre.reporte {
  background: var(--panel-alt); border: 1px solid var(--borde); border-radius: 8px;
  padding: 16px; overflow-x: auto; font-size: 12.5px; line-height: 1.45;
  font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; white-space: pre;
}

/* ------------------------ Heat map de sucesión ------------------------- */
.heat { display: grid; grid-template-columns: 150px repeat(3, 1fr); gap: 4px; margin-top: 12px; font-size: 12.5px; }
.heat .eje { display: flex; align-items: center; justify-content: flex-end; padding-right: 8px; color: var(--texto-suave); font-weight: 600; text-align: right; }
.heat .cab { text-align: center; color: var(--texto-suave); font-weight: 600; padding: 6px 4px; }
.heat .celda { min-height: 74px; border-radius: 8px; padding: 8px; border: 1px solid var(--borde); }
.heat .celda.n1 { background: rgba(26,127,75,.10); }
.heat .celda.n2 { background: rgba(183,121,31,.12); }
.heat .celda.n3 { background: rgba(192,57,43,.12); }
.heat .celda div { font-size: 12px; margin-bottom: 3px; }

.vacio { color: var(--texto-suave); font-style: italic; padding: 14px 0; font-size: 13.5px; }

/* --------------- Medidor de costo laboral sobre la venta ---------------- *
   Un valor contra dos umbrales: no es un gráfico, es un indicador de estado.
   El color nunca va solo; siempre lo acompañan el ícono y el texto. */
.medidor { margin: 18px 0 6px; }
.medidor .pista {
  position: relative; height: 26px; border-radius: 6px; overflow: hidden;
  display: flex; border: 1px solid var(--borde);
}
.medidor .zona { height: 100%; }
.medidor .zona.z1 { background: rgba(26,127,75,.20); }
.medidor .zona.z2 { background: rgba(183,121,31,.22); }
.medidor .zona.z3 { background: rgba(192,57,43,.20); }
.medidor .marca {
  position: absolute; top: -3px; bottom: -3px; width: 3px; border-radius: 2px;
  background: var(--texto); box-shadow: 0 0 0 2px var(--panel);
}
.medidor .umbral {
  position: absolute; top: 0; bottom: 0; width: 1px;
  background: var(--texto-suave); opacity: .55;
}
.medidor .escala { position: relative; height: 34px; margin-top: 5px; font-variant-numeric: tabular-nums; }
.medidor .escala span {
  position: absolute; transform: translateX(-50%); text-align: center;
  font-size: 11px; color: var(--texto-suave); line-height: 1.35; white-space: nowrap;
}
.medidor .escala span b { display: block; color: var(--texto); font-size: 12px; }
.medidor .valor {
  display: flex; align-items: baseline; gap: 10px; flex-wrap: wrap; margin-bottom: 10px;
}
.medidor .valor strong { font-size: 26px; font-variant-numeric: tabular-nums; }
.medidor .valor em { font-style: normal; font-size: 13px; color: var(--texto-suave); }

/* ----------------------------- Matriz 9-box ---------------------------- */
/* Cinco columnas: eje vertical, etiquetas de fila y los tres cuadrantes.
   Cada elemento fuera de la grilla de cuadrantes lleva su columna explícita,
   porque el autoposicionamiento corría todo una columna. */
.ninebox {
  display: grid; grid-template-columns: 26px 132px repeat(3, 1fr); gap: 6px;
  margin-top: 14px; align-items: stretch;
}
.ninebox .esquina { grid-column: 1 / span 2; grid-row: 1; }
.ninebox .eje-y {
  grid-column: 1; grid-row: 2 / span 3;
  writing-mode: vertical-rl; transform: rotate(180deg);
  display: flex; align-items: center; justify-content: center;
  font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--texto-suave); font-weight: 600;
}
.ninebox .rot-cab, .ninebox .eje-x {
  text-align: center; font-size: 11px; letter-spacing: 1.2px; text-transform: uppercase;
  color: var(--texto-suave); font-weight: 600; padding: 4px 0;
}
.ninebox .eje-x { grid-column: 3 / span 3; }
.ninebox .eje-lbl {
  grid-column: 2;
  display: flex; align-items: center; justify-content: flex-end; padding-right: 10px;
  font-size: 12.5px; color: var(--texto-suave); font-weight: 600; text-align: right;
}
.ninebox .caja {
  min-height: 112px; border: 1px solid var(--borde); border-radius: 8px; padding: 8px;
  display: flex; flex-direction: column; gap: 6px; transition: outline-color .12s;
  outline: 2px solid transparent; outline-offset: -2px;
}
.ninebox .caja.encima { outline-color: var(--azul-claro); background: var(--panel-alt); }
.ninebox .caja-cab {
  font-size: 11.5px; font-weight: 700; color: var(--texto); display: flex;
  justify-content: space-between; gap: 6px; letter-spacing: .2px;
}
.ninebox .caja-cab span { color: var(--texto-suave); font-weight: 600; }
.ninebox .caja-gente { display: flex; flex-direction: column; gap: 4px; }

.caja.tono-verde    { background: rgba(26,127,75,.10);  border-color: rgba(26,127,75,.30); }
.caja.tono-azul     { background: rgba(28,95,158,.09);  border-color: rgba(28,95,158,.26); }
.caja.tono-amarillo { background: rgba(183,121,31,.12); border-color: rgba(183,121,31,.30); }
.caja.tono-rojo     { background: rgba(192,57,43,.11);  border-color: rgba(192,57,43,.30); }

.persona {
  background: var(--panel); border: 1px solid var(--borde-fuerte); border-radius: 6px;
  padding: 5px 8px; font-size: 12.5px; font-weight: 600; cursor: grab; line-height: 1.3;
  box-shadow: 0 1px 2px rgba(16,32,54,.07);
}
.persona span { display: block; font-size: 11px; font-weight: 400; color: var(--texto-suave); }
.persona:active { cursor: grabbing; }
.persona.arrastrando { opacity: .4; }

.alerta.tono-borde-verde    { border-left-color: var(--verde); }
.alerta.tono-borde-azul     { border-left-color: var(--azul-claro); }
.alerta.tono-borde-amarillo { border-left-color: var(--ambar); }
.alerta.tono-borde-rojo     { border-left-color: var(--rojo-alerta); }

/* ------------------------ Organigrama de sucursal ----------------------- *
   No es un árbol con líneas: con doce sucursales de diez a treinta personas,
   las líneas estorban más de lo que explican. Son bandas por nivel, de arriba
   hacia abajo, y cada persona es una tarjeta que abre su perfil. */
.organigrama { display: flex; flex-direction: column; gap: 16px; margin-top: 6px; }
.org-nivel {
  display: flex; flex-wrap: wrap; gap: 18px;
  padding-bottom: 16px; border-bottom: 1px dashed var(--borde);
}
.org-nivel:last-child { border-bottom: 0; padding-bottom: 0; }
.org-nivel.cima .org-persona { border-color: var(--azul); background: var(--panel-alt); }
.org-grupo { flex: 1 1 240px; min-width: 0; }
.org-grupo h4 {
  margin: 0 0 8px; font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--texto-suave); display: flex; align-items: center; gap: 8px;
}
.org-fila { display: flex; flex-wrap: wrap; gap: 8px; }
.org-persona {
  display: block; text-align: left; cursor: pointer; font: inherit;
  background: var(--panel); border: 1px solid var(--borde-fuerte); border-radius: 8px;
  padding: 8px 12px; min-width: 172px; box-shadow: 0 1px 2px rgba(16,32,54,.06);
}
.org-persona:hover { border-color: var(--azul-claro); }
.org-persona.abierta { border-color: var(--azul); outline: 2px solid var(--azul-claro); outline-offset: -2px; }
.org-persona strong { display: block; font-size: 13.5px; line-height: 1.3; color: var(--texto); }
.org-persona span { display: block; font-size: 11.5px; color: var(--texto-suave); margin-top: 2px; }

/* Dato de solo lectura, con la misma silueta que un campo editable. */
.campo-lectura { font-size: 12px; }
.campo-lectura > span {
  display: block; margin-bottom: 5px; text-transform: uppercase; letter-spacing: .5px;
  color: var(--texto-suave); font-weight: 600;
}
.campo-lectura > strong { font-size: 14px; font-weight: 500; color: var(--texto); word-break: break-word; }

/* ------------------------------ Talent card ---------------------------- */
tr.ficha-fila > td { background: var(--panel-alt); padding: 0; }
tr.inactivo { opacity: .55; }
.talent-card { padding: 18px 20px; }
.talent-card .tc-cab {
  display: flex; justify-content: space-between; align-items: center; gap: 12px;
  flex-wrap: wrap; padding-bottom: 12px; margin-bottom: 6px; border-bottom: 1px solid var(--borde);
}
.talent-card .tc-cab strong { font-size: 15px; }
.talent-card .tc-cab span { display: block; font-size: 12.5px; color: var(--texto-suave); }
.talent-card h4 {
  font-size: 11px; text-transform: uppercase; letter-spacing: 1px;
  color: var(--texto-suave); margin: 18px 0 8px;
}

@media (max-width: 720px) {
  .ninebox { grid-template-columns: 20px 84px repeat(3, 1fr); }
  .ninebox .eje-lbl { font-size: 11px; }
}

/* ------------------- Confirmación y avisos propios --------------------- *
   El visor de la página publicada bloquea confirm() y alert() del navegador,
   así que el tablero dibuja los suyos. */
.velo {
  position: fixed; inset: 0; background: rgba(16, 32, 54, .45);
  display: flex; align-items: center; justify-content: center; z-index: 300; padding: 20px;
}
.dialogo {
  background: var(--panel); border: 1px solid var(--borde); border-radius: var(--radio);
  box-shadow: 0 12px 40px rgba(16, 32, 54, .25); padding: 22px 24px;
  max-width: 440px; width: 100%;
}
.dialogo h3 { margin: 0 0 8px; font-size: 16px; color: var(--azul); }
.dialogo p { margin: 0 0 18px; font-size: 14px; line-height: 1.5; }
.dialogo .acciones { margin: 0; justify-content: flex-end; }

.avisos { position: fixed; right: 18px; bottom: 18px; z-index: 400; display: flex; flex-direction: column; gap: 8px; }
.aviso-flotante {
  background: var(--panel); border: 1px solid var(--borde); border-left: 4px solid var(--verde);
  border-radius: 8px; padding: 11px 16px; box-shadow: var(--sombra); font-size: 13.5px;
  max-width: 380px; animation: entra .18s ease-out;
}
.aviso-flotante.error { border-left-color: var(--rojo-alerta); }
@keyframes entra { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@media (prefers-reduced-motion: reduce) { .aviso-flotante { animation: none; } }

/* =========================== Portada de acceso ========================== *
   Banda de marca a la izquierda, acceso a la derecha. En pantallas angostas
   la banda pasa a ser un encabezado y el formulario queda debajo. */
body.bloqueado { overflow: hidden; }
body.bloqueado > header.app,
body.bloqueado > nav.tabs,
body.bloqueado > main,
body.bloqueado > footer.app { display: none; }

#acceso { position: fixed; inset: 0; z-index: 200; background: var(--fondo); }

.portada {
  display: grid; grid-template-columns: minmax(0, 1.05fr) minmax(0, 1fr);
  height: 100%; overflow: auto;
}

.portada-marca {
  background: var(--azul);
  background-image: linear-gradient(158deg, var(--azul) 0%, var(--marino-hondo) 100%);
  color: #fff; padding: 56px 52px;
  display: flex; flex-direction: column; justify-content: space-between; gap: 40px;
}
.portada-marca .marca { width: 56px; height: 56px; color: #fff; display: block; margin-bottom: 30px; }
.pm-eyebrow {
  margin: 0 0 12px; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: 2.2px; color: rgba(255,255,255,.72); font-weight: 600;
}
.portada-marca h1 {
  margin: 0 0 16px; font-size: clamp(30px, 3.6vw, 44px); line-height: 1.08;
  font-weight: 700; letter-spacing: -.6px; text-wrap: balance; max-width: 12ch;
}
.pm-bajada { margin: 0; font-size: 15.5px; line-height: 1.6; color: rgba(255,255,255,.86); max-width: 42ch; }
.pm-pie { margin: 0; font-size: 12.5px; line-height: 1.55; color: rgba(255,255,255,.6); max-width: 44ch; }

.portada-acceso { display: flex; align-items: center; justify-content: center; padding: 48px 40px; }
.pa-caja { width: 100%; max-width: 380px; }
.pa-hola {
  margin: 0 0 6px; font-size: 11.5px; text-transform: uppercase;
  letter-spacing: 2.2px; color: var(--azul-claro); font-weight: 700;
}

/**
 * Lectura del costo laboral sobre la venta, contra la banda de referencia de la
 * actividad en Argentina:
 *
 *   hasta 10%  farmacia eficiente: alta facturación por empleado, procesos
 *              optimizados, o peso fuerte de venta libre y perfumería.
 *   10% a 15%  por encima del objetivo, todavía manejable.
 *   15% o más  techo de alerta: sobreestructura, caída de ventas, o un modelo
 *              operativo caro (24 horas con plus nocturnos y horas extras,
 *              recetario magistral de alta demanda de mano de obra).
 */
function evaluarCostoVenta(pct, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  if (pct === null || pct === undefined || isNaN(pct)) {
    return { zona: 'sd', icono: '⚪', texto: 'Sin datos de venta',
             lectura: 'Cargá la venta neta del período para poder medir el costo laboral.' };
  }
  if (pct <= p.benchmarkCostoVenta) {
    return { zona: 'eficiente', icono: '🟢', texto: 'Eficiente',
             lectura: 'El costo laboral está dentro del objetivo. Indica buena facturación por empleado y procesos ordenados.' };
  }
  if (pct < p.alertaCostoVenta) {
    return { zona: 'atencion', icono: '🟡', texto: 'Por encima del objetivo',
             lectura: 'Todavía por debajo del techo de alerta, pero conviene entender qué lo empuja: horas extras, cobertura de francos o venta por debajo de lo previsto.' };
  }
  return { zona: 'alerta', icono: '🔴', texto: 'Techo de alerta superado',
           lectura: 'Suele significar tienda sobreestructurada, caída de ventas, o un modelo operativo costoso: horario extendido con plus nocturnos y horas extras, o recetario de alta demanda de mano de obra.' };
}

function semaforoDotacion(diferencia) {
  if (diferencia === null || diferencia === undefined || isNaN(diferencia)) {
    return { clave: 'sd', icono: '⚪', texto: 'Sin datos de venta' };
  }
  if (diferencia >= 3)  return { clave: 'ampliar', icono: '🟢', texto: 'Ampliar dotación' };
  if (diferencia >= 0)  return { clave: 'optima',  icono: '✅', texto: 'Dotación óptima' };
  if (diferencia >= -2) return { clave: 'revisar', icono: '🟡', texto: 'Revisar' };
  return { clave: 'reducir', icono: '🔴', texto: 'Reducir dotación' };
}

/*
 * modelo.js — Motor de cálculo.
 *
 * Convención de FTE (la que usa la hoja DOT de TD01 y la que acordamos):
 *   "Días trabajados" = días de VÍNCULO laboral en el mes, no días presentes.
 *   Una posición cubierta todo el mes aporta 30 días; un alta o una baja
 *   aportan los días efectivos de ese mes. El ausentismo se descuenta aparte,
 *   de modo que no se computa dos veces.
 *
 *   FTE Real = (días de vínculo / 30) - (días ausentes / 30) + (horas extras / 200)
 */

/* ---------------------------- utilidades ---------------------------- */
const num = v => {
  const n = typeof v === 'number' ? v : parseFloat(String(v ?? '').replace(',', '.'));
  return isFinite(n) ? n : 0;
};

const redondear = (n, d = 2) => {
  const f = Math.pow(10, d);
  return Math.round((num(n) + Number.EPSILON) * f) / f;
};

/* --------------------------- FTE y costos --------------------------- */

/**
 * Calcula FTE y costo laboral de una fila de posición.
 * @param {object} fila  { rol, heads, diasAltas, diasBajas, diasAusentes,
 *                         horasExtras, sueldoBruto, costoHE, bonos, cargasManual }
 * @param {object} par   parámetros (diasMes, horasMes, factorCargas)
 */
function calcularPosicion(fila, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const heads = num(fila.heads);

  // Días de vínculo: dotación estable + prorrateo de altas y bajas del mes.
  const diasEstables = heads * p.diasMes;
  const diasAltas = num(fila.diasAltas);
  const diasBajas = num(fila.diasBajas);
  const diasTrabajados = diasEstables + diasAltas + diasBajas;

  const diasAusentes = num(fila.diasAusentes);
  const horasExtras = num(fila.horasExtras);

  const fteVinculo   = diasTrabajados / p.diasMes;
  const fteAusencias = -(diasAusentes / p.diasMes);
  const fteExtras    = horasExtras / p.horasMes;
  const fteReal      = fteVinculo + fteAusencias + fteExtras;

  // Costo laboral
  const sueldoBruto = num(fila.sueldoBruto);
  const costoHE     = num(fila.costoHE);
  const bonos       = num(fila.bonos);
  const baseCargas  = sueldoBruto + costoHE + bonos;
  const cargas = fila.cargasManual !== '' && fila.cargasManual !== null && fila.cargasManual !== undefined
    ? num(fila.cargasManual)
    : baseCargas * (p.factorCargas - 1);
  const costoTotal = sueldoBruto + costoHE + bonos + cargas;
  const costoPorFte = fteReal > 0 ? costoTotal / fteReal : null;

  // Horas extras como % de las horas teóricas de la posición
  const horasTeoricas = heads * p.horasMes;
  const ratioExtras = horasTeoricas > 0 ? horasExtras / horasTeoricas : null;

  // Ausentismo de la posición sobre días de vínculo
  const ratioAusentismo = diasTrabajados > 0 ? diasAusentes / diasTrabajados : null;

  return {
    rol: fila.rol,
    heads,
    diasAltas, diasBajas, diasTrabajados,
    diasAusentes, horasExtras,
    fteVinculo, fteAusencias, fteExtras, fteReal,
    sueldoBruto, costoHE, bonos, cargas, costoTotal, costoPorFte,
    ratioExtras, ratioAusentismo,
    // Brecha de cobertura: FTE Real contra la dotación equivalente que surge de
    // los días de vínculo. Negativa = se perdió cobertura por ausencias más de
    // lo que se recuperó con horas extras.
    brechaFte: fteReal - fteVinculo
  };
}

/** Suma la matriz completa de posiciones de una visita. */
function calcularMatriz(posiciones, par) {
  const filas = (posiciones || []).map(f => calcularPosicion(f, par));
  const acc = (k) => filas.reduce((s, f) => s + num(f[k]), 0);

  const total = {
    rol: 'TOTAL',
    heads: acc('heads'),
    diasAltas: acc('diasAltas'),
    diasBajas: acc('diasBajas'),
    diasTrabajados: acc('diasTrabajados'),
    diasAusentes: acc('diasAusentes'),
    horasExtras: acc('horasExtras'),
    fteReal: acc('fteReal'),
    sueldoBruto: acc('sueldoBruto'),
    costoHE: acc('costoHE'),
    bonos: acc('bonos'),
    cargas: acc('cargas'),
    costoTotal: acc('costoTotal')
  };
  total.costoPorFte = total.fteReal > 0 ? total.costoTotal / total.fteReal : null;
  total.fteVinculo = total.diasTrabajados / (par && par.diasMes ? par.diasMes : PARAMETROS_DEFECTO.diasMes);
  total.brechaFte = total.fteReal - total.fteVinculo;

  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const horasTeoricas = total.heads * p.horasMes;
  total.ratioExtras = horasTeoricas > 0 ? total.horasExtras / horasTeoricas : null;
  total.ratioAusentismo = total.diasTrabajados > 0 ? total.diasAusentes / total.diasTrabajados : null;

  return { filas, total };
}

/* --------------------------- Ausentismo ----------------------------- */

/**
 * Consolida el detalle de ausentismo por concepto.
 *
 * Si todavía no se cargó la apertura por concepto, se toman los días ausentes
 * de la matriz de FTE: así el porcentaje del panel refleja lo que realmente se
 * relevó, en lugar de mostrar cero. El flag `sinApertura` avisa que falta el
 * detalle.
 *
 * @param {object} detalle  { '085': 12, '071': 30, ... } días por código
 * @param {number} diasDisponibles  total de días de vínculo del mes
 * @param {number} diasMatriz  días ausentes cargados en la matriz de FTE
 */
function calcularAusentismo(detalle, diasDisponibles, diasMatriz) {
  detalle = detalle || {};
  const base = num(diasDisponibles);
  const grupos = AUSENTISMO_GRUPOS.map(g => {
    const conceptos = g.conceptos.map(c => {
      const dias = num(detalle[c.cod]);
      return { cod: c.cod, nombre: c.nombre, inactivo: !!c.inactivo, dias,
               pct: base > 0 ? dias / base : null };
    });
    const dias = conceptos.reduce((s, c) => s + c.dias, 0);
    return { id: g.id, nombre: g.nombre, ayuda: g.ayuda, conceptos, dias, pct: base > 0 ? dias / base : null };
  });

  const detallados = grupos.reduce((s, g) => s + g.dias, 0);

  /* Gestionable es exactamente lo controlable: lo que la tienda y RRHH pueden
     bajar. Las licencias legales y la enfermedad comprobada no entran, por más
     que pesen en la cobertura. */
  const gestionable = grupos
    .filter(g => g.id === 'controlable')
    .reduce((s, g) => s + g.dias, 0);

  /* Días que el colaborador no percibe de la empresa. Es un dato de costo,
     independiente de si la ausencia se podía evitar. */
  const inactivos = grupos.reduce((s, g) =>
    s + g.conceptos.filter(c => c.inactivo).reduce((a, c) => a + c.dias, 0), 0);

  const sinApertura = detallados === 0 && num(diasMatriz) > 0;
  const totalDias = sinApertura ? num(diasMatriz) : detallados;

  return {
    grupos,
    diasDisponibles: base,
    diasDetallados: detallados,
    diasMatriz: num(diasMatriz),
    sinApertura,
    totalDias,
    pctTotal: base > 0 ? totalDias / base : null,
    diasGestionables: gestionable,
    pctGestionable: base > 0 ? gestionable / base : null,
    diasInactivos: inactivos,
    pctInactivo: base > 0 ? inactivos / base : null
  };
}

/* ------------------------- Rotación y bajas ------------------------- */

/**
 * Rotación del mes según la planilla ESTADISTICA (5) de TD01.
 *   dotación promedio = (dotación anterior + nueva dotación) / 2
 *   rotación mensual  = bajas / dotación promedio
 *   proyección anual  = rotación mensual x 12
 */
function calcularRotacion(rot) {
  rot = rot || {};
  const anterior  = num(rot.dotacionAnterior);
  const altasExt  = num(rot.altasExternas);
  const altasInt  = num(rot.altasInternas);
  const bajasExt  = num(rot.bajasExternas);
  const bajasInt  = num(rot.bajasInternas);

  const nueva = anterior + altasExt + altasInt - bajasExt - bajasInt;
  const promedio = (anterior + nueva) / 2;
  const bajas = bajasExt + bajasInt;

  const mensual = promedio > 0 ? bajas / promedio : null;

  return {
    anterior, altasExt, altasInt, bajasExt, bajasInt, bajas,
    nueva,
    promedio,
    variacion: anterior > 0 ? (nueva - anterior) / anterior : null,
    mensual,
    proyeccionAnual: mensual === null ? null : mensual * 12
  };
}

/** Agrupa las bajas registradas por categoría (renuncia / despido / otros). */
function agruparBajas(movimientos) {
  const bajas = (movimientos || []).filter(m => m.tipo === 'baja');
  const grupos = MOTIVOS_BAJA.map(g => ({
    id: g.id,
    nombre: g.nombre,
    casos: bajas.filter(b => b.categoria === g.id).length
  }));
  const total = bajas.length;
  grupos.forEach(g => { g.pct = total > 0 ? g.casos / total : null; });
  return { grupos, total };
}

/* ----------------- Dotación óptima vs. venta (Selma) ---------------- */

/**
 * Reproduce el modelo de la planilla de dotación:
 *   costo laboral real   = brutos x factor de cargas
 *   % costo / venta      = costo laboral real / venta neta
 *   costo por empleado   = costo laboral real / empleados
 *   dotación óptima      = (venta x benchmark) / costo por empleado
 *   ahorro / inversión   = costo óptimo - costo real
 */
function calcularDotacionOptima({ tipo, empleados, costoLaboralReal, venta, ventaRed }, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const emp = num(empleados);
  const costo = num(costoLaboralReal);
  const v = num(venta);

  if (tipo === 'staff') {
    const base = num(ventaRed);
    const pct = base > 0 ? costo / base : null;
    return {
      tipo: 'staff',
      costoReal: costo,
      pctCostoVenta: pct,
      benchmark: p.benchmarkStaff,
      dotacionOptima: null,
      diferencia: null,
      semaforo: pct === null
        ? { clave: 'sd', icono: '⚪', texto: 'Sin venta de red cargada' }
        : (pct > p.benchmarkStaff
            ? { clave: 'reducir', icono: '🔴', texto: 'Staff sobredimensionado' }
            : { clave: 'optima', icono: '✅', texto: 'Staff dentro del benchmark' })
    };
  }

  if (!v || !emp || !costo) {
    return {
      tipo: 'venta', costoReal: costo, pctCostoVenta: null,
      benchmark: p.benchmarkCostoVenta, alerta: p.alertaCostoVenta,
      dotacionOptima: null, dotacionMaxima: null, diferencia: null, costoOptimo: null, ahorro: null,
      semaforo: semaforoDotacion(null), banda: evaluarCostoVenta(null, p)
    };
  }

  const costoPorEmpleado = costo / emp;
  const dotacionOptima = Math.round((v * p.benchmarkCostoVenta) / costoPorEmpleado);
  const dotacionMaxima = Math.floor((v * p.alertaCostoVenta) / costoPorEmpleado);
  const diferencia = dotacionOptima - emp;
  const costoOptimo = dotacionOptima * costoPorEmpleado;
  const pct = costo / v;

  return {
    tipo: 'venta',
    costoReal: costo,
    pctCostoVenta: pct,
    benchmark: p.benchmarkCostoVenta,
    alerta: p.alertaCostoVenta,
    costoPorEmpleado,
    dotacionOptima,
    dotacionMaxima,          // dotación que la venta sostiene antes del techo de alerta
    diferencia,
    costoOptimo,
    ahorro: costoOptimo - costo,
    semaforo: semaforoDotacion(diferencia),
    banda: evaluarCostoVenta(pct, p)
  };
}

/**
 * Productividad: 6 tickets por hora por cada 6 horas trabajadas.
 * Un cumplimiento por encima del 100% sugiere que la tienda vende más de lo
 * que su dotación puede sostener; por debajo, sobra cobertura.
 */
function calcularProductividad({ tickets, horasTrabajadas }, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const t = num(tickets), h = num(horasTrabajadas);
  if (!t || !h) return null;
  const real = t / h;
  return {
    ticketsHora: real,
    objetivo: p.ticketsHoraObjetivo,
    cumplimiento: real / p.ticketsHoraObjetivo
  };
}

/* ---------------------------- Sucesión ------------------------------ */

/**
 * Heat map 9-box del toolkit de sucesión: criticidad (1-3) x escasez (1-3).
 * Se considera crítica toda posición con criticidad >= 2,5 o
 * criticidad >= 2 combinada con escasez alta.
 */
function evaluarSucesion(items) {
  const lista = (items || []).map(it => {
    const criticidad = num(it.criticidad);
    const escasez = num(it.escasez);
    const candidatos = it.candidatos || [];
    const listos = candidatos.filter(c => c.readiness === 'lt1').length;
    const critica = criticidad >= 2.5 || (criticidad >= 2 && escasez >= 3);
    return {
      ...it,
      criticidad, escasez, candidatos,
      candidatosTotal: candidatos.length,
      candidatosListos: listos,
      critica,
      conPlan: candidatos.length > 0,
      riesgo: critica && candidatos.length === 0
        ? 'alto'
        : (critica && listos === 0 ? 'medio' : 'bajo')
    };
  });

  const criticas = lista.filter(i => i.critica);
  return {
    lista,
    posicionesCriticas: criticas.length,
    criticasConPlan: criticas.filter(i => i.conPlan).length,
    promedioCandidatos: criticas.length
      ? criticas.reduce((s, i) => s + i.candidatosTotal, 0) / criticas.length
      : 0,
    candidatosListos: lista.reduce((s, i) => s + i.candidatosListos, 0),
    enRiesgo: lista.filter(i => i.riesgo === 'alto')
  };
}

/* ------------------------ Diagnóstico automático -------------------- */

/* Formateo local en es-AR, para que el diagnóstico automático use la misma
   coma decimal que el resto del reporte. */
const _pct = (n, d = 2) =>
  (num(n) * 100).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';
const _n = (v, d = 2) =>
  num(v).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d });

/**
 * Genera hallazgos automáticos a partir de las métricas de la visita.
 * No reemplaza el criterio del coordinador: es el piso del análisis.
 */
function generarHallazgos(v, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const out = [];
  const m = calcularMatriz(v.posiciones, p);
  const aus = calcularAusentismo(v.ausentismo && v.ausentismo.detalle, m.total.diasTrabajados, m.total.diasAusentes);
  const rot = calcularRotacion(v.rotacion);

  if (aus.pctTotal !== null && aus.pctTotal > p.umbralAusentismo) {
    out.push(`Ausentismo total del ${_pct(aus.pctTotal)}, por encima del umbral de referencia del ${_pct(p.umbralAusentismo, 0)}.` +
      (aus.sinApertura
        ? ' Falta la apertura por concepto para separar los días gestionables de los que no lo son.'
        : ` De esos días, ${aus.diasGestionables} son gestionables (${_pct(aus.pctGestionable)} de la base).`));
  }
  if (m.total.ratioExtras !== null && m.total.ratioExtras > p.umbralHorasExtras) {
    out.push(`Las horas extras equivalen al ${_pct(m.total.ratioExtras)} de las horas teóricas de la dotación (${m.total.horasExtras} hs), ` +
      `es decir ${_n(m.total.horasExtras / p.horasMes)} FTE comprados por sobretiempo.`);
  }
  if (m.total.brechaFte < -0.5) {
    out.push(`La tienda opera con ${_n(Math.abs(m.total.brechaFte))} FTE por debajo de su dotación equivalente ` +
      `(${_n(m.total.fteVinculo)} personas contratadas / ${_n(m.total.fteReal)} FTE efectivos).`);
  }

  m.filas.forEach(f => {
    if (f.heads > 0 && f.ratioAusentismo !== null && f.ratioAusentismo > p.umbralAusentismo * 2) {
      out.push(`${f.rol}: ausentismo del ${_pct(f.ratioAusentismo)}, más del doble del umbral. Requiere revisión individual de casos.`);
    }
    if (f.heads > 0 && f.ratioExtras !== null && f.ratioExtras > p.umbralHorasExtras * 2) {
      out.push(`${f.rol}: ${f.horasExtras} hs extras (${_pct(f.ratioExtras)} de sus horas teóricas). Verificar si es un déficit estructural de dotación.`);
    }
  });

  const dot = calcularDotacionOptima({
    tipo: 'venta', empleados: m.total.heads, costoLaboralReal: m.total.costoTotal,
    venta: v.comercial && v.comercial.venta
  }, p);
  if (dot.pctCostoVenta !== null) {
    if (dot.banda.zona === 'alerta') {
      const causas = [];
      if (m.total.ratioExtras !== null && m.total.ratioExtras > p.umbralHorasExtras) {
        causas.push(`las horas extras representan el ${_pct(m.total.ratioExtras)} de las horas teóricas`);
      }
      if (m.total.heads > dot.dotacionMaxima) {
        causas.push(`la venta sostiene hasta ${dot.dotacionMaxima} personas antes del techo y la tienda tiene ${m.total.heads}`);
      }
      out.push(`Costo laboral en ${_pct(dot.pctCostoVenta)} de la venta, por encima del techo de alerta del ${_pct(p.alertaCostoVenta, 0)}. ` +
        (causas.length ? `En esta tienda: ${causas.join('; ')}. ` : '') +
        'Revisar si es sobreestructura, caída de ventas o un modelo operativo costoso.');
    } else if (dot.banda.zona === 'atencion') {
      out.push(`Costo laboral en ${_pct(dot.pctCostoVenta)} de la venta: por encima del objetivo del ${_pct(p.benchmarkCostoVenta, 0)} ` +
        `pero por debajo del techo de alerta del ${_pct(p.alertaCostoVenta, 0)}.`);
    }
  }

  if (rot.proyeccionAnual !== null && rot.proyeccionAnual > 0.30) {
    out.push(`Rotación mensual del ${_pct(rot.mensual)}, que proyectada al año da ${_pct(rot.proyeccionAnual, 1)}. Revisar causas de egreso.`);
  }
  if ((v.sanciones || []).length >= 3) {
    out.push(`${v.sanciones.length} sanciones registradas en el período. Analizar concentración por sector y por motivo.`);
  }

  const suc = evaluarSucesion(v.sucesion);
  if (suc.enRiesgo.length) {
    out.push(`${suc.enRiesgo.length} posición/es crítica/s sin candidato de sucesión identificado: ${suc.enRiesgo.map(i => i.posicion).join(', ')}.`);
  }

  return out;
}

/* ------------------------- Recorrida del HRBP ----------------------- */

/**
 * Avance de la recorrida de una visita.
 *
 * Lo que no aplica no cuenta en contra: el porcentaje se calcula sobre lo que
 * correspondía hacer, no sobre la lista entera. Los puntos marcados como clave
 * se siguen aparte, porque son los que no deberían quedar sin hacer.
 */
function evaluarRecorrida(recorrida) {
  const checks = (recorrida && recorrida.checks) || {};
  const bloques = RECORRIDA_HRBP.map(b => {
    const items = b.items.map(i => ({
      id: b.id + '_' + i.id,
      texto: i.texto, ayuda: i.ayuda, clave: !!i.clave,
      estado: checks[b.id + '_' + i.id] || ''
    }));
    const aplica = items.filter(i => i.estado !== 'na');
    const hechos = items.filter(i => i.estado === 'ok');
    return {
      id: b.id, nombre: b.nombre, ayuda: b.ayuda, items,
      total: items.length, aplican: aplica.length, hechos: hechos.length,
      pct: aplica.length ? hechos.length / aplica.length : null
    };
  });

  const todos = bloques.reduce((a, b) => a.concat(b.items), []);
  const aplican = todos.filter(i => i.estado !== 'na');
  const hechos = todos.filter(i => i.estado === 'ok');
  const sinHacer = todos.filter(i => i.estado === 'no');
  const sinResponder = todos.filter(i => !i.estado);
  const clavesPendientes = todos.filter(i => i.clave && i.estado !== 'ok' && i.estado !== 'na');

  return {
    bloques, total: todos.length,
    aplican: aplican.length, hechos: hechos.length,
    sinHacer, sinResponder, clavesPendientes,
    pct: aplican.length ? hechos.length / aplican.length : null,
    completa: !sinResponder.length
  };
}

/**
 * El FTE explicado en el idioma del Gerente de Operaciones.
 *
 * La matriz da el número; esto da la frase. Un gerente operativo no decide
 * sobre "FTE Real 11,42": decide sobre "tenés trece personas y la tienda
 * trabajó con once y media, y la diferencia te costó horas extras".
 *
 * Devuelve líneas sueltas para que las use igual el reporte y la pantalla.
 */
function lecturaFte(calc, par) {
  const t = calc.matriz.total;
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const L = [];

  if (!t.diasTrabajados) {
    return ['Sin dotación cargada todavía: la matriz de FTE está vacía.'];
  }

  /* Los números van en el idioma del lector, con coma decimal. */
  const n1 = v => _n(v, 1);
  const equiv = t.diasTrabajados / p.diasMes;
  const personas = t.heads;
  const porAusencias = t.diasAusentes / p.diasMes;
  const porExtras = t.horasExtras / p.horasMes;

  L.push(`En el mes hubo ${personas} persona${personas === 1 ? '' : 's'} de mes completo, que con los ` +
         `ingresos y egresos equivalen a ${n1(equiv)} puestos de tiempo completo.`);

  if (porAusencias) {
    L.push(`De esos puestos, ${n1(porAusencias)} no estuvieron: es lo que suman los ` +
           `${_n(t.diasAusentes, 0)} días de ausencia del período.`);
  }
  if (porExtras) {
    L.push(`Las ${_n(t.horasExtras, 0)} horas extras recuperaron ${n1(porExtras)} puestos.`);
  }

  L.push(`Resultado: la tienda funcionó con ${n1(t.fteReal)} puestos reales.`);

  /* La brecha es el número que hay que llevarse de acá. Medio puesto en una
     tienda de doce personas es un turno sin cubrir: el umbral es bajo a
     propósito. */
  const brecha = t.brechaFte;
  if (brecha <= -0.3) {
    L.push(`Trabajó con ${n1(Math.abs(brecha))} puestos menos de los que tiene asignados. ` +
           'Eso se siente en la atención, no en la planilla.');
  } else if (brecha >= 0.3) {
    L.push(`Trabajó con ${n1(brecha)} puestos más de los que tiene asignados, cubiertos con horas extras. ` +
           'Sale más caro que cubrirlos con dotación.');
  } else {
    L.push('Las ausencias y las horas extras se compensaron: la cobertura real fue la prevista.');
  }

  if (t.costoPorFte) {
    L.push(`Cada puesto real costó ${p.moneda} ${_n(t.costoPorFte, 0)} en el mes.`);
  }
  return L;
}

/** Antigüedad en años a partir de la fecha de ingreso. */
function antiguedadAnios(fechaIngreso) {
  if (!fechaIngreso) return null;
  const d = new Date(fechaIngreso + 'T00:00:00');
  if (isNaN(d)) return null;
  return (Date.now() - d.getTime()) / (365.25 * 24 * 3600 * 1000);
}

/**
 * Registra una evaluación. Solo agrega al historial si algo cambió, para que
 * el historial cuente movimientos y no reediciones.
 */
function registrarEvaluacion(colaborador, desempeno, potencial, contexto) {
  const d = Number(desempeno) || null;
  const pot = Number(potencial) || null;
  const previo = { desempeno: colaborador.desempeno || null, potencial: colaborador.potencial || null };
  const cambio = previo.desempeno !== d || previo.potencial !== pot;

  colaborador.desempeno = d;
  colaborador.potencial = pot;
  if (!Array.isArray(colaborador.historial)) colaborador.historial = [];

  if (cambio && (d || pot)) {
    colaborador.historial.push({
      fecha: (contexto && contexto.fecha) || new Date().toISOString().slice(0, 10),
      desempeno: d, potencial: pot,
      desde: previo.desempeno || previo.potencial ? previo : null,
      evaluadoCon: (contexto && contexto.evaluadoCon) || '',
      motivo: (contexto && contexto.motivo) || ''
    });
    colaborador.fechaEvaluacion = (contexto && contexto.fecha) || new Date().toISOString().slice(0, 10);
    colaborador.evaluadoCon = (contexto && contexto.evaluadoCon) || colaborador.evaluadoCon || '';
  }
  return cambio;
}

/** Distribución del plantel en la matriz, para el panel y el reporte. */
function distribucion9Box(colaboradores) {
  const activos = (colaboradores || []).filter(c => c.activo !== false);
  const evaluados = activos.filter(c => c.desempeno && c.potencial);

  const celdas = {};
  Object.keys(NINE_BOX).forEach(k => { celdas[k] = []; });
  evaluados.forEach(c => { celdas[String(c.potencial) + String(c.desempeno)].push(c); });

  // Todas las agrupaciones devuelven listas, para poder contarlas y nombrarlas
  const porTono = tono => evaluados.filter(c => (cuadranteDe(c.potencial, c.desempeno) || {}).tono === tono);

  return {
    activos, evaluados,
    sinEvaluar: activos.filter(c => !c.desempeno || !c.potencial),
    celdas,
    fortalezas: porTono('verde'),
    aTrabajar: porTono('amarillo'),
    enRiesgo: porTono('rojo'),
    listosParaCrecer: evaluados.filter(c => c.potencial >= 2 && c.desempeno >= 2),
    riesgoDeSalida: activos.filter(c => c.riesgoSalida === 'alto'),
    estudiando: activos.filter(c => c.estudia && c.estudia !== 'noEstudia')
  };
}

/*
 * novedades.js — Lectura del parte de novedades de liquidación de sueldos.
 *
 * Es la planilla que Nómina arma todos los meses, una hoja por sucursal, con

 * uno, y los días de ausencia abiertos por concepto.
 *
 * Lo que NO trae es la posición de cada persona. Se asigna una vez en la solapa
 * de Talento y de ahí en más los meses siguientes la conservan.
 */

/* Encabezados que se reconocen. La comparación es sin acentos, sin espacios y
   en mayúsculas, así que aguanta las variantes de tipeo entre hojas. */
const COLUMNAS_NOVEDADES = {
  MES: 'mes',
  TIENDA: 'tienda',
  SECTOR: 'sector',
  LEGAJO: 'legajo',
  CUIL: 'cuil',
  APELLIDO: 'apellido',
  NOMBRE: 'nombre',
  HORASNOCTURNAS: 'nocturnas',
  'HORASEXTRAS50%': 'he50',
  'HORASEXTRAS100%': 'he100',
  TURNO: 'turno',
  FERIADOTRABAJADO: 'feriado',
  DIADELGREMIO: 'gremio',
  DIASEXAMEN: 'examen',
  DIASENFERMEDAD: 'enfermedad',
  DIASDEVACACIONES: 'vacaciones',
  DIASDEAUSENCIANOJUSTIFICADA: 'noJustificada',
  DIASDEAUSENCIANOJUSTIF: 'noJustificada',
  AUSENCIAPORFALLECIMIENTO: 'fallecimiento',
  MUDANZA: 'mudanza',
  FALTANTEDECAJERO: 'faltanteCaja',
  OBSERVACIONES: 'obs'
};

/* Cada novedad de ausencia cae en un concepto del tablero de estadísticas.
   Los códigos son los de TD01, los mismos que usa la solapa de Ausentismo. */
const MAPA_AUSENCIAS = [
  { campo: 'enfermedad',    cod: '085', nombre: 'Enfermedad' },
  { campo: 'vacaciones',    cod: '071', nombre: 'Vacaciones' },
  { campo: 'noJustificada', cod: '081', nombre: 'Ausente sin aviso' },
  { campo: 'fallecimiento', cod: '052', nombre: 'Fallecimiento 1er grado' },
  { campo: 'mudanza',       cod: '054', nombre: 'Mudanza' },
  /* La planilla no distingue examen secundario de universitario; se imputa al
     universitario, que es el caso corriente. Los dos son no controlables, así
     que la lectura del mes no cambia. */
  { campo: 'examen',        cod: '056', nombre: 'Examen universitario' }
];

const CAMPOS_NOVEDAD = ['nocturnas', 'he50', 'he100', 'feriado', 'gremio', 'examen',
                        'enfermedad', 'vacaciones', 'noJustificada', 'fallecimiento', 'mudanza'];

const _norm = t => String(t == null ? '' : t)
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toUpperCase().replace(/[^A-Z0-9%]/g, '');

/** Dígitos de un valor, tolerando el CUIL escrito con guiones. */
function soloDigitos(v) {
  return String(v == null ? '' : v).replace(/\D/g, '');
}

function esCuil(v) {
  const d = soloDigitos(v);
  return d.length === 10 || d.length === 11;
}

/** Número tolerante: acepta "1.234,56", "$ 1.234", "-", vacío. */
function numeroNovedad(v) {
  if (typeof v === 'number') return isFinite(v) ? v : 0;
  let t = String(v == null ? '' : v).trim().replace(/\$/g, '').replace(/\s/g, '');
  if (!t || t === '-' || t === '—') return 0;
  t = /^-?\d{1,3}(\.\d{3})+(,\d+)?$/.test(t) ? t.replace(/\./g, '').replace(',', '.')
                                             : t.replace(',', '.');
  const n = parseFloat(t);
  return isFinite(n) ? n : 0;
}

/**
 * Interpreta lo que se copia de una hoja del libro de novedades.
 *
 * Dos cuidados que vienen del archivo real:
 *  - En algunas hojas el bloque de identidad quedó corrido una columna a la
 *    izquierda (el legajo cayó bajo el encabezado TIENDA). Las columnas de
 *    novedades no están corridas. Por eso la identidad se ubica por contenido,
 *    fila por fila, y las novedades por su encabezado.
 *  - Alguna hoja repite un encabezado (dos "HORAS NOCTURNAS"); se toma la
 *    primera aparición de cada campo.
 */
function interpretarNovedades(crudo) {
  const texto = String(crudo || '').replace(/\r/g, '');
  const lineas = texto.split('\n').filter(l => l.trim());
  if (lineas.length < 2) return { filas: [], avisos: ['No hay filas para leer.'], tienda: '', mes: '' };

  const sep = lineas[0].includes('\t') ? '\t' : (lineas[0].includes(';') ? ';' : ',');
  const partir = l => l.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));

  /* El encabezado es la primera línea que nombra CUIL o APELLIDO: así se puede
     pegar con o sin las filas de título que a veces trae la hoja. */
  const iEnc = lineas.findIndex(l => {
    const c = partir(l).map(_norm);
    return c.includes('CUIL') || c.includes('APELLIDO');
  });
  if (iEnc < 0) return { filas: [], avisos: ['No se encontró la fila de encabezados (CUIL, APELLIDO, …).'], tienda: '', mes: '' };

  const enc = partir(lineas[iEnc]).map(_norm);
  const col = {};
  enc.forEach((e, i) => {
    const campo = COLUMNAS_NOVEDADES[e];
    if (campo && col[campo] === undefined) col[campo] = i;
  });

  const avisos = [];
  const filas = [];
  let sinCuil = 0, corridas = 0;
  let tienda = '', mes = '';

  lineas.slice(iEnc + 1).forEach(l => {
    const c = partir(l);
    const iCuil = c.findIndex(esCuil);
    if (iCuil < 0) { if (c.some(x => x)) sinCuil++; return; }
    if (iCuil !== col.cuil) corridas++;

    const txt = i => (i >= 0 && i < c.length && c[i] != null) ? String(c[i]).trim() : '';
    const nov = k => col[k] === undefined ? 0 : numeroNovedad(c[col[k]]);

    const fila = {
      cuil: soloDigitos(c[iCuil]),
      apellido: txt(iCuil + 1),
      nombre: txt(iCuil + 2),
      legajo: col.legajo === undefined ? '' : txt(iCuil - 1),
      sector: col.sector === undefined ? '' : txt(iCuil - 1),
      obs: txt(col.obs)
    };
    CAMPOS_NOVEDAD.forEach(k => { fila[k] = nov(k); });

    /* La tienda solo se cree cuando la fila no viene corrida: en las corridas
       esa columna quedó ocupada por el legajo. */
    if (!tienda && col.tienda !== undefined && iCuil === col.cuil) tienda = txt(col.tienda);
    if (!mes && col.mes !== undefined) mes = txt(col.mes);

    if (fila.apellido || fila.nombre) filas.push(fila);
  });

  if (sinCuil) avisos.push(`${sinCuil} fila${sinCuil === 1 ? '' : 's'} sin CUIL reconocible que quedaron afuera.`);
  if (corridas) {
    avisos.push(`${corridas} fila${corridas === 1 ? '' : 's'} venían corridas una columna respecto del encabezado; ` +
                'se leyeron igual tomando el CUIL como referencia.');
  }
  if (!filas.length) avisos.push('No se reconoció ninguna persona: revisá que estén las columnas CUIL, APELLIDO y NOMBRE.');

  return { filas, avisos, tienda, mes };
}

/** Totales de una tanda de novedades, para mostrar antes y después de importar. */
function resumirNovedades(filas) {
  const t = { personas: (filas || []).length };
  CAMPOS_NOVEDAD.forEach(k => { t[k] = 0; });
  (filas || []).forEach(f => CAMPOS_NOVEDAD.forEach(k => { t[k] += numeroNovedad(f[k]); }));
  t.horasExtras = t.he50 + t.he100;
  t.diasAusencia = MAPA_AUSENCIAS.reduce((s, m) => s + t[m.campo], 0);
  return t;
}

/** Días de ausencia de una novedad, abiertos por código del tablero. */
function ausenciasPorCodigo(novedad) {
  const d = {};
  MAPA_AUSENCIAS.forEach(m => {
    const v = numeroNovedad((novedad || {})[m.campo]);
    if (v) d[m.cod] = (d[m.cod] || 0) + v;
  });
  return d;
}

/* Nombre presentable a partir del apellido y el nombre de la planilla, que
   vienen en mayúsculas y a veces con espacios de más. */
function nombreDePlanilla(fila) {
  const limpiar = t => String(t || '').replace(/\s+/g, ' ').trim();
  return [limpiar(fila.apellido), limpiar(fila.nombre)].filter(Boolean).join(', ');
}

/*
 * nomina.js — Lectura del padrón de colaboradores del área.
 *
 * Es el listado maestro: una fila por persona, con su cargo, su tienda, sus
 * fechas y sus datos de contacto. Es lo que le faltaba al panel para saber
 * quién es quién: el libro de novedades trae los movimientos del mes pero no
 * el puesto, y la dotación por posición sale justamente de acá.
 *
 * Lo que la nómina no trae son los talles de la ropa de trabajo. Esos campos
 * quedan vacíos en el perfil, para completarlos a mano.
 */

/* Encabezados de la nómina. La comparación es sin acentos, sin espacios y en
   mayúsculas, así que aguanta las variantes de tipeo entre versiones. */
const COLUMNAS_NOMINA = {
  CUIL: 'cuil',
  DNI: 'dni',
  APELLIDO: 'apellido',
  NOMBRE: 'nombre',
  NOMBREYAPELLIDO: 'nombreCompleto',
  SEXO: 'sexo',
  ESTATUS: 'estatus',
  UNIDADDENEGOCIO: 'unidadNegocio',
  AREA: 'area',
  RAZONSOCIALCONTRATADOA: 'razonSocialContrato',
  TIENDADONDEESTA: 'tienda',
  CATEGORIACONVENIO: 'categoriaConvenio',
  CARGO: 'cargo',
  NIVELDECARGO: 'nivelCargo',
  FECHADENACIMIENTO: 'fechaNacimiento',
  FECHADEINGRESO: 'fechaIngreso',
  FECHADEINGRESOAFTD: 'fechaIngresoFTD',
  MAILCOORPORATIVOOPERSONAL: 'email',
  MAILCORPORATIVO: 'emailCorporativo',
  TELEFONO: 'telefono',
  DOMICILIOACTUALIZADO: 'domicilio',
  LOCALIDADYCP: 'localidad',
  OBRASOCIALPREPAGA: 'obraSocial',
  /* El listado corto del área usa otros nombres para lo mismo. */
  COLABORADOR: 'nombreCompleto',
  TIENDA: 'tienda',
  FICHA: 'legajo',
  RAZONSOCIAL: 'razonSocialContrato',
  FECHAINICIO: 'fechaIngreso',
  FECHADEINICIO: 'fechaIngreso'
};

/* "Sin tienda" es como el listado corto llama a los flotantes del área, que en
   la nómina completa figuran con su nombre. Es la misma gente. */
const TIENDA_FLOTANTES = 'FLOTANTES ÁREA 3';
const ALIAS_TIENDA = { SINTIENDA: TIENDA_FLOTANTES, FLOTANTES: TIENDA_FLOTANTES };

/* Campos de texto que se copian tal cual al perfil. */
const CAMPOS_NOMINA = ['dni', 'legajo', 'sexo', 'estatus', 'unidadNegocio', 'razonSocialContrato',
                       'categoriaConvenio', 'cargo', 'nivelCargo', 'fechaNacimiento',
                       'fechaIngreso', 'fechaIngresoFTD', 'email', 'emailCorporativo',
                       'telefono', 'domicilio', 'localidad', 'obraSocial'];

/* La planilla usa estos marcadores de Excel para "sin dato". */
const VACIOS_EXCEL = ['#N/A', '#REF!', '#VALUE!', '#¡REF!', '#N/D', 'NULL'];

const _normNom = t => String(t == null ? '' : t)
  .normalize('NFD').replace(/[\u0300-\u036f]/g, '')
  .toUpperCase().replace(/[^A-Z0-9]/g, '');

function textoNomina(v) {
  const t = String(v == null ? '' : v).replace(/\s+/g, ' ').trim();
  return VACIOS_EXCEL.indexOf(t.toUpperCase()) >= 0 ? '' : t;
}

/** Fecha a ISO. Acepta 1978-04-26, 26/04/1978 y el "1978-04-26 00:00:00" de Excel. */
function fechaNomina(v) {
  const t = textoNomina(v);
  if (!t) return '';
  let m = t.match(/^(\d{4})-(\d{2})-(\d{2})/);
  if (m) return `${m[1]}-${m[2]}-${m[3]}`;
  m = t.match(/^(\d{1,2})[\/\-](\d{1,2})[\/\-](\d{2,4})/);
  if (m) {
    const a = m[3].length === 2 ? (Number(m[3]) > 40 ? '19' + m[3] : '20' + m[3]) : m[3];
    return `${a}-${String(m[2]).padStart(2, '0')}-${String(m[1]).padStart(2, '0')}`;
  }
  return '';
}

/** Posición del panel que le corresponde a un cargo de la nómina. */
function posicionDeCargo(cargo) {
  return MAPA_CARGOS[_normNom(cargo)] || '';
}

/** Apellido y nombre presentables, desde el "TODO EN MAYÚSCULAS" de la planilla. */
function nombreDeNomina(fila) {
  const limpiar = t => String(t || '').replace(/\s+/g, ' ').trim();
  const ap = limpiar(fila.apellido), no = limpiar(fila.nombre);
  if (ap || no) return [ap, no].filter(Boolean).join(', ');
  return limpiar(fila.nombreCompleto);
}

/**
 * Interpreta la nómina pegada desde Excel.
 *
 * La primera columna del archivo real viene con el encabezado roto (`#REF!`)
 * pero contiene el número de personal, así que se lee por posición: es la
 * columna anterior al CUIL.
 */
function interpretarNomina(crudo) {
  const texto = String(crudo || '').replace(/\r/g, '');
  const lineas = texto.split('\n').filter(l => l.trim());
  if (lineas.length < 2) return { filas: [], avisos: ['No hay filas para leer.'] };

  const sep = lineas[0].includes('\t') ? '\t' : (lineas[0].includes(';') ? ';' : ',');
  const partir = l => l.split(sep).map(x => x.trim().replace(/^"|"$/g, ''));

  const iEnc = lineas.findIndex(l => {
    const c = partir(l).map(_normNom);
    return c.includes('CUIL') &&
      (c.includes('APELLIDO') || c.includes('CARGO') || c.includes('COLABORADOR'));
  });
  if (iEnc < 0) {
    return { filas: [], avisos: ['No se encontró la fila de encabezados (CUIL, y APELLIDO, CARGO o COLABORADOR).'] };
  }

  const enc = partir(lineas[iEnc]).map(_normNom);
  const col = {};
  enc.forEach((e, i) => {
    const campo = COLUMNAS_NOMINA[e];
    if (campo && col[campo] === undefined) col[campo] = i;
  });
  if (col.cuil === undefined) return { filas: [], avisos: ['La nómina no trae la columna CUIL.'] };

  const filas = [];
  const avisos = [];
  const sinCargo = [];
  const cuilDudoso = [];
  let sinCuil = 0;

  lineas.slice(iEnc + 1).forEach(l => {
    const c = partir(l);
    const cuil = soloDigitos(c[col.cuil]);
    /* Un CUIL mal tipeado no puede costarle a alguien quedar afuera del padrón:
       se acepta con margen, se avisa, y esa persona se identifica por nombre. */
    if (cuil.length < 10 || cuil.length > 13) { if (c.some(x => x)) sinCuil++; return; }

    const t = k => col[k] === undefined ? '' : textoNomina(c[col[k]]);
    const fila = { cuil };
    CAMPOS_NOMINA.forEach(k => { fila[k] = t(k); });
    ['fechaNacimiento', 'fechaIngreso', 'fechaIngresoFTD'].forEach(k => { fila[k] = fechaNomina(fila[k]); });

    fila.cuilDudoso = cuil.length !== 11;
    if (fila.cuilDudoso) cuilDudoso.push(`${textoNomina(c[col.apellido])} (${cuil})`);
    fila.apellido = t('apellido');
    fila.nombre = t('nombre');
    fila.nombreCompleto = t('nombreCompleto');
    const tienda = t('tienda');
    fila.tienda = ALIAS_TIENDA[_normNom(tienda)] || tienda;
    fila.posicion = posicionDeCargo(fila.cargo);
    /* En la nómina completa el número de personal está a la izquierda del CUIL,
       con el encabezado roto. En el listado corto esa columna no existe: ahí lo
       que va a la izquierda es el encabezado, así que solo se toma si es un
       número y no hay una columna FICHA que ya ocupe ese lugar. */
    const izquierda = col.cuil > 0 ? textoNomina(c[col.cuil - 1]) : '';
    fila.nroPersonal = (col.legajo === undefined && /^\d+$/.test(izquierda)) ? izquierda : '';

    if (fila.cargo && !fila.posicion) sinCargo.push(fila.cargo);
    filas.push(fila);
  });

  if (sinCuil) avisos.push(`${sinCuil} fila${sinCuil === 1 ? '' : 's'} sin CUIL reconocible que quedaron afuera.`);
  if (cuilDudoso.length) {
    avisos.push('CUIL con una cantidad de dígitos rara, se importaron igual pero conviene corregirlos en la nómina: ' +
                cuilDudoso.join(', ') + '.');
  }
  if (sinCargo.length) {
    const únicos = sinCargo.filter((x, i) => sinCargo.indexOf(x) === i);
    avisos.push('Cargos que no se reconocen y quedan sin posición asignada: ' + únicos.join(', ') + '.');
  }
  if (!filas.length) avisos.push('No se reconoció ninguna persona.');

  return { filas, avisos };
}

/** Resumen de una nómina leída: por tienda y por posición. */
function resumirNomina(filas) {
  const porTienda = {}, porPosicion = {};
  (filas || []).forEach(f => {
    const t = f.tienda || 'Sin tienda';
    porTienda[t] = (porTienda[t] || 0) + 1;
    const p = f.posicion || 'Sin posición';
    porPosicion[p] = (porPosicion[p] || 0) + 1;
  });
  return { personas: (filas || []).length, porTienda, porPosicion };
}

/*
 * reclamos.js — Registro de reclamos y consultas de los colaboradores.
 *
 * Lo que la gente le plantea al coordinador cuando va a la tienda: una hora
 * extra que no se pagó, un adicional nocturno que falta, una categoría que no
 * corresponde. Se dice de palabra, en el pasillo, y se pierde.
 *
 * Un reclamo NO es parte de la visita: se abre en una visita pero vive hasta
 * que se resuelve, y casi nunca se resuelve el mismo día. Por eso se guarda
 * aparte, con su propio estado y su propio reloj.
 *
 * El reloj importa: un reclamo salarial sin respuesta no se apaga solo, se
 * convierte en un telegrama. Lo que rompe la confianza no suele ser el "no":
 * es el silencio.
 */

/* Los reclamos que aparecen de verdad en una farmacia. La lista es cerrada
   para poder contarlos: si todo cae en "otro", no se puede ver el patrón. */
const TIPOS_RECLAMO = [
  { id: 'horasExtras',   nombre: 'Horas extras no liquidadas',        grupo: 'Liquidación' },
  { id: 'nocturno',      nombre: 'Adicional nocturno',                grupo: 'Liquidación' },
  { id: 'feriado',       nombre: 'Feriado trabajado',                 grupo: 'Liquidación' },
  { id: 'presentismo',   nombre: 'Presentismo descontado',            grupo: 'Liquidación' },
  { id: 'francos',       nombre: 'Francos no compensados',            grupo: 'Liquidación' },
  { id: 'vacaciones',    nombre: 'Vacaciones o plus vacacional',      grupo: 'Liquidación' },
  { id: 'sac',           nombre: 'SAC / aguinaldo',                   grupo: 'Liquidación' },
  { id: 'descuento',     nombre: 'Descuento indebido (faltante de caja u otro)', grupo: 'Liquidación' },
  { id: 'categoria',     nombre: 'Categoría de convenio',             grupo: 'Encuadre' },
  { id: 'antiguedad',    nombre: 'Antigüedad mal computada',          grupo: 'Encuadre' },
  { id: 'aumento',       nombre: 'Aumento de convenio no aplicado',   grupo: 'Encuadre' },
  { id: 'asignaciones',  nombre: 'Asignaciones familiares',           grupo: 'Encuadre' },
  { id: 'obraSocial',    nombre: 'Obra social o ART',                 grupo: 'Beneficios' },
  { id: 'uniforme',      nombre: 'Uniforme o elementos de trabajo',   grupo: 'Beneficios' },
  { id: 'otro',          nombre: 'Otro',                              grupo: 'Otros' }
];

const TIPOS_RECLAMO_POR_ID = TIPOS_RECLAMO.reduce((m, x) => { m[x.id] = x; return m; }, {});

/* El estado dice en qué punto del circuito está, y `cerrado` si ya terminó.
   "Procede" todavía está abierto: se cierra cuando el ajuste está pagado. */
const ESTADOS_RECLAMO = [
  { id: 'abierto',    nombre: 'Recibido',                   cerrado: false },
  { id: 'analisis',   nombre: 'En análisis',                cerrado: false },
  { id: 'nomina',     nombre: 'Escalado a Nómina',          cerrado: false },
  { id: 'faltaInfo',  nombre: 'Falta información',          cerrado: false },
  { id: 'procede',    nombre: 'Procede: se ajusta',         cerrado: false },
  { id: 'ajustado',   nombre: 'Ajustado y pagado',          cerrado: true },
  { id: 'sinLugar',   nombre: 'No procede, ya se explicó',  cerrado: true }
];

const ESTADOS_RECLAMO_POR_ID = ESTADOS_RECLAMO.reduce((m, x) => { m[x.id] = x; return m; }, {});

const A_CARGO_RECLAMO = [
  { id: 'rrhh',        nombre: 'RRHH' },
  { id: 'nomina',      nombre: 'Nómina / Liquidaciones' },
  { id: 'tienda',      nombre: 'Gerente de Tienda' },
  { id: 'operaciones', nombre: 'Operaciones' }
];

/** Días que lleva abierto un reclamo. */
function diasDeReclamo(r, hasta) {
  if (!r || !r.fecha) return null;
  const fin = (ESTADOS_RECLAMO_POR_ID[r.estado] || {}).cerrado && r.fechaCierre
    ? r.fechaCierre : (hasta || new Date().toISOString().slice(0, 10));
  const d = Math.round((new Date(fin) - new Date(r.fecha)) / 86400000);
  return isNaN(d) ? null : Math.max(0, d);
}

/**
 * Semáforo por antigüedad del reclamo.
 *
 * Los cortes son de gestión, no legales: a los siete días el colaborador
 * espera una respuesta, a los quince ya está preguntando a otros, y al mes
 * dejó de preguntar, que es la señal peor.
 */
function semaforoReclamo(r) {
  const est = ESTADOS_RECLAMO_POR_ID[r.estado] || {};
  if (est.cerrado) return { clave: 'cerrado', tono: '', texto: est.nombre };
  const d = diasDeReclamo(r);
  if (d === null) return { clave: 'sd', tono: 'ambar', texto: 'sin fecha' };
  if (d <= 7)  return { clave: 'nuevo',   tono: 'verde', texto: `hace ${d} día${d === 1 ? '' : 's'}` };
  if (d <= 15) return { clave: 'demora',  tono: 'ambar', texto: `hace ${d} días` };
  return { clave: 'critico', tono: 'rojo', texto: `hace ${d} días` };
}

/** Consolidado de una lista de reclamos. */
function resumirReclamos(lista) {
  const todos = lista || [];
  const abiertos = todos.filter(r => !(ESTADOS_RECLAMO_POR_ID[r.estado] || {}).cerrado);
  const cerrados = todos.filter(r => (ESTADOS_RECLAMO_POR_ID[r.estado] || {}).cerrado);

  const porTipo = {};
  todos.forEach(r => { porTipo[r.tipo] = (porTipo[r.tipo] || 0) + 1; });

  const porEstado = {};
  todos.forEach(r => { porEstado[r.estado] = (porEstado[r.estado] || 0) + 1; });

  const criticos = abiertos.filter(r => semaforoReclamo(r).clave === 'critico');
  const sinRespuesta = abiertos.filter(r => !String(r.respuesta || '').trim());
  const monto = abiertos.reduce((a, r) => a + (parseFloat(String(r.monto).replace(',', '.')) || 0), 0);

  /* El tipo que más se repite es el dato que sirve: tres reclamos por el mismo
     concepto en la misma tienda no son tres reclamos, son un error de proceso. */
  const top = Object.keys(porTipo)
    .map(t => ({ tipo: t, n: porTipo[t], nombre: (TIPOS_RECLAMO_POR_ID[t] || {}).nombre || t }))
    .sort((a, b) => b.n - a.n)[0] || null;

  const cerradosConFecha = cerrados.filter(r => r.fecha && r.fechaCierre);
  const demoraPromedio = cerradosConFecha.length
    ? cerradosConFecha.reduce((a, r) => a + diasDeReclamo(r), 0) / cerradosConFecha.length
    : null;

  return {
    total: todos.length,
    abiertos, cerrados,
    criticos, sinRespuesta,
    porTipo, porEstado, top,
    montoAbierto: monto,
    demoraPromedio,
    resueltosAFavor: cerrados.filter(r => r.estado === 'ajustado').length
  };
}

/** Patrones que conviene mirar: mismo tipo repetido en la misma sucursal. */
function patronesDeReclamos(lista, sucursales) {
  const porSuc = {};
  (lista || []).forEach(r => {
    const k = r.sucursalId + '|' + r.tipo;
    (porSuc[k] || (porSuc[k] = [])).push(r);
  });
  return Object.keys(porSuc)
    .filter(k => porSuc[k].length >= 2)
    .map(k => {
      const [sucursalId, tipo] = k.split('|');
      const suc = (sucursales || []).find(s => s.id === sucursalId);
      return {
        sucursal: suc ? (suc.nombre || suc.codigo) : 'Sin sucursal',
        tipo: (TIPOS_RECLAMO_POR_ID[tipo] || {}).nombre || tipo,
        casos: porSuc[k].length,
        personas: porSuc[k].map(r => r.colaborador).filter((x, i, a) => x && a.indexOf(x) === i)
      };
    })
    .sort((a, b) => b.casos - a.casos);
}

/* ===================== REPORTE DIARIO DE OPERACIÓN =====================
 *
 * La estadística mensual mide el mes que cerró. Este módulo mide el día que
 * pasó, que es la única escala en la que todavía se puede hacer algo: si hoy
 * faltaron tres personas en una tienda de ocho, la decisión es de hoy a la
 * mañana, no del informe del mes que viene.
 *
 * Las fórmulas son deliberadamente simples —división de enteros, sin
 * prorrateos— porque el dato de entrada es un llamado telefónico, no una
 * liquidación. La precisión fina se paga al cierre del mes.
 */

/* Formateo local en es-AR: los mensajes del día se leen en el teléfono, no en
   una planilla, y "25.0%" ahí se lee como un error de tipeo. */
const _pctDia = (n, d = 1) =>
  (Number(n) * 100).toLocaleString('es-AR', { minimumFractionDigits: d, maximumFractionDigits: d }) + '%';

/** Suma segura de un campo numérico cargado a mano (viene como texto). */
function _num(v) {
  if (v === '' || v === null || v === undefined) return 0;
  const n = Number(String(v).replace(',', '.'));
  return isNaN(n) ? 0 : n;
}

/**
 * KPIs del día para una sucursal.
 *
 * @param d   carga del día para esa sucursal
 * @param par parámetros de configuración (jornada, umbrales)
 */
function calcularDiarioSucursal(d, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const dato = d || {};

  const planificados = _num(dato.planificados);
  const ausentes = Array.isArray(dato.ausentes) ? dato.ausentes.length : 0;
  /* Los presentes se deducen: en la tienda se cuenta quién falta, no quién
     vino. Si el gerente carga los presentes a mano, ese número manda. */
  const presentes = dato.presentes === '' || dato.presentes === undefined || dato.presentes === null
    ? Math.max(0, planificados - ausentes)
    : _num(dato.presentes);
  const minimo = _num(dato.minimo);
  const horasExtras = _num(dato.horasExtras);
  const horasOrdinarias = dato.horasOrdinarias === '' || dato.horasOrdinarias === undefined || dato.horasOrdinarias === null
    ? planificados * p.horasJornada
    : _num(dato.horasOrdinarias);
  const novedades = Array.isArray(dato.novedades) ? dato.novedades.length : 0;

  const controlables = (dato.ausentes || []).filter(a => {
    const m = MOTIVOS_AUSENCIA_DIA.find(x => x.id === a.motivo);
    return m && m.grupo === 'controlable';
  }).length;

  return {
    planificados, presentes, ausentes, minimo, horasExtras, horasOrdinarias,
    novedades, controlables,
    /* Tasa de ausentismo diario = ausentes / dotación planificada */
    pctAusentismo: planificados ? ausentes / planificados : null,
    /* Proporción de horas extras = extras / ordinarias planificadas */
    pctExtras: horasOrdinarias ? horasExtras / horasOrdinarias : null,
    /* FTE real del día = planificados − ausentes + extras/jornada */
    fteReal: planificados ? planificados - ausentes + horasExtras / p.horasJornada : null,
    /* Índice de cobertura = presentes / mínimo requerido para operar */
    cobertura: minimo ? presentes / minimo : null,
    faltanParaMinimo: minimo ? Math.max(0, minimo - presentes) : 0
  };
}

/**
 * Consolida el día de toda el área.
 *
 * Devuelve una fila por sucursal cargada más el total. Las sucursales sin
 * carga quedan aparte: un día sin reportar no es un día sin ausencias, y
 * mezclarlos daría un ausentismo optimista.
 */
function calcularDiario(dia, sucursales, par) {
  const p = Object.assign({}, PARAMETROS_DEFECTO, par || {});
  const carga = (dia && dia.sucursales) || {};
  const ventas = (dia && dia.venta) || {};

  const filas = [];
  const sinCargar = [];

  (sucursales || []).forEach(s => {
    const d = carga[s.id];
    const cargada = d && (String(d.planificados || '').trim() !== '' ||
                          (d.ausentes || []).length || _num(d.horasExtras));
    if (!cargada) { sinCargar.push(s); return; }
    const k = calcularDiarioSucursal(d, p);
    filas.push({ sucursal: s, dato: d, k, venta: ventas[s.id] || null });
  });

  const t = {
    planificados: 0, presentes: 0, ausentes: 0, minimo: 0,
    horasExtras: 0, horasOrdinarias: 0, novedades: 0, controlables: 0
  };
  filas.forEach(f => {
    t.planificados += f.k.planificados;
    t.presentes += f.k.presentes;
    t.ausentes += f.k.ausentes;
    t.minimo += f.k.minimo;
    t.horasExtras += f.k.horasExtras;
    t.horasOrdinarias += f.k.horasOrdinarias;
    t.novedades += f.k.novedades;
    t.controlables += f.k.controlables;
  });

  t.pctAusentismo = t.planificados ? t.ausentes / t.planificados : null;
  t.pctExtras = t.horasOrdinarias ? t.horasExtras / t.horasOrdinarias : null;
  t.fteReal = t.planificados ? t.planificados - t.ausentes + t.horasExtras / p.horasJornada : null;
  t.cobertura = t.minimo ? t.presentes / t.minimo : null;

  /* Venta del día: sirve para leer la cobertura contra lo que efectivamente
     había que atender. Una tienda al 80% de cobertura en un día flojo no es
     el mismo problema que al 80% en un día de promoción bancaria. */
  const venta = { ayer: 0, metaHoy: 0, mes: 0, requerido: 0, transacciones: 0, conDato: 0 };
  filas.forEach(f => {
    if (!f.venta) return;
    venta.conDato++;
    venta.ayer += _num(f.venta.ayer);
    venta.metaHoy += _num(f.venta.metaHoy);
    venta.mes += _num(f.venta.mes);
    venta.requerido += _num(f.venta.requerido);
    venta.transacciones += _num(f.venta.transAyer);
  });
  /* Dos lecturas distintas: la del día se compara contra la meta del día, la
     del mes contra lo requerido acumulado. Mezclarlas da un desvío falso del
     80%, que es lo que pasa si se enfrenta la venta de ayer al requerido del
     mes entero. */
  venta.indexDia = venta.metaHoy ? venta.ayer / venta.metaHoy - 1 : null;
  venta.indexMes = venta.requerido ? venta.mes / venta.requerido - 1 : null;

  return { filas, sinCargar, total: t, venta, par: p };
}

/**
 * Qué hay que mirar hoy. Devuelve alertas ordenadas por gravedad: primero lo
 * que impide operar, después lo que cuesta plata, al final lo que conviene
 * corregir antes de que se vuelva costumbre.
 */
function alertasDiarias(calc) {
  const p = calc.par;
  const A = [];
  const nom = s => (s.nombre && s.nombre.trim()) ? s.nombre.trim() : s.codigo;

  calc.filas.forEach(f => {
    const k = f.k;
    if (k.cobertura !== null && k.cobertura < 1) {
      A.push({
        nivel: 'critico', sucursal: nom(f.sucursal),
        titulo: 'Cobertura por debajo del mínimo',
        texto: `${nom(f.sucursal)} operó con ${k.presentes} persona${k.presentes === 1 ? '' : 's'} ` +
               `sobre un mínimo de ${k.minimo}: falta${k.faltanParaMinimo === 1 ? '' : 'n'} ${k.faltanParaMinimo}.`
      });
    } else if (k.cobertura !== null && k.cobertura < p.coberturaMinima + 0.10 && k.cobertura < 1.05) {
      A.push({
        nivel: 'atencion', sucursal: nom(f.sucursal),
        titulo: 'Cobertura al límite',
        texto: `${nom(f.sucursal)} cubrió el mínimo justo (${k.presentes} sobre ${k.minimo}). ` +
               `Una ausencia más y no abre en condiciones.`
      });
    }
    if (k.pctAusentismo !== null && k.pctAusentismo > p.umbralAusentismo * 2) {
      A.push({
        nivel: k.pctAusentismo > 0.20 ? 'critico' : 'atencion', sucursal: nom(f.sucursal),
        titulo: 'Ausentismo del día alto',
        texto: `${nom(f.sucursal)}: ${k.ausentes} de ${k.planificados} (${_pctDia(k.pctAusentismo)})` +
               (k.controlables
                 ? `, de ${k.controlables === 1 ? 'las cuales 1 es evitable' : `las cuales ${k.controlables} son evitables`}.`
                 : '.')
      });
    }
    if (k.pctExtras !== null && k.pctExtras > p.umbralHorasExtras) {
      A.push({
        nivel: 'atencion', sucursal: nom(f.sucursal),
        titulo: 'Horas extras por encima del umbral',
        texto: `${nom(f.sucursal)}: ${k.horasExtras} hs sobre ${k.horasOrdinarias} planificadas ` +
               `(${_pctDia(k.pctExtras)})` +
               (f.dato.motivoExtras
                 ? ` por ${(MOTIVOS_EXTRAS.find(m => m.id === f.dato.motivoExtras) || {}).nombre.toLowerCase()}.`
                 : ', sin motivo cargado.')
      });
    }
    (f.dato.novedades || []).forEach(n => {
      const t = TIPOS_NOVEDAD_DIA.find(x => x.id === n.tipo);
      A.push({
        nivel: 'critico', sucursal: nom(f.sucursal),
        titulo: 'Vacante a cubrir',
        texto: `${nom(f.sucursal)}: ${t ? t.nombre.toLowerCase() : 'novedad'} de ${n.nombre || 'sin nombre'}.` +
               ` Queda una posición para cubrir.`
      });
    });
  });

  if (calc.sinCargar.length) {
    A.push({
      nivel: 'dato', sucursal: '',
      titulo: 'Sucursales sin reportar',
      texto: `${calc.sinCargar.length} sucursal${calc.sinCargar.length === 1 ? '' : 'es'} sin carga del día: ` +
             calc.sinCargar.map(nom).join(', ') + '. Los indicadores son sobre las que sí reportaron.'
    });
  }

  const orden = { critico: 0, atencion: 1, dato: 2 };
  return A.sort((a, b) => orden[a.nivel] - orden[b.nivel]);
}

/**
 * Acciones para mañana. Se derivan de las alertas, no se inventan: cada una
 * responde a un desvío concreto del día.
 */
function accionesDiarias(calc) {
  const p = calc.par;
  const acc = [];
  const nom = s => (s.nombre && s.nombre.trim()) ? s.nombre.trim() : s.codigo;

  const bajoMinimo = calc.filas.filter(f => f.k.cobertura !== null && f.k.cobertura < 1);
  if (bajoMinimo.length) {
    acc.push(`Cubrir el turno de ${bajoMinimo.map(f => nom(f.sucursal)).join(', ')} antes de la apertura: ` +
             `mover gente de una sucursal cercana o de la lista de flotantes, en ese orden. ` +
             `Autorizar horas extras solo si no hay traslado posible.`);
  }

  const evitables = calc.filas.filter(f => f.k.controlables > 0);
  if (evitables.length) {
    acc.push(`Llamar hoy mismo a quienes faltaron sin justificar en ${evitables.map(f => nom(f.sucursal)).join(', ')}. ` +
             `La falta sin aviso que no se conversa el mismo día se repite.`);
  }

  const extras = calc.filas.filter(f => f.k.pctExtras !== null && f.k.pctExtras > p.umbralHorasExtras);
  const porAusencia = extras.filter(f => f.dato.motivoExtras === 'ausencia');
  if (porAusencia.length) {
    acc.push(`Revisar la grilla de ${porAusencia.map(f => nom(f.sucursal)).join(', ')}: ` +
             `las horas extras se están usando para tapar ausencias, que es la forma más cara de cubrirlas.`);
  } else if (extras.length) {
    acc.push(`Chequear la grilla horaria de ${extras.map(f => nom(f.sucursal)).join(', ')} ` +
             `antes de autorizar más horas extras.`);
  }

  const vacantes = calc.filas.filter(f => (f.dato.novedades || []).length);
  if (vacantes.length) {
    const n = calc.total.novedades;
    acc.push(`Abrir la búsqueda de ${n === 1 ? 'la vacante' : `las ${n} vacantes`} ` +
             `de ${vacantes.map(f => nom(f.sucursal)).join(', ')} y definir quién cubre mientras tanto.`);
  }

  if (calc.sinCargar.length >= 3) {
    acc.push(`Pedir el reporte del día a las ${calc.sinCargar.length} sucursales que no lo mandaron: ` +
             `sin ese dato el indicador del área queda incompleto.`);
  }

  if (!acc.length) {
    acc.push('Sin desvíos que exijan acción: sostener la grilla como está y usar el día para lo planificado.');
  }
  return acc.slice(0, 4);
}

/* =========================== IMPORTADOR RDV ===========================
 *
 * El Reporte Diario de Ventas (RDV) que llega todas las mañanas trae, por
 * tienda, la venta de ayer, la de la semana, la del mes, lo requerido para
 * llegar al objetivo y las transacciones. Se pega la hoja "RDV Operaciones"
 * y se cruza contra el padrón por nombre de tienda.
 */

/** Encabezados de la hoja de operaciones, normalizados. */
const COLUMNAS_RDV = {

<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Panel de Control de RRHH · Farmatodo</title>
  <meta name="description" content="Tablero de visitas a sucursales, FTE real, costo laboral y seguimiento de RRHH.">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🏪</text></svg>">
  <link rel="stylesheet" href="assets/css/styles.css">
</head>
<body>

  <header class="app">
    <div class="marca">
      <strong>Panel de Control de RRHH</strong>
      <span>Farmatodo</span>
    </div>
    <div class="crece"></div>
    <select id="selector-sucursal" title="Ir a la última visita de una sucursal"></select>
    <button data-accion="nueva-visita-selector">+ Nueva visita</button>
    <button data-accion="bloquear" id="btn-bloquear" hidden title="Cerrar el panel y volver a pedir la clave">Bloquear</button>
  </header>

  <!-- Agrupada por ritmo de trabajo, no por módulo: lo de hoy, lo de la
       tienda y lo del mes cerrado. Antes eran ocho solapas en fila y no se
       veía cuál era cuál. -->
  <nav class="tabs principal">
    <a href="#/red">Panel</a>

    <span class="grupo">Cada día</span>
    <a href="#/diario" title="Reporte del día: cómo abrió el área">RVD</a>

    <span class="grupo">En la tienda</span>
    <a href="#/sucursales">Sucursales</a>
    <a href="#/visitas">Visitas</a>
    <a href="#/reclamos">Reclamos</a>
    <a href="#/movimientos">Cesiones y bajas</a>

    <span class="grupo">Cierre del mes</span>
    <a href="#/estadistica">Estadística</a>

    <a href="#/asistente" class="al-final">Asistente</a>
    <a href="#/config" title="Configuración">Configuración</a>
  </nav>

  <main id="contenido"></main>

  <footer class="app">
    Los datos se guardan únicamente en este navegador. Exportá un respaldo desde <em>Configuración</em> antes de cambiar de equipo.
  </footer>

  <script src="assets/js/catalogos.js"></script>
  <script src="assets/js/sucursales-area3.js"></script>
  <script src="assets/js/plantel-area3.js"></script>
  <script src="assets/js/modelo.js"></script>
  <script src="assets/js/talento.js"></script>
  <script src="assets/js/novedades.js"></script>
  <script src="assets/js/nomina.js"></script>
  <script src="assets/js/convenio.js"></script>
  <script src="assets/js/ausencias.js"></script>
  <script src="assets/js/checklist.js"></script>
  <script src="assets/js/reclamos.js"></script>
  <script src="assets/js/agenda.js"></script>
  <script src="assets/js/asistente.js"></script>
  <script src="assets/js/diario.js"></script>
  <script src="assets/js/acceso.js"></script>
  <script src="assets/js/store.js"></script>
  <script src="assets/js/reporte.js"></script>
  <script src="assets/js/app.js"></script>
</body>
</html>
